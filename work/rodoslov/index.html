  { id: "lidiya", gen: 3, rel: "бабушка, мама мамы", x: 502, y: 548, n: ["Лидия Серафимовна"], yr: "", tg: "", st: "living", parents: ["serafim", "olgaV"], facts: [] },

const GEN = { 3: "бабушки и дедушки", 4: "прадеды", 5: "прапрадеды", 6: "прапрапрадеды" };
const byId = Object.fromEntries(P.map(p => [p.id, p]));
const dims = p => p.s ? [w, h] : [W, H];
const NS = "http://www.w3.org/2000/svg";
const world = document.getElementById("world");
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

function draw() {
  const bg = el("g", {}, world), eg = el("g", {}, world), ng = el("g", {}, world);
  const minX = Math.min(...P.map(p => p.x)) - 200, maxX = Math.max(...P.map(p => p.x + dims(p)[0])) + 40;
  [...new Set(P.map(p => p.gen))].sort().forEach(gn => {
    const row = P.filter(p => p.gen === gn), top = Math.min(...row.map(p => p.y)) - 22, bot = Math.max(...row.map(p => p.y + dims(p)[1])) + 22;
    el("rect", { class: "band", x: minX, y: top, width: maxX - minX, height: bot - top, rx: 10 }, bg);
    const a = el("text", { class: "band-n", x: minX + 16, y: top + 30 }, bg); a.textContent = gn + "-е колено";
    const b = el("text", { class: "band-r", x: minX + 16, y: top + 48 }, bg); b.textContent = GEN[gn];
  });
  const couples = new Map();
  P.forEach(p => { if (p.parents) { const k = p.parents.join("|"); if (!couples.has(k)) couples.set(k, []); couples.get(k).push(p); } });
  couples.forEach((kids, k) => {
    const [a, b] = k.split("|").map(i => byId[i]);
    const [aw, ah] = dims(a);
    const cy = a.y + ah / 2, x1 = a.x + aw, x2 = b.x, mx = (x1 + x2) / 2;
    const hyp = kids.some(c => c.hypParents) || (a.st === "hyp" && b.st === "hyp");
    el("line", { x1, y1: cy, x2, y2: cy, class: "couple" + (a.st === "hyp" ? " hyp" : "") }, eg);
    const busY = Math.min(...kids.map(c => c.y)) - 24;
    kids.forEach(c => {
      const [cw] = dims(c), cx = c.x + cw / 2;
      el("path", { d: `M${mx},${cy} V${busY} H${cx} V${c.y}`, class: "edge" + (hyp ? " hyp" : "") }, eg);
    });
  });
  P.forEach(p => {
    const [pw, ph] = dims(p);
    const g = el("g", { class: `node ${p.st}`, transform: `translate(${p.x},${p.y})`, tabindex: 0, role: "button", "aria-label": p.n.join(" ") + " " + p.yr, "data-id": p.id }, ng);
    el("rect", { class: "card", width: pw, height: ph, rx: 7 }, g);
    el("circle", { class: "gen", cx: pw - 14, cy: 15, r: 10 }, g);
    const gt = el("text", { class: "gent", x: pw - 14, y: 19, "text-anchor": "middle" }, g); gt.textContent = p.gen;
    const t1 = el("text", { class: "nm", x: 12, y: 21 }, g); t1.textContent = p.n[0];
    if (p.n[1]) { const t2 = el("text", { class: "nm", x: 12, y: 38, style: p.s ? "font-size:12.5px" : "" }, g); t2.textContent = p.n[1]; }
    if (p.st === "living") { const t = el("text", { class: "tg", x: 12, y: 44 }, g); t.textContent = "жива — данные скрыты"; }
    else {
      const ty = el("text", { class: "yr", x: 12, y: p.s ? 55 : 56 }, g); ty.textContent = p.yr;
      if (!p.s && p.tg) { const tt = el("text", { class: "tg", x: 12, y: 71 }, g); tt.textContent = p.tg.length > 34 ? p.tg.slice(0, 33) + "…" : p.tg; }
      const nd = new Set(p.facts.flatMap(f => f[3])).size;
      if (nd) { const td = el("text", { class: "docs", x: pw - 10, y: p.s ? 55 : 56, "text-anchor": "end" }, g); td.textContent = "▤ " + nd; }
    }
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p.id, true); } });
  });
}

/* pan & zoom */
const svg = document.getElementById("svg"), stage = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
const clampK = k => Math.min(3, Math.max(0.25, k));
function zoomAt(f, cx, cy) { const k = clampK(view.k * f); f = k / view.k; view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply(); }
function fit() {
  const b = world.getBBox(), r = svg.getBoundingClientRect(), pad = 30;
  const k = clampK(Math.min((r.width - pad * 2) / b.width, (r.height - pad * 2) / b.height));
  view.k = k; view.x = (r.width - b.width * k) / 2 - b.x * k; view.y = (r.height - b.height * k) / 2 - b.y * k; apply();
}
function centerOn(id) {
  const p = byId[id], [pw, ph] = dims(p), r = svg.getBoundingClientRect();
  view.x = r.width / 2 - (p.x + pw / 2) * view.k; view.y = r.height / 2 - (p.y + ph / 2) * view.k; apply();
}
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const ptrs = new Map(); let moved = 0, pinch = null, downTarget = null;
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  downTarget = e.target.closest(".node");
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
  stage.classList.add("dragging");
});
svg.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; moved += 10; return;
  }
  const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy);
  view.x += dx; view.y += dy; apply();
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { stage.classList.remove("dragging"); if (moved < 6 && downTarget) select(downTarget.dataset.id, false); }
};
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
const mid = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById("zin").onclick = () => zoomAt(1.25, ...mid());
document.getElementById("zout").onclick = () => zoomAt(0.8, ...mid());
document.getElementById("zfit").onclick = fit;

/* dossier */
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chip = st => `<span class="chip st-${st}">${ST[st]}</span>`;
function select(id, center) {
  document.querySelectorAll(".node.sel").forEach(n => n.classList.remove("sel"));
  const g = document.querySelector(`.node[data-id="${id}"]`); if (g) g.classList.add("sel");
  const p = byId[id]; if (center) centerOn(id);
  const name = p.n.join(" ");
  if (p.st === "living") {
    panel.innerHTML = `<div class="eyebrow">Карточка</div><h2>${esc(name)}</h2>${kin(p)}<span class="status st-living">${ST.living}</span>
      <p class="note sec">Живые родственники показаны только именем: даты, адреса и документы о них сюда не попадают.</p>${relHtml(p)}`;
    bindRel(); return;
  }
  const docIds = [...new Set(p.facts.flatMap(f => f[3]))];
  panel.innerHTML = `<div class="eyebrow">Карточка</div><h2>${esc(name)}</h2><div class="years">${esc(p.yr)}</div>${kin(p)}
    <span class="status st-${p.st}">${ST[p.st]}</span>${p.tg ? `<div class="note" style="margin-top:6px">${esc(p.tg)}</div>` : ""}
    <div class="sec"><h3>Факты</h3><ul class="facts">${p.facts.map(f => `<li><div class="k"><b>${esc(f[0])}</b>${chip(f[2])}</div><div class="v">${esc(f[1])}</div>
      ${f[3].length ? `<div class="refs">${f[3].map(d => `<button type="button" class="ref" data-doc="${d}">${esc(DOCS[d].ref)}</button>`).join("")}</div>` : ""}</li>`).join("")}</ul></div>
    ${relHtml(p)}
    <div class="sec"><h3>Документы · ${docIds.length}</h3><div class="gallery">${docIds.map(d => { const x = DOCS[d];
      return `<button type="button" class="doccard" data-doc="${d}">${x.img ? `<img src="${x.img}" alt="Скан: ${esc(x.t)}" loading="lazy">` : `<div class="noimg">${x.url ? "скан в архиве, откроется ссылкой" : "семейный документ, хранится в деле"}</div>`}
        <div class="meta"><span class="t">${esc(x.t)}</span><span class="r">${esc(x.d)} · ${esc(x.ref)}</span></div></button>`; }).join("") || `<p class="empty">Документов пока нет.</p>`}</div></div>`;
  panel.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(b.dataset.doc));
  bindRel();
}
const kin = p => `<div class="kin"><b>${p.gen}-е колено</b> от Михаила · ${esc(p.rel)}</div>`;
function relHtml(p) {
  const par = (p.parents || []).map(i => byId[i]);
  const kids = P.filter(c => c.parents && c.parents.includes(p.id));
  const spouse = P.filter(c => c.parents && c.parents.includes(p.id)).flatMap(c => c.parents).filter(i => i !== p.id).map(i => byId[i]);
  const sib = p.parents ? P.filter(c => c.id !== p.id && c.parents && c.parents.join() === p.parents.join()) : [];
  const grp = (label, arr) => arr.length ? `<div class="sec"><h3>${label}</h3><div class="rel">${[...new Map(arr.map(a => [a.id, a])).values()].map(a => `<button type="button" data-go="${a.id}">${esc(a.n[0])} <small>${esc(a.yr || "")}</small></button>`).join("")}</div></div>` : "";
  return grp(p.hypParents ? "Родители (гипотеза)" : "Родители", par) + grp("Супруг(а)", spouse) + grp("Братья и сёстры", sib) + grp("Дети", kids);
}
function bindRel() { panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go, true)); }

/* lightbox */
const lb = document.getElementById("lb");
function openDoc(d) {
  const x = DOCS[d];
  document.getElementById("lb-t").textContent = x.t;
  document.getElementById("lb-pic").innerHTML = x.img ? `<img src="${x.img}" alt="Скан: ${esc(x.t)}">`
    : `<p style="color:#c9d2ce;padding:24px;max-width:46ch">${x.url ? "Скан пока не сохранён в деле. Его можно открыть в архиве по ссылке ниже." : "Семейный документ хранится в деле исследования и в веб-версию не выкладывается."}</p>`;
  document.getElementById("lb-f").innerHTML = `<span>${esc(x.d)}</span><code>${esc(x.ref)}</code>${x.url ? `<a href="${x.url}" target="_blank" rel="noopener">Открыть в «Поиске по архивам» ↗</a>` : ""}`;
  lb.hidden = false; document.getElementById("lb-x").focus();
}
document.getElementById("lb-x").onclick = () => lb.hidden = true;
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });

/* theme */
const root = document.documentElement;
function setTheme(t) {
  if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  try { localStorage.setItem("rodoslov-theme", t); } catch (e) {}
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setTheme(b.dataset.t));
let saved = null; try { saved = localStorage.getItem("rodoslov-theme"); } catch (e) {}
setTheme(saved || (root.getAttribute("data-theme") || "system"));

draw(); requestAnimationFrame(() => {
  if (svg.getBoundingClientRect().width < 640) { view.k = 0.95; centerOn("olgaV"); } else fit();
  select("olgaV", false);
});

</script>
