<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Проверка безопасности</title>
    <style>
         
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 370px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
        }

        .logo {
            display: flex;
            margin-bottom: 1.5rem;
        }

        .logo img {
            max-height: 60px;
            width: auto;
        }

        .title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.8rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #6b7a8f;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .description {
            font-size: 0.85rem;
            color: #5c6f87;
            margin-bottom: 1.8rem;
            line-height: 1.4;
        }

        .loader {
            display: block;
            width: 44px;
            height: 44px;
            border: 4px solid #e0e7ef;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 2.0s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hint {
            font-size: 0.75rem;
            color: #b0bccd;
            margin-top: 4px;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #b0bccd;
            border-top: 1px solid #edf2f7;
            padding-top: 1.2rem;
            margin-bottom: 0.3rem;
        }

        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }

         
        .instruction {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e2edf2;
            min-height: 287px;
        }

        .instruction-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            margin-bottom: 0.675rem;
        }

        .instruction-text {
            font-size: 0.85rem;
            color: #1e3a5f;
            line-height: 1.3;
            flex: 1;
        }

        .hint-box {
            background: white;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .hint-box img {
            display: block;
            max-height: 56px;
            width: auto;
            border-radius: 8px;
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.6rem;
            border-radius: 14px;
            display: none;
            margin-bottom: 12px;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
        }

        .image-container {
            position: relative;
            display: flex;
            justify-content: center;
            width: 100%;
            margin: 0;
            line-height: 0;
        }

        .captcha-image {
            max-width: 100%;
            border-radius: 0.375rem;
            border: 1px solid #dee2e6;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .click-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            cursor: crosshair;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 1rem 0 0.5rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #4a627a;
        }

        .icon-btn:hover {
            background: #eef2f6;
            transform: scale(1.02);
        }

        .submit-btn {
            background: #4e87ff;
            border: none;
            color: white;
            padding: 0.675rem 1.5rem;
            border-radius: 0.375rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #9bb9e0;
            cursor: not-allowed;
        }

        .submit-btn .loader {
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            margin-right: 6px;
            vertical-align: middle;
        }

        .verification-check {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            pointer-events: none;
            width: 0;
            height: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

         
        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

         
        @media (prefers-color-scheme: dark) {
            body {
                background: #1e2633;
            }

            .container {
                background: #2a3344;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .title {
                color: #e8edf5;
            }

            .subtitle, .status-text {
                color: #b8c4d6;
            }

            .hint {
                color: #8a9bb0;
            }

            .loader {
                border-color: #3a485c;
                border-top-color: #4a8af4;
            }

            .footer {
                border-top-color: #3a485c;
                color: #6a7a8f;
            }

            .footer a {
                color: #6a9af5;
            }

            .instruction {
                border-color: #3a485c;
            }

            .instruction-text {
                color: #e0e8f0;
            }

            .error-message {
                background: #4a1a1a;
                color: #ffa0a0;
            }

            .captcha-image {
                border-color: #4a5a6a;
            }

            .icon-btn {
                color: #a0b0c0;
            }

            .icon-btn:hover {
                background: #3a4a5a;
            }
        }

         
        @media (max-width: 450px) {
            .container {
                padding: 1.2rem;
            }

            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1.6rem;
            }
        }
    </style>
</head>

    (function() {

        function switchView(view) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('view-' + view);
            if (target) target.classList.add('active');

                initCaptcha();
            }
            if (view === 'metrics' && !window._metricsInitialized) {

            const view = event.state && event.state.view ? event.state.view : (window.location.pathname.includes('captcha') ? 'captcha' : 'metrics');
            switchView(view);

        let metricsInitialized = false;

        async function initMetrics() {
            if (metricsInitialized) return;
            metricsInitialized = true;

            const BEHAVIOR_KEY = '';
            const BEHAVIOR_ENC_KEY = '';
            const COLLECT_URL = '/api/v1/behavior/verify';

            async function encryptData(data, encKeyBase64) {
                try {
                    const encKey = Uint8Array.from(atob(encKeyBase64), c => c.charCodeAt(0));
                    const encoder = new TextEncoder();
                    const plaintext = encoder.encode(JSON.stringify(data));
                    const cryptoKey = await crypto.subtle.importKey(
                        'raw',
                        encKey,
                        { name: 'AES-GCM' },
                        false,
                        ['encrypt']
                    );
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const encrypted = await crypto.subtle.encrypt(
                        { name: 'AES-GCM', iv: iv },
                        cryptoKey,
                        plaintext
                    );
                    const combined = new Uint8Array(iv.length + encrypted.byteLength);
                    combined.set(iv, 0);
                    combined.set(new Uint8Array(encrypted), iv.length);
                    return btoa(String.fromCharCode.apply(null, combined));
                } catch (e) {
                    console.error('Encryption failed:', e);
                    throw e;
                }
            }

                    ctx.fillStyle = '#069';
                    ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 0, 0);
                    ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                    ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
                    metrics.canvasFingerprint = canvas.toDataURL().slice(0, 200);
                } catch (e) {
                    metrics.canvasFingerprint = 'error';

                try {

                        metrics.webglMaxVertexAttribs = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
                    } else {
                        metrics.webglVendor = 'no_webgl';
                    }
                } catch (e) {
                    metrics.webglVendor = 'error';
                }
                metrics.hasChrome = !!(window.chrome && (window.chrome.runtime || window.chrome.loadTimes || window.chrome.csi || window.chrome.app));
                metrics.hasWebStore = !!(window.chrome && window.chrome.webstore);
                metrics.vendor = navigator.vendor || '';
                if (navigator.connection) {
                    metrics.connection = {
                        type: navigator.connection.effectiveType,
                        rtt: navigator.connection.rtt,
                        downlink: navigator.connection.downlink,
                    };
                } else {
                    metrics.connection = null;
                }
                if (performance.memory) {
                    metrics.memory = {
                        jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
                        totalJSHeapSize: performance.memory.totalJSHeapSize,
                        usedJSHeapSize: performance.memory.usedJSHeapSize,
                    };
                } else {
                    metrics.memory = null;
                }
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        metrics.battery = {
                            charging: battery.charging,
                            level: battery.level,
                        };
                    } catch (e) {
                        metrics.battery = null;
                    }
                }
                metrics.hasNotification = !!(window.Notification);
                metrics.hasPushManager = !!(window.PushManager);
                metrics.hasPermissions = !!(navigator.permissions);
                metrics.hasFocus = document.hasFocus();
                if (screen.orientation) {
                    metrics.screenOrientation = screen.orientation.type;
                }

                
                const pluginNames = [];
                try {
                    for (let i = 0; i < Math.min(navigator.plugins.length, 10); i++) {
                        const plugin = navigator.plugins[i];
                        if (plugin && plugin.name) {
                            pluginNames.push(plugin.name);
                        }
                    }
                } catch (e) {
                    
                }
                metrics.pluginNames = pluginNames;

                return metrics;
            }

            
            async function collectMetrics() {
                const data = {
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    languages: navigator.languages || [],
                    platform: navigator.platform,
                    hardwareConcurrency: navigator.hardwareConcurrency || 0,
                    deviceMemory: navigator.deviceMemory || 0,
                    headless: {
                        webdriver: !!(navigator.webdriver),
                        pluginsEmpty: navigator.plugins.length === 0,
                        languagesEmpty: (navigator.languages || []).length === 0,
                        headlessUA: /Headless/i.test(navigator.userAgent),
                        puppeteer: /Puppeteer/i.test(navigator.userAgent),
                        phantom: /PhantomJS/i.test(navigator.userAgent),
                        nightmare: /Nightmare/i.test(navigator.userAgent),
                    },
                    touchEvents: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
                    screenWidth: window.screen.width,
                    screenHeight: window.screen.height,
                    windowInnerWidth: window.innerWidth,
                    windowInnerHeight: window.innerHeight,
                    pageLoadTime: performance.now(),
                    cookiesEnabled: navigator.cookieEnabled,
                    clicks: [],
                    mouseMovements: [],
                    scrolls: [],
                    keyPresses: [],
                    clickTimestamps: [],
                    firstInteractionTime: null,
                    lastInteractionTime: null,
                    extended: await getExtendedMetrics(),
                };

                let clickCount = 0;
                let mouseMoveCount = 0;
                let scrollCount = 0;
                let keyCount = 0;
                let startTime = Date.now();

                function recordClick(e) {
                    const now = Date.now();
                    data.clickTimestamps.push(now);
                    data.clicks.push({ x: e.clientX, y: e.clientY, time: now - startTime });
                    if (!data.firstInteractionTime) data.firstInteractionTime = now - startTime;
                    data.lastInteractionTime = now - startTime;
                    clickCount++;
                }

                function recordMouseMove(e) {
                    mouseMoveCount++;
                    if (mouseMoveCount % 10 === 0) {
                        data.mouseMovements.push({ x: e.clientX, y: e.clientY, time: Date.now() - startTime });
                    }
                    if (!data.firstInteractionTime) data.firstInteractionTime = Date.now() - startTime;
                    data.lastInteractionTime = Date.now() - startTime;
                }

                function recordScroll() {
                    scrollCount++;
                    data.scrolls.push({ scrollY: window.scrollY, time: Date.now() - startTime });
                    if (!data.firstInteractionTime) data.firstInteractionTime = Date.now() - startTime;
                    data.lastInteractionTime = Date.now() - startTime;
                }

                function recordKey(e) {
                    keyCount++;
                    data.keyPresses.push({ key: e.key || e.code, time: Date.now() - startTime });
                    if (!data.firstInteractionTime) data.firstInteractionTime = Date.now() - startTime;
                    data.lastInteractionTime = Date.now() - startTime;
                }

                document.addEventListener('click', recordClick);
                document.addEventListener('mousemove', recordMouseMove);
                document.addEventListener('scroll', recordScroll, { passive: true });
                document.addEventListener('keydown', recordKey);

                let waitTime = Math.floor(Math.random() * (MAX_WAIT_MS - MIN_WAIT_MS + 1)) + MIN_WAIT_MS;
                waitTime = Math.min(waitTime, 8000);

                async function sendMetrics() {
                    document.removeEventListener('click', recordClick);
                    document.removeEventListener('mousemove', recordMouseMove);
                    document.removeEventListener('scroll', recordScroll);
                    document.removeEventListener('keydown', recordKey);

                    data.totalTimeMs = Date.now() - startTime;
                    data.clickCount = clickCount;
                    data.mouseMoveCount = mouseMoveCount;
                    data.scrollCount = scrollCount;
                    data.keyCount = keyCount;

                    const intervals = [];
                    for (let i = 1; i < data.clickTimestamps.length; i++) {
                        intervals.push(data.clickTimestamps[i] - data.clickTimestamps[i - 1]);
                    }
                    data.clickIntervals = intervals;

                    try {
                        const encryptedMeta = await encryptData(data, BEHAVIOR_ENC_KEY);

                        const response = await fetch(COLLECT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({
                                key: BEHAVIOR_KEY,
                                encryptedMeta: encryptedMeta,
                                returnTo: RETURN_TO
                            })
                        });

                        if (!response.ok) {
                            
                            if (response.status === 403) {
                                switchView('captcha');
                                return;
                            }
                            throw new Error('Server error');
                        }

                        const result = await response.json();
                        if (result.redirectTo) {
                            window.location.href = result.redirectTo;
                        } else {
                            window.location.href = RETURN_TO;
                        }
                    } catch (error) {
                        console.warn('Behavior check failed, redirecting anyway:', error);
                        window.location.href = RETURN_TO;
                    }
                }

                setTimeout(sendMetrics, waitTime);
            }

            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', collectMetrics);
            } else {
                await collectMetrics();
            }
        }

        
        let captchaInitialized = false;

        function initCaptcha() {
            if (captchaInitialized) return;
            captchaInitialized = true;
            window._captchaInitialized = true;

            let captchaKey = '';
            let points = [];
            let isSubmitting = false;
            let currentEncKey = null;

            
            const img = document.getElementById('captchaImg');
            const thumbImg = document.getElementById('thumbImg');
            const canvas = document.getElementById('clickCanvas');
            const ctx = canvas.getContext('2d');
            const errorDiv = document.getElementById('captchaError');
            const submitBtn = document.getElementById('submitBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            const clearPointsBtn = document.getElementById('clearPointsBtn');

            function showError(msg) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
                setTimeout(() => errorDiv.style.display = 'none', 5000);
            }

            function redrawCanvas() {
                if (!img.complete || img.naturalWidth === 0) return;
                const rect = img.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                points.forEach((point, idx) => {
                    const scaleX = canvas.width / img.naturalWidth;
                    const scaleY = canvas.height / img.naturalHeight;
                    const cx = point.x * scaleX;
                    const cy = point.y * scaleY;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 11, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255, 99, 71, 0.85)';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.font = 'bold 13px system-ui, "Segoe UI"';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText((idx + 1).toString(), cx, cy);
                });
            }

            function updateCanvasAndDraw() {
                if (img.complete && img.naturalWidth > 0) {
                    canvas.style.display = 'block';
                    redrawCanvas();
                } else {
                    canvas.style.display = 'none';
                }
            }

            async function loadCaptcha() {
                try {
                    const resp = await fetch('/api/v1/captcha/gen');
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const data = await resp.json();
                    captchaKey = data.key;
                    img.src = data.image;
                    img.style.display = 'block';
                    thumbImg.src = data.thumb;
                    thumbImg.style.display = 'block';
                    if (data.encKey) {
                        const rawKey = Uint8Array.from(atob(data.encKey), c => c.charCodeAt(0));
                        currentEncKey = await crypto.subtle.importKey(
                            'raw', rawKey,
                            { name: 'AES-GCM' },
                            false, ['encrypt']
                        );
                    }
                    points = [];
                    submitBtn.disabled = false;
                    errorDiv.style.display = 'none';
                    canvas.style.display = 'none';
                    img.onload = () => updateCanvasAndDraw();
                    if (img.complete) updateCanvasAndDraw();
                } catch (err) {
                    console.error(err);
                    showError('Не удалось загрузить капчу. Обновите страницу.');
                    img.style.display = 'none';
                    thumbImg.style.display = 'none';
                    canvas.style.display = 'none';
                    submitBtn.disabled = true;
                }
            }

            async function encryptMeta(metaObj) {
                if (!currentEncKey) return null;
                const encoder = new TextEncoder();
                const plaintext = encoder.encode(JSON.stringify(metaObj));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    currentEncKey,
                    plaintext
                );
                const combined = new Uint8Array(iv.length + encrypted.byteLength);
                combined.set(iv);
                combined.set(new Uint8Array(encrypted), iv.length);
                return btoa(String.fromCharCode.apply(null, combined));
            }

            function getClickPosition(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = img.naturalWidth / rect.width;
                const scaleY = img.naturalHeight / rect.height;
                let x = (e.clientX - rect.left) * scaleX;
                let y = (e.clientY - rect.top) * scaleY;
                x = Math.min(img.naturalWidth, Math.max(0, x));
                y = Math.min(img.naturalHeight, Math.max(0, y));
                return { x, y };
            }

            function addPoint(e) {
                if (isSubmitting) return;
                const pos = getClickPosition(e);
                points.push(pos);
                redrawCanvas();
            }

            function onCanvasClick(e) { addPoint(e); }
            function onCanvasTouch(e) {
                e.preventDefault();
                const touch = e.touches[0];
                if (!touch) return;
                addPoint({ clientX: touch.clientX, clientY: touch.clientY });
            }

            function removeLastPoint(e) {
                e.preventDefault();
                if (points.length > 0) {
                    points.pop();
                    redrawCanvas();
                }
            }

            function clearPoints() {
                if (points.length > 0) {
                    points = [];
                    redrawCanvas();
                }
            }

            async function verifyCaptcha() {
                if (isSubmitting) return;
                if (points.length === 0) {
                    showError('❌ Вы не отметили ни одной фигуры.');
                    return;
                }

                const humanChecked = document.getElementById('human_check').checked;

                
                const meta = {
                    clickIntervals: [],
                    clickCount: points.length,
                    totalTimeMs: 0,
                    touchEvents: 'ontouchstart' in window,
                    userAgent: navigator.userAgent,
                    human_check: humanChecked,
                    headless: {
                        webdriver: !!(navigator.webdriver),
                        pluginsEmpty: navigator.plugins.length === 0,
                        languagesEmpty: (navigator.languages || []).length === 0,
                        headlessUA: /Headless/i.test(navigator.userAgent),
                        puppeteer: /Puppeteer/i.test(navigator.userAgent),
                    }
                };
                const encryptedMeta = await encryptMeta(meta);
                if (!encryptedMeta) {
                    showError('Ошибка шифрования данных. Обновите страницу.');
                    return;
                }

                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loader"></span> Проверка...';

                try {
                    const resp = await fetch('/api/v1/captcha/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            key: captchaKey,
                            dots: points.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
                            returnTo: RETURN_TO,
                            meta: encryptedMeta
                        })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        window.location.href = data.redirectTo;
                    } else {
                        showError(data.error || '❌ Неверное решение или подозрительное поведение. Попробуйте ещё раз.');
                        await loadCaptcha();
                    }
                } catch (err) {
                    console.error(err);
                    showError('Сетевая ошибка. Попробуйте позже.');
                    await loadCaptcha();
                } finally {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Отправить';
                }
            }

            
            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('contextmenu', removeLastPoint);
            canvas.addEventListener('touchstart', onCanvasTouch);
            canvas.addEventListener('touchmove', e => e.preventDefault());

            refreshBtn.addEventListener('click', loadCaptcha);
            clearPointsBtn.addEventListener('click', clearPoints);
            submitBtn.addEventListener('click', verifyCaptcha);

            window.addEventListener('resize', () => {
                if (img.complete && img.naturalWidth > 0) redrawCanvas();
            });

            
            loadCaptcha();
        }

        
        document.addEventListener('DOMContentLoaded', function() {
            const currentView = VIEW;
            if (currentView === 'metrics' || currentView === 'captcha') {
                switchView(currentView);
            } else {
                const path = window.location.pathname;
                if (path.includes('captcha')) {
                    switchView('captcha');
                } else {
                    switchView('metrics');
                }
            }
        });

        
        window.switchView = switchView;

    })();
</script>
</body>
</html>
