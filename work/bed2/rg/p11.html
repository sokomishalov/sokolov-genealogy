<div class="mobile-menu-toggle">

<script>

document.addEventListener('DOMContentLoaded', function() {
    var sidebar = document.querySelector('.sidebar');
    var mobileMenuIcon = document.getElementById('mobileMenuIcon');
    var menuToggle = document.getElementById('menu-toggle');
    var menuOverlay = document.getElementById('menuOverlay');

    function toggleMenu(force) {
        if (force === undefined) {
            force = !sidebar.classList.contains('active');
        }
        if (force) {
            sidebar.classList.add('active');
            if (menuOverlay) menuOverlay.classList.add('active');
            if (menuToggle) menuToggle.checked = true;
        } else {
            sidebar.classList.remove('active');
            if (menuOverlay) menuOverlay.classList.remove('active');
            if (menuToggle) menuToggle.checked = false;
        }
    }

    if (mobileMenuIcon) {
        mobileMenuIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMenu();
        });
    }

    if (menuToggle) {
        menuToggle.addEventListener('change', function() {
            toggleMenu(this.checked);
        });
    }

    if (menuOverlay) {
        menuOverlay.addEventListener('click', function() {
            toggleMenu(false);
        });
    }

    document.querySelectorAll('.sidebar a').forEach(function(link) {
        link.addEventListener('click', function() {
            toggleMenu(false);
        });
    });

    document.addEventListener('click', function(e) {
        if (sidebar && sidebar.classList.contains('active')) {
            if (!sidebar.contains(e.target) && mobileMenuIcon && !mobileMenuIcon.contains(e.target)) {
                toggleMenu(false);
            }
        }
    });

    // Мобильный поиск (оставляем как есть)
    var searchIcon = document.getElementById('mobileSearchIcon');
    var searchPanel = document.getElementById('mobileSearchPanel');
    var searchClose = document.getElementById('searchCloseBtn');
    var searchOverlay = document.getElementById('mobileSearchOverlay');
    var searchForm = document.getElementById('mobileSearchForm');
    var searchInput = document.getElementById('mobileSearchInput');
	
	if (searchPanel) {
		searchPanel.classList.remove('active');
	}

    function openSearch() {
        if (searchPanel) searchPanel.classList.add('active');
        if (searchOverlay) searchOverlay.classList.add('active');
        setTimeout(function() { searchInput?.focus(); }, 100);
    }

    function closeSearch() {
        if (searchPanel) searchPanel.classList.remove('active');
        if (searchOverlay) searchOverlay.classList.remove('active');
    }

    if (searchIcon) {
        searchIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            openSearch();
        });
    }
    if (searchClose) searchClose.addEventListener('click', closeSearch);
    if (searchOverlay) searchOverlay.addEventListener('click', closeSearch);

    if (searchForm) {
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            var s = searchInput.value.trim();
            if (s.length > 0) {
                var isStrict = document.querySelector('input[name="mobileSearchType"]:checked').value === 'strict';
                var url = isStrict ? '/strict-search/' + translitToLatin(s) : '/search/' + translitToLatin(s);
                window.location.href = url;
            }
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && searchPanel?.classList.contains('active')) {
            closeSearch();
        }
    });
});

// Кнопка "Показать ещё"
var loadMoreBtn = document.querySelector('.load-more-btn');
if (loadMoreBtn) {
    var currentPage = parseInt(loadMoreBtn.dataset.page);
    var totalPages = parseInt(loadMoreBtn.dataset.totalPages);
    var baseUrl = loadMoreBtn.dataset.baseUrl;
    var isLoading = false;
    
    loadMoreBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (isLoading) return;
        if (currentPage > totalPages) {
            this.style.display = 'none';
            return;
        }
        
        isLoading = true;
        var loader = document.querySelector('.load-more-loader');
        if (loader) loader.style.display = 'block';
        this.style.display = 'none';
        
        var url = baseUrl + '/page_' + currentPage;
        
        fetch(url, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(function(response) { 
            if (!response.ok) throw new Error('Network error');
            return response.text(); 
        })
        .then(function(html) {
            var temp = document.createElement('div');
            temp.innerHTML = html;
            var newItems = temp.querySelectorAll('.surname-item');
            var container = document.getElementById('surnames-container');
            
            if (container && newItems.length) {
                newItems.forEach(function(item) {
                    container.appendChild(item.cloneNode(true));
                });
                currentPage++;
                
                if (currentPage <= totalPages) {
                    loadMoreBtn.style.display = 'inline-block';
                    loadMoreBtn.dataset.page = currentPage;
                } else {
                    loadMoreBtn.style.display = 'none';
                    if (loader) loader.style.display = 'none';
                }
            } else {
                loadMoreBtn.style.display = 'inline-block';
            }
            
            if (loader) loader.style.display = 'none';
            isLoading = false;
        })
        .catch(function() {
            if (loader) loader.style.display = 'none';
            loadMoreBtn.style.display = 'inline-block';
            isLoading = false;
        });
    });
}
</script>
