<style>
/* Layout: full-height archive table — zoomable pedigree on the left, person dossier on the right (bottom half on phones). */
:root {
  --bg: #eef0ee; --canvas: #e6e9e6; --grid: #d6dbd7; --band: rgba(31,92,107,.055); --surface: #fbfcfa; --ink: #1d2422; --muted: #5d6763;

  --chip-doc: #dcebdf; --chip-one: #dbe6ef; --chip-fam: #f2e5cf; --chip-hyp: #f1dbe3;
  --f-display: "PT Serif", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

}

  :root:not([data-theme="light"]) {
    --bg: #131817; --canvas: #171d1c; --grid: #222a28; --band: rgba(124,192,207,.06); --surface: #1d2422; --ink: #e5ebe8; --muted: #9aa6a1;
    --line: #56625d; --accent: #7cc0cf; --accent-soft: #1f3a40; --doc: #8fd19e; --one: #8ab8de; --fam: #e2b668; --hyp: #e597b1;
    --chip-doc: #203a27; --chip-one: #1f3142; --chip-fam: #3d3020; --chip-hyp: #3e2430; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131817; --canvas: #171d1c; --grid: #222a28; --band: rgba(124,192,207,.06); --surface: #1d2422; --ink: #e5ebe8; --muted: #9aa6a1;
  --line: #56625d; --accent: #7cc0cf; --accent-soft: #1f3a40; --doc: #8fd19e; --one: #8ab8de; --fam: #e2b668; --hyp: #e597b1;
  --chip-doc: #203a27; --chip-one: #1f3142; --chip-fam: #3d3020; --chip-hyp: #3e2430; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
a { color: var(--accent); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--grid); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-wrap: balance; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 20px; height: 11px; border-radius: 3px; border: 2px solid var(--line); }
.lg.doc { border-color: var(--doc); } .lg.one { border-color: var(--one); }
.lg.fam { border-color: var(--fam); border-style: dashed; } .lg.hyp { border-color: var(--hyp); border-style: dotted; }
.lg.living { border-style: dotted; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
.seg button, .tab { font: inherit; font-size: .8rem; padding: 5px 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: 1fr minmax(320px, 420px); min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; background-color: var(--canvas); overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; display: block; user-select: none; }
.band { fill: var(--band); }
.band-n { font-family: var(--f-display); font-weight: 700; font-size: 18px; fill: var(--ink); }
.band-r { font-family: var(--f-body); font-size: 12.5px; fill: var(--muted); }
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.edge.hyp { stroke: var(--hyp); stroke-dasharray: 2 5; stroke-linecap: round; }
.node { cursor: pointer; }
.node rect.card { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.node.doc rect.card { stroke: var(--doc); } .node.one rect.card { stroke: var(--one); }
.node.fam rect.card { stroke: var(--fam); stroke-dasharray: 6 4; }
.node.hyp rect.card { stroke: var(--hyp); stroke-dasharray: 2 4; stroke-linecap: round; }
.node.living rect.card { stroke-dasharray: 1 3; fill: var(--canvas); }
.node.sel rect.card { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
.node:hover rect.card { stroke-width: 2.6; }
.node .nm { font-family: var(--f-display); font-weight: 700; font-size: 14px; fill: var(--ink); }
.node .sb { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.node .meta { font-family: var(--f-mono); font-size: 10.5px; fill: var(--accent); }
.node .gen { fill: var(--accent-soft); }
.node .gent { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; fill: var(--accent); }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--grid); background: var(--surface); color: var(--ink); font: 600 18px/1 var(--f-body); cursor: pointer; }
.zoom button.fit { font-size: 11px; }
aside { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--grid);
  padding-block: 18px 32px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
aside h2 { font-family: var(--f-display); font-size: 1.4rem; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
.years { font-family: var(--f-mono); color: var(--muted); font-size: .85rem; }
.kin { margin-top: 6px; font-size: .86rem; } .kin b { color: var(--accent); }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
.st-doc { background: var(--chip-doc); color: var(--doc); } .st-one { background: var(--chip-one); color: var(--one); }
.st-fam { background: var(--chip-fam); color: var(--fam); } .st-hyp { background: var(--chip-hyp); color: var(--hyp); }
.st-living { background: var(--canvas); color: var(--muted); }
.sec { margin-top: 20px; }
.sec h3 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.body { font-size: .92rem; } .body p { margin: 0 0 .7em; } .body ul { padding-left: 1.2em; }
.body .src, .reading .src { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }
.body .flag { border-left: 3px solid var(--hyp); padding-left: 10px; }
.sibs { display: flex; flex-wrap: wrap; gap: 6px; }
.sibs span { font-size: .8rem; border: 1px solid var(--grid); border-radius: 6px; padding: 2px 8px; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; }
.rel button { font: inherit; font-size: .82rem; border: 1px solid var(--grid); background: transparent; color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.docs { display: grid; gap: 8px; }
.doc { display: grid; gap: 4px; border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.doc .t { font-weight: 600; font-size: .84rem; }
.doc .r { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.doc .th { display: flex; gap: 6px; flex-wrap: wrap; }
.doc .th button { padding: 0; border: 1px solid var(--grid); border-radius: 5px; overflow: hidden; cursor: zoom-in; background: var(--canvas); width: 120px; height: 56px; }
.doc .th img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; }
.note { color: var(--muted); font-size: .84rem; }
.reading { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.reading .inner { max-width: 760px; margin: 0 auto; }
.reading h2 { font-family: var(--f-display); }
.reading li { margin-bottom: .5em; }
.reading .close { position: sticky; top: 0; float: right; font: inherit; border: 1px solid var(--grid); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8,12,11,.86); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lightbox .bar { display: flex; gap: 12px; align-items: center; color: #eef2f0; }
.lightbox .bar .t { font-weight: 600; flex: 1; min-width: 0; }
.lightbox .bar button { font: inherit; border: 1px solid #5d6a65; background: #1d2422; color: #eef2f0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.lightbox .pic { min-height: 0; overflow: auto; display: grid; place-items: center; background: #0e1312; border-radius: 8px; }
.lightbox .pic img { max-width: none; width: min(1500px, 100%); height: auto; }
.lightbox .foot { color: #c9d2ce; font-size: .82rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.lightbox .foot code { font-family: var(--f-mono); } .lightbox a { color: #9fd6e2; }
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr 48%; }
  aside { border-left: 0; border-top: 1px solid var(--grid); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend { display: none; } .tools { margin-left: 0; }
}
</style>
</head>

<script>
const DATA = {"nodes": [{"id": "mikhail", "g": 1, "x": 900, "n": "Михаил Андреевич", "s": "это ты", "st": "living", "c": null, "name": "Соколов Михаил Андреевич", "years": "", "body": "", "docs": [], "sibs": [{"n": "Игорь", "d": "", "st": "living"}, {"n": "Алексей", "d": "", "st": "living"}, {"n": "Екатерина", "d": "", "st": "living"}]}, {"id": "andrey", "g": 2, "x": 470, "n": "Андрей Сергеевич", "s": "отец", "st": "living", "c": "mikhail", "name": "Соколов Андрей Сергеевич", "years": "", "body": "", "docs": [], "sibs": [{"n": "Лена (кузина)", "d": "", "st": "living"}, {"n": "Саша (кузина)", "d": "", "st": "living"}, {"n": "Маргарита", "d": "", "st": "living"}, {"n": "Светлана (кузина)", "d": "", "st": "living"}]}, {"id": "olga", "g": 2, "x": 1330, "n": "Ольга Николаевна", "s": "мать", "st": "living", "c": "mikhail", "name": "Федосова Ольга Николаевна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Наталья", "d": "", "st": "living"}]}, {"id": "vika", "g": 3, "x": 330, "n": "Виктория Сергеевна", "s": "бабушка по отцу", "st": "living", "c": "andrey", "name": "Соколова Виктория Сергеевна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Валерий", "d": "", "st": "living"}]}, {"id": "sergeyn", "g": 3, "x": 620, "n": "Сергей Николаевич", "s": "дед по отцу", "st": "living", "c": "andrey", "name": "Выдрин Сергей Николаевич", "years": "", "body": "", "docs": [], "sibs": []}, {"id": "nikolay", "g": 3, "x": 1000, "n": "Николай Яковлевич", "s": "Федосов · полпред 1996", "st": "doc", "c": "olga", "name": "Федосов Николай Яковлевич", "years": "дед по матери · умер", "body": "<p>Сын Якова Васильевича Федосова и немки, чьё имя пока неизвестно. У него была сестра, «тётя Таня», родившаяся, когда отец был на фронте. Его свидетельство о рождении — ключ к фамилии матери: в советских свидетельствах тех лет указывали ФИО и национальность обоих родителей.<\/p><p>Государственная служба (по официальным актам): в 1995 году — заместитель руководителя Территориального управления федеральных органов исполнительной власти в Чеченской Республике. 19 декабря 1995 года награждён орденом Мужества «за мужество и самоотверженность, проявленные в чрезвычайных ситуациях». Указом Президента РФ от 19.02.1996 № 215 назначен полномочным представителем Правительства РФ в Чеченской Республике в ранге заместителя Председателя Правительства РФ — то есть в ранге вице-премьера, в разгар Первой чеченской войны. Сменил Н. И. Семёнова. Указом от 04.11.1996 № 1529 освобождён от должности «в связи с выходом на пенсию»; в тот же день на этот пост назначен Г. В. Курин. Умер несколько лет назад.<\/p><p class=\"src\">Указы Президента РФ <a href=\"http://www.kremlin.ru/acts/bank/10227\">№ 1529 от 04.11.1996<\/a> (PDF: inputs/decrees/ukaz-1996-11-04-1529-fedosov.pdf) и № 215 от 19.02.1996; <a href=\"https://ru.wikipedia.org/wiki/Должностные_лица_в_ранге_заместителя_Председателя_Правительства_и_министра_(Россия)\">Википедия — должностные лица в ранге вице-премьера<\/a>; <a href=\"https://ru.nagrady.by/persona/171805/\">«Награды России» — орден Мужества<\/a>; сведения Михаила 27.10.2026<\/p><p><b>03.11.2026, рассказ Михаила.<\/b> С Лидией Серафимовной познакомился и поженился в <b>Белове<\/b> Кемеровской области; там родилась старшая дочь Наталья. Затем учился в <b>Ленинграде<\/b>, по-видимому в партийной школе (до или после рождения Натальи — неясно). Потом семья переехала в <b>Орджоникидзе<\/b> (Владикавказ), где он был на партийной должности; там родилась Ольга. Затем — <b>Москва<\/b>, тоже партийная работа. Где искать: личное дело слушателя Ленинградской ВПШ (ЦГАИПД СПб), учётная карточка члена КПСС и личные дела номенклатуры Северо-Осетинского обкома (партархив Северной Осетии) и МГК/МК КПСС (ЦГА Москвы, ЦХДОПИМ). В учётных документах указаны место и дата рождения и родители — это проверит версию о Норменге и матери-немке. В открытом вебе следов этих должностей не найдено.<\/p><p class=\"src\">Рассказ Михаила, 03.11.2026<\/p>", "docs": [{"id": "A-0025", "t": "Указ Президента РФ от 04.11.1996 № 1529 «О Федосове Н.Я.»", "ref": "kremlin.ru", "d": "1996-11-04", "url": "http://www.kremlin.ru/acts/bank/10227", "imgs": []}, {"id": "A-0026", "t": "Указ Президента РФ от 19.02.1996 № 215 «О Федосове Н.Я.»", "ref": "", "d": "1996-02-19", "url": "", "imgs": []}, {"id": "A-0027", "t": "Награды России — Федосов Николай Яковлевич, орден Мужества", "ref": "", "d": "1995-12-19", "url": "https://ru.nagrady.by/persona/171805/", "imgs": []}, {"id": "A-0028", "t": "Сведения внука: Н.Я. Федосов был полпредом в Чечне (назначен указом 19.02.1996 №215, до 04.11.1996) и умер несколько лет назад", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0075", "t": "Распоряжение Президента РФ 01.07.1996 №351-рп", "ref": "", "d": "1996-07-01", "url": "https://rulaws.ru/president/Rasporyazhenie-Prezidenta-RF-ot-01.07.1996-N-351-rp/", "imgs": []}, {"id": "A-0121", "t": "Михаил: кузины отца, брат бабушки Вики", "ref": "семья", "d": "2026-11-03", "url": "", "imgs": []}], "sibs": [{"n": "тётя Таня", "d": "", "st": "living"}, {"n": "Алексей", "d": "", "st": "living"}, {"n": "Валентина", "d": "", "st": "living"}, {"n": "Надежда", "d": "", "st": "living"}]}, {"id": "lidiya", "g": 3, "x": 1330, "n": "Лидия Серафимовна", "s": "бабушка по матери", "st": "living", "c": "olga", "name": "Федосова (Бедарева) Лидия Серафимовна", "years": "", "body": "", "docs": [], "sibs": [{"n": "Галина", "d": "", "st": "living"}, {"n": "Тамара", "d": "", "st": "living"}, {"n": "Виктор", "d": "", "st": "living"}]}, {"id": "sergey1911", "g": 4, "x": 150, "n": "Сергей Сергеевич", "s": "Соколов · 1911", "st": "hyp", "c": "vika", "name": "Соколов Сергей Сергеевич", "years": "30.09.1911 ст. ст. = 13.10.1911 – ?", "body": "\n        <p>Родился в Акше Забайкальской области, где тогда служил его отец. В 1935 году жил в Ленинграде, в 1941-м призван там же. Инженер-капитан, медаль «За оборону Ленинграда» (приказ Октябрьской железной дороги 07.06.1943). После войны работал маркшейдером. Две даты рождения совпадают при пересчёте стиля.<\/p>\n        <p class=\"flag\">То, что он отец Виктории Сергеевны, следует из её отчества и слов «мой дед С. С.». Документа пока нет.<\/p>\n        <p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/kld-card_uchet_officer1928224/\">Память народа: УПК офицеров<\/a> · ЦАМО ф.217 оп.1264 д.68 (по досье Вики) · РГИА ф.1302 оп.6 д.716 (по выписке)<\/p>\n      ", "docs": [{"id": "A-0013", "t": "Досье Вики: «8Сергей Сергеевич Соколов.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0014", "t": "ЦАМО ф.217 оп.1264 д.68 (по досье Вики) — Соколов С.С. 13.10.1911, Акша", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0019", "t": "Память народа: УПК, Соколов Сергей Сергеевич 13.10.1911, Забайкальский край, инженер-капитан", "ref": "ЦАМО (УПК)", "d": "", "url": "https://pamyat-naroda.ru/heroes/kld-card_uchet_officer1928224/", "imgs": []}], "sibs": []}, {"id": "asya", "g": 4, "x": 340, "n": "Александра Маркеловна", "s": "Розина · 1923–2005", "st": "doc", "c": "vika", "name": "Розина Александра Маркеловна («баба Ася»)", "years": "25.02.1923 – 07.06.2005", "body": "<p>Мать Вики, бабушка Андрея. Полное имя сообщила мама: Александра Маркеловна Розина. Учётная карточка военкомата это подтверждает: Розина Александра Маркеловна, 1923 г. р., ефрейтор. В армии с января 1943 по 3 августа 1945, в боях с января 1943 по 29 июля 1944 в составе 4-го полка ВНОС (воздушного наблюдения, оповещения и связи). Медаль «За победу над Германией», удостоверение участника войны вручено 27.01.1979. В 1987 году перерегистрирована в Гагаринском райвоенкомате Москвы. В 1985 — юбилейный орден Отечественной войны II степени (в базе записана как «Рожина»), место рождения — Москва. Вероятно, жена С. С. Соколова 1911 года рождения; Розина — девичья фамилия или по другому браку, пока неясно. Отец — Маркел Розин (по отчеству).<\/p><p>4-й полк ВНОС — часть войск ПВО страны (основание в карточке: «Перечень № 11» частей ПВО). В действующей армии было два формирования: первое — 22.06–15.10.1941, второе — 15.11.1941–29.07.1944, сформировано из 9-го отдельного батальона ВНОС. Конец второго формирования, 29 июля 1944, точно совпадает с концом «участия в боях» в её карточке, значит она служила во втором формировании. Посты ВНОС — цепь наблюдателей, которые засекали вражеские самолёты и передавали оповещение в ПВО; там служило много девушек-связисток. Точек боевого пути и журнала боевых действий полка в «Памяти народа» нет, поэтому где именно стоял полк, пока неизвестно.<\/p><p><b>Где стоял полк (найдено 30.10.2026).<\/b> По справочнику Генштаба «Боевой состав Советской Армии» 4-й полк ВНОС в 1943 году был не в Москве. С февраля по июнь он входил в Воронежско-Борисоглебский дивизионный район ПВО Воронежского фронта, с июля по октябрь — в Воронежский корпусной район (Западный фронт ПВО), в ноябре — в Курский, в декабре — в Киевский корпусной район ПВО. Командир — майор Н. М. Кривицкий. Значит, баба Ася служила на постах ВНОС от Воронежа до Курска и Киева, двигаясь вслед за фронтом.<\/p><p><b>Кто мог быть её отцом.<\/b> Среди участников войны есть один человек с таким именем — <b>Розин Маркел Александрович<\/b>: родился в 1883 или 1888 году в Скопине Рязанской губернии, член партии с 1917 года, в 1918–1946 годах служил интендантом, подполковник, начальник склада НКО № 568, ордена «Знак Почёта» (1943) и Красного Знамени (1944). Это только гипотеза: имя редкое, но ни один документ не связывает его с Александрой.<\/p><p class=\"src\"><a href=\"http://www.soldat.ru/files/f/boevoj_sostav_sa_1943.pdf\">Боевой состав Советской Армии, 1943<\/a> · <a href=\"https://proza.ru/2015/03/29/1257\">Воронежская военная энциклопедия, т. 2<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/person-hero45635083/\">Розин М. А. — УПК<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_predstavlenie12105600/\">наградной лист<\/a><\/p><p class=\"src\"><a href=\"https://pamyat-naroda.ru/warunit/id60004151/\">Память народа — 4 полк ВНОС<\/a> (I: /warunit/id5336/, II: /warunit/id6863/)<\/p><p class=\"src\">Ответ мамы, 27.10.2026; <a href=\"https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat32256727/\">Память народа — учётная карточка РВК<\/a> (скан); <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_yubileinaya_kartoteka1518412794/\">юбилейная картотека<\/a>, ЦАМО шк.51 ящ.12, док. №179 от 06.11.1985; Telegram 24.04.2025<\/p><p><b>Найдено 31.10.2026.<\/b> В «Бессмертном полку» есть её страница с фото военных лет: <b>25.02.1923 – 07.06.2005<\/b>, родилась в Москве, призвана в январе 1943. В списке ветеранов Москвы (около 2005) — «Розина Александра Маркеловна, 01.02.1923»: день рождения расходится. До конца жизни носила фамилию Розина. Отец-кандидат Маркел Розин: в 1921 — помощник начальника Политуправления Туркестанского фронта по работе в войсках ВЧК (приказ № 1076 от 2.09.1921), в 1924 — помощник комиссара Военно-академических курсов высшего комсостава РККА в Москве («Вся Москва» 1924; Остоженка). Значит, семья жила в Москве около 1923–24 — это согласуется с рождением Аси в Москве. Прямого документа «отец — дочь» пока нет. Где её искать дальше: ЦАМО, книга учёта рядового и сержантского состава 4-го полка ВНОС 1944–45 (оп. 517503е, д. 3).<\/p><p class=\"src\"><a href=\"https://www.moypolk.ru/soldier/rozina-aleksandra-markelovna\">Бессмертный полк — Розина А. М.<\/a> · <a href=\"https://www.pobediteli.ru/russia/center/moskva/r/rix-roz/index.html\">pobediteli.ru<\/a> · <a href=\"https://archive.org/details/turkestanskijfront19181923prikazpo16\">приказы Туркфронта 1921<\/a> · <a href=\"https://archive.org/details/vsjamoskvaadresnajaispravochnajakniga74\">«Вся Москва» 1924<\/a> · фото: photos/rozina-asya-moypolk.jpg<\/p>", "docs": [{"id": "A-0022", "t": "Учётная карточка участника ВОВ — Розина Александра Маркеловна, 1923 (списки призыва и демобилизации, военкомат)", "ref": "«по описи 1.186 т.1 отр.39 п.299»; штамп «Перерегистрировано 1987 г. Гагаринский РВК г. Москвы»", "d": "1945/1979/1987", "url": "https://pamyat-naroda.ru/heroes/rvk-chelovek_voenkomat32256727/", "imgs": ["scans/rozina-uchetnaya-kartochka-rvk.png"]}, {"id": "A-0023", "t": "Юбилейная картотека — Рожина Александра Маркеловна, орден Отечественной войны II ст.", "ref": "шкаф 51, ящик 12; док. №179 от 06.11.1985", "d": "1985-11-06", "url": "https://pamyat-naroda.ru/heroes/podvig-chelovek_yubileinaya_kartoteka1518412794/", "imgs": []}, {"id": "A-0024", "t": "Ответы мамы (Ольги Николаевны) на список вопросов, переданы Михаилом в чате", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0029", "t": "Память народа — 4 полк ВНОС (I и II формирования)", "ref": "ЦАМО / Память народа", "d": "", "url": "https://pamyat-naroda.ru/warunit/id60004151/", "imgs": []}, {"id": "A-0045", "t": "Боевой состав Советской Армии, 1943 (ГШ) — 4 полк ВНОС", "ref": "soldat.ru", "d": "1943", "url": "http://www.soldat.ru/files/f/boevoj_sostav_sa_1943.pdf", "imgs": []}, {"id": "A-0071", "t": "Бессмертный полк: Розина Александра Маркеловна", "ref": "", "d": "2025-05-05", "url": "https://www.moypolk.ru/soldier/rozina-aleksandra-markelovna", "imgs": []}, {"id": "A-0072", "t": "pobediteli.ru — список ветеранов Москвы", "ref": "", "d": "", "url": "https://www.pobediteli.ru/russia/center/moskva/r/rix-roz/index.html", "imgs": []}], "sibs": []}, {"id": "yakov", "g": 4, "x": 650, "n": "Яков Васильевич", "s": "Федосов · 1916–1977", "st": "one", "c": "nikolay", "name": "Федосов Яков Васильевич", "years": "07.04.1916 – 21.03.1977", "body": "\n        <p><b>Найдено 30.10.2026: место рождения.<\/b> В «Памяти народа» есть учётно-послужная карточка офицера (ЦАМО) и запись военкомата на Федосова Якова Васильевича, род. <b>07.04.1916 в с. Вихляевка<\/b> (Вихляевский с/с, «Псковский», то есть Песковский, р-н Воронежской обл.; до революции — деревня Вихляевка Тюковской волости Новохопёрского уезда Воронежской губернии). Призван <b>Коношским РВК Архангельской области 30.08.1941<\/b>, мл. лейтенант, 69 сп 97 сд, 112 зсп; медали «За оборону Советского Заполярья», «За победу над Германией», «За победу над Японией»; служба окончена <b>31.08.1946<\/b>, а с 1946 года он работал в лагере МВД под Коношей. Коношский военкомат, дата рождения и годы службы совпадают, так что это он. Значит, семья не сибирская, а из Хопёрья. Вероятная версия: раскулачены около 1930–1931 и высланы на Север. Из Вихляевки ещё в 1880–90-х уезжали переселенцы в Омский и Тюкалинский уезды, это может объяснять «Сибирь» в семейном рассказе. На странице два фото, маме стоит посмотреть.<\/p>\n        <p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/person-hero49835897/\">Память народа: УПК ЦАМО и военкомат<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/sm-person_rvk1070165184/\">запись военкомата<\/a> <span class=\"tag\">photos/fedosov-yakov-pn-person-hero49835897-photos.png<\/span><\/p>\n        <p>По семейной памяти — коммунист, служил в НКВД; ушёл на фронт в 25 лет, оставив двоих детей и беременную жену. В именных списках 31-й бригады есть Федосов Я. В. 1916 года рождения, призванный Коношским военкоматом Архангельской области в сентябре 1941 года (Подюжский сельсовет, лесопункт «29 км»), красноармеец, затем сержант. В 1945 году сержант, старшина 31-й отдельной лыжной бригады, медаль «За оборону Советского Заполярья».<\/p>\n        <p class=\"flag\">В списках 1941 года у коношского Якова указан только год. Карточка с Вихляевкой — это он (см. выше). Тёзка из Пролейки (Сталинградская обл., пропал без вести в 12.1944) — другой человек. Подюжье — лесозаготовки, куда с 1920-х ссылали раскулаченных; рядом находился Каргопольлаг, что согласуется со службой в НКВД.<\/p>\n        <p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/isp-chelovek_spisok12092220/\">ЦАМО ф.1824 оп.2 д.112<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/isp-chelovek_spisok12079024/\">д.110<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/isp-chelovek_spisok3051325/\">д.117<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/isp-chelovek_spisok5871503/\">д.118 (сержант)<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_nagrazhdenie1531109384/\">медаль 1945, строка 179<\/a> · <a href=\"https://www.moypolk.ru/soldier/fedosov-yakov-vasilevich-2\">страница мамы на moypolk<\/a><\/p>\n      <p>По записи бабушки Лидии: с 1946 года жил и работал в Коноше, в исправительно-трудовом лагере МВД — инспектор колонны № 19, с 1948 года — начальник колонны № 28 (или 20, неразборчиво). Похоронен в 1977 году в Тобольске Тюменской области. Дети: Николай (14.04.1938, Архангельская обл., пос. Норменга(?)) и Татьяна (02(?).04.1942, Коношский р-н, п. «29 км» — тот же лесопункт, что в документах ЦАМО).<\/p><p class=\"src\">Записи бабушки Лидии Серафимовны, 29.10.2026 (фото листов: inputs/babushka-2026-10-29/)<\/p><p><b>Рассказ дедушки Николая, передал Михаил 30.10.2026.<\/b> Яков был из семьи кулаков из Сибири. Из Сибири его направили учиться в НКВД в Ленинград, и, по иронии судьбы, он чуть ли не участвовал в раскулачивании собственной семьи (это неточно). Рассказ хорошо сходится с документами: в 1941 году он жил на пункте «29 км» в Подюжье, после войны служил в лагере под Коношей, похоронен в Тобольске (может быть, вернулся на родину). Жена — немка, судя по всему, из высланных. Одна оговорка: в годы массового раскулачивания (1930–1931) Якову было 14–15 лет, так что участвовать в нём он мог разве что позже, в конце 1930-х. Чтобы проверить рассказ, нужно знать, где в Сибири он родился (село, район), как звали его родителей (отец — Василий) и что написано на его могиле в Тобольске. Тогда можно искать семью в списках раскулаченных и запросить личное дело сотрудника НКВД/МВД в архиве УМВД Архангельской области.<\/p><p><b>Проверка 30.10.2026.<\/b> Прямых записей о Якове и Василии Федосовых в открытых списках репрессированных Тюменской области не нашлось. «Л/п 29 км», скорее всего, означает лесопункт Подюжского леспромхоза на ветке Коноша — Вельск, а не лагпункт; в Подюге работали раскулаченные, высланные с юга. Каргопольлаг, к которому, вероятно, относилась «колонна» 1946–1948 годов, создан 16.08.1937, его управление с 1940 года стояло в Ерцеве под Коношей. Ленинградская спецшкола ГУГБ НКВД открылась 26.09.1937, а сын Николай родился в апреле 1938 года уже в Норменге, так что учёба в Ленинграде была, вероятно, раньше. Тёзки с той же датой рождения (07.04.1916) в «Памяти народа» родом из Пролейки (Самарская обл.) и Вихляевки (Воронежская обл.), а не из Сибири. Поэтому есть вторая версия: семья могла быть раскулачена в Поволжье и выслана на Север. Какая из версий верна, решит только место рождения Якова.<\/p><p><b>31.10.2026.<\/b> В школьной Книге памяти Вихляевки (457 участников войны) Федосовых нет вовсе; Федосов А. Ф. 1920 записан там как «Федотов». Значит, к 1941 году Федосовы в селе уже не жили: и Яков, и Александр Федорович призваны Коношским РВК (Александр — ещё в апреле 1941), а Яков жил на лесопункте «29 км» Подюжского с/с. На подюжских лесопунктах работали «раскулаченные крестьяне, переселившиеся с юга». Версия: семью выслали около 1930–31 (это расходится с семейным «приехал около 1937»). Родителей назовут его личные дела: офицерское (ЦАМО, учётно-послужная картотека, шкаф 215, ящик 7) и кадровое дело сотрудника ИТЛ МВД (УФСИН / УМВД Архангельской обл.).<\/p><p><b>02.11.2026, мама.<\/b> Яков «совершенно точно» родился в Воронежской области — это второе, независимое от «Памяти народа» подтверждение. Семья была кулацкой и владела несколькими мельницами; Яков был самым младшим. Тобольск — «гораздо позже». Значит, «Сибирь» в рассказе — это поздняя жизнь семьи, а не её происхождение. Дети Якова и Лидии: Николай (1938), Татьяна (1942), Алексей, Валентина, Надежда.<\/p><p class=\"src\"><a href=\"https://povorinskij-r20.gosweb.gosuslugi.ru/glavnoe/kniga-pamyati/vihlyaevskoe-selskoe-poselenie/\">Книга памяти Вихляевского поселения<\/a> · <a href=\"https://poisk.re/person/officers/7896642\">poisk.re — УПК Якова<\/a> · <a href=\"https://www.moypolk.ru/soldier/fedosov-aleksandr-fedorovich-1\">Федосов А. Ф. 1920–1992<\/a><\/p>", "docs": [{"id": "A-0016", "t": "Память народа: именные списки 31 гсбр — Федосов Яков Васильевич 1916, Коношский р-н", "ref": "ф.1824 оп.2 д.110, 112, 117, 118", "d": "1941", "url": "https://pamyat-naroda.ru/heroes/isp-chelovek_spisok12092220/", "imgs": []}, {"id": "A-0017", "t": "Память народа: приказ курсов мл. лейтенантов КарФ №214 от 08.03.1945, медаль «За оборону Советского Заполярья»", "ref": "ЦАМО", "d": "1945-03-08", "url": "https://pamyat-naroda.ru/heroes/podvig-chelovek_nagrazhdenie1531109384/", "imgs": ["scans/fedosov-zapolyarye-1945-line179.png"]}, {"id": "A-0066", "t": "Память народа: учётно-послужная картотека офицеров (ЦАМО) — Федосов Яков Васильевич 07.04.1916", "ref": "УПК (образ не показан)", "d": "1941–1946", "url": "https://pamyat-naroda.ru/heroes/kld-card_uchet_officer7896642/", "imgs": []}, {"id": "A-0067", "t": "Память народа: записи из военкоматов по месту учёта — Федосов Яков Васильевич 07.04.1916", "ref": "военкомат по месту учёта", "d": "1941", "url": "https://pamyat-naroda.ru/heroes/sm-person_rvk1070165184/", "imgs": ["scans/fedosov-yakov-rvk-sm-person_rvk1070165184.jpg"]}, {"id": "A-0068", "t": "Память народа: Федосов Александр Федорович 20.11.1920, уроженец с. Вихляевка, призван Коношским РВК (12 док.: УПК, награды, юбилейная картотека 1985)", "ref": "ЦАМО", "d": "1941–1985", "url": "https://pamyat-naroda.ru/heroes/person-hero93204425/", "imgs": []}, {"id": "A-0079", "t": "Школьная Книга памяти «Я помню! Я горжусь!» — общий список участников ВОВ с. Вихляевка (457 чел.)", "ref": "", "d": "", "url": "https://povorinskij-r20.gosweb.gosuslugi.ru/glavnoe/kniga-pamyati/vihlyaevskoe-selskoe-poselenie/", "imgs": []}], "sibs": []}, {"id": "olgade", "g": 4, "x": 832, "n": "Лидия Робертовна", "s": "Фрайер · дочь Роберта?", "st": "fam", "c": "nikolay", "name": "Лидия Робертовна Фраер(?)", "years": "жена Якова Федосова, немка", "body": "\n        <p>Мать Николая Яковлевича. То, что она немка, в семье знают точно; имя неизвестно. Возможно, её семью выслали в Архангельскую область.<\/p>\n        <p class=\"flag\">Рабочая версия: к войне у Якова было двое детей, значит, поженились они не позже конца 1930-х. Тогда её семья, скорее всего, попала на Север при раскулачивании 1930–1931 годов, а не при депортации 1941-го. Документа пока нет.<\/p>\n      <p><b>Лидия Робертовна Фраер(?)<\/b> — так её записала бабушка Лидия; фамилия читается неуверенно (Фраер / Фрайер). Семья — из Одесской области, Беляевский район, деревня «Выгода». Выгода состояла из двух частей — Русской и Немецкой (Дейч-Выгода, она же Фриденгейм); немецкая часть основана в 1876 году колонистами из колонии Фрейденталь (лютеранский приход Фрейденталь). Отчество Робертовна тоже немецкое. <b>Фамилия «Фраер»<\/b> — это, скорее всего, немецкая Freuer/Freier: в списке репрессированных уроженцев Фрейденталя Карл Freuer (1918 г. р., арестован в 1938-м, его отец «выслан в 1938») прямо отмечен как «в советских документах — Fraier/Freyer». Freuer — один из самых больших родов колонии Фрейденталь (лютеране, сотни записей в метриках 1830–1880-х), а Немецкую Выгоду основали как раз выходцы из Фрейденталя. В самой Выгоде Freuer жили: Регина Freuer родилась там в 1907 году, дочь Иоганна Freuer (1864, Фрейденталь). В немецкой переписи Выгоды 1942–44 годов Freuer уже нет — согласуется с тем, что семья Лидии к 1938 году была выслана. Самого Роберта и Лидию Робертовну в открытых базах найти пока не удалось. Николай родился у неё в 1938 году уже в Архангельской области — значит, семью выслали на Север до войны, скорее всего при раскулачивании 1930–31 годов.<\/p><p>Другие ветви рода Freuer эмигрировали в США, в Северную Дакоту (район Гэкл). Связать их с нашей ветвью можно будет только когда станут известны год рождения Лидии Робертовны и имя её матери.<\/p><p><b>Поиск 30.10.2026.<\/b> Роберта Freuer/Freier нет ни в метриках Фрейденталя за 1830–1885 годы, ни в немецких списках натурализации 1943–44 годов (EWZ). Значит, скорее всего, он родился после 1885 года, а семья уехала из Одесской области до войны. Родственники-кандидаты того же поколения (родство не доказано): Adolf Freier, 1904 г. р., из Фрейденталя, его дочь Else родилась в 1931 году в Фриденгейме (Выгоде); Johann Freier, 1889 г. р.; Карл Христианович Фрейер, 1886 г. р., расстрелян 13.04.1938. Исключена тёзка Lydia Enzi, урождённая Freuer (1920): в оккупацию она была на Одесщине, а наша Лидия с 1938 года жила на Севере. Дальше нужны метрики Фрейденталя 1886–1899 на сайте BSGR (закрыт проверкой Cloudflare) и архивные запросы в ИЦ УМВД Архангельской области и в Госархив Одесской области.<\/p><p class=\"src\"><a href=\"https://www.odessa3.org/collections/war/ewz/link/ewzmsc40.txt\">odessa3 EWZ ewzmsc40 (Freier Adolf)<\/a> · <a href=\"https://www.odessa3.org/collections/war/ewz/link/ewzmsc28.txt\">ewzmsc28 (Enzi Lydia geb. Freuer)<\/a> · <a href=\"https://www.odessa3.org/collections/war/link/executel.txt\">список расстрелянных немцев 1937–38<\/a> · <a href=\"https://www.1archive-online.com/keler/list-f-1.html\">список Келера<\/a><\/p><p class=\"src\">Записи бабушки Лидии Серафимовны, 29.10.2026 (фото листов: inputs/babushka-2026-10-29/)<\/p><p><b>31.10.2026.<\/b> Главная версия написания фамилии — <b>Freuer<\/b> («Фройер / Фрейер», в пересказе легко «Фраер»): это единственная фамилия этого корня, засвидетельствованная именно в Выгоде (Johann 1864, Regina 1907, Karl 1918). Тогда искать Роберта Freuer, сына Johann, около 1885–1897 г. р.; Лидия — около 1914–1920. Метрики Фрейденталя за 1886–1901 нигде не расшифрованы. Немцев из Одесщины действительно ссылали в Архангельскую обл. (в списке арестованных НКВД есть одесские немцы с адресом «Архангельск»), что поддерживает версию высылки 1930–31. Короткий путь к точной фамилии — записи о рождении Николая (1938) и Тани (1942) в Коношском ЗАГСе.<\/p><p><b>02.11.2026.<\/b> Проверены опубликованные метрики Фрейденталя за 1902–1913 годы (рождения, браки, смерти), сканы ГАОдО 1908 и 1911 и список репрессированных немцев Одесской области (6618 человек). Отца по имени Роберт среди Freuer нет нигде. В списке репрессированных есть «Фраер Яков Яковлевич, 1895, Фрейденталь» — то самое написание; родство не установлено. Маршрут на Север подтверждается косвенно: в феврале 1930 года из Одесского округа «в Северный край» выселили около 1300 семей, а один уроженец Фрейденталя умер в Архангельске в 1931-м. Если отчество запомнилось неточно, единственная Лидия Freuer 1910-х годов во Фрейдентале — родилась 7.02.1913, родители Иоганн Freuer и Кристина Беккер. В «Поморском мемориале» (арестованные в Архангельской обл.) Фраеров и Фрейеров нет.<\/p><p class=\"src\"><a href=\"https://www.blackseagr.org/research_church_odessa.html\">BSGR — метрики Фрейденталя<\/a> · <a href=\"https://hfdr.de/wp-content/uploads/2023/10/Repressierten_1930-1950_im_Odessa-Gebiet_6618.pdf\">список репрессированных немцев Одесской обл.<\/a> · <a href=\"https://www.blackseagr.org/pdfs/freudental-repressed.pdf\">репрессированные Фрейденталя<\/a><\/p><p><b>02.11.2026. Вероятно, найдена её семья.<\/b> В сборнике «Немецкое население на Южном Урале» (Оренбург, 2013) опубликованы воспоминания <b>Анны Робертовны Фрайер<\/b> (1920–1997, в замужестве Фишлер). Их записала её дочь О. Э. Блинова. Анна родилась на хуторе в 30 км от Одессы. Родители — <b>Роберт Вильгельмович Фрайер<\/b> и <b>Каролина Фридриховна, урождённая Энгель<\/b>. В 1925 году семья купила дом в <b>деревне Выгода<\/b>, в ноябре 1929-го их раскулачили, а в феврале 1930-го выслали под Вологду, в бараки Спасо-Прилуцкого монастыря. С 1932 года родители работали на кирпичном заводе № 5, а в августе 1934-го семью перевели в Архангельскую область, на станцию Коношу, в <b>посёлок Норминга<\/b>. Именно там, в Норменге, в 1938 году родился Николай Яковлевич. Около 1935 года отца по доносу осудили на пять лет и отправили в Печору; оттуда он не вернулся.<\/p><p>У Роберта и Каролины было шесть дочерей. Они родились в 1918, 1920 (Анна), 1922, 1924 и 1926 годах, младшая — около 1929-го. Младшая умерла в 1930 году, ещё одна — на Украине около 1932-го; к 1934 году в живых оставались четыре. <b>03.11, мама:<\/b> сёстры Лидии — <b>Ира и Аделя<\/b> (Ирма? Адель?). Младшая, грудная, умерла в поезде, когда семью ссылали. Это совпадает с воспоминаниями Анны: младшая умерла в 1930 году, в год высылки под Вологду. Имён сестёр Анна не называет. С записью бабушки Лидии совпадают пять признаков: фамилия Фрайер/Фраер, отчество Робертовна, Выгода, немцы, Норменга. Поэтому версия «Лидия — дочь Роберта и Каролины» стала основной. Скорее всего, она родилась в 1918 или 1922 году. Прямого документа пока нет. Нужна запись о браке Якова (около 1936–37) или о рождении Николая в архангельском ЗАГСе: там указаны возраст матери и место её рождения.<\/p><p>Возможный родственник — <b>Адольф Вильгельмович Фраер<\/b> (1904, Одесса; расстрелян в Туапсе 11.02.1938). Отчество у него то же, что у Роберта, но то, что они братья, не доказано. Рождения 1924–1925 годов по Фрейденталю записаны в книгах ДАОО ф.Р-8220: алфавит — оп.2а д.2, книга 1925 года — оп.1а д.20. Онлайн выложены только описи этих дел. Книг Выгоды за 1920-е годы в описях нет.<\/p><p class=\"src\"><a href=\"https://www.osu.ru/sites/niisu/docs/germans.pdf#page=118\">Блинова О. Э. Воспоминания матери, с. 116–120 (PDF 117–121)<\/a> · <a href=\"https://bessmertnybarak.com/books/person/2318612/\">Фрайер Анна Робертовна 1920<\/a> (список Оренбургской обл.) · <a href=\"https://bessmertnybarak.com/books/person/294838/\">Фраер Адольф Вильгельмович 1904<\/a> · <a href=\"https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_02a/ukrnod01d_fr-8220-op2a-opys_m_00003.jpg\">ДАОО Р-8220 оп.2а, опись, л.2<\/a> · <a href=\"https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_01a/ukrnod01d_fr-8220-op1a-opys_m_00004.jpg\">оп.1а, опись, л.3<\/a><\/p>", "docs": [{"id": "A-0033", "t": "St. Petersburg Lutheran Consistory — Freudental parish births/deaths/marriages 1830s–1880s (транскрипции R. Wiseman)", "ref": "odessa3.org / РГИА ф.828 (дубликаты лютеранских метрик)", "d": "1833–1885", "url": "https://www.odessa3.org/collections/stpete/freud/ (18 txt, копия: scratchpad/odessa3-freud/)", "imgs": []}, {"id": "A-0034", "t": "BSGR — Wygoda Family List (DAI film 636, T81; перепись оккупации 1942–44)", "ref": "NARA T81 / BSGR", "d": "1942–1944", "url": "https://www.blackseagr.org/dai/wygoda_dai636.htm", "imgs": []}, {"id": "A-0035", "t": "BSGR — List of the Repressed Settlers born in Freudental", "ref": "BSGR", "d": "1930–1948", "url": "https://www.blackseagr.org/pdfs/freudental-repressed.pdf", "imgs": []}, {"id": "A-0036", "t": "BSGR — Freuer Regina, р. 01.02.1907 Wygoda (EWZ50-I), Lebenslauf", "ref": "NARA EWZ / BSGR", "d": "1944", "url": "https://www.blackseagr.org/blksea-db/getperson.php?personID=I34941&tree=70", "imgs": []}, {"id": "A-0047", "t": "odessa3 EWZ-индексы и списки расстрелянных: Freuer/Freier из Фрейденталя", "ref": "EWZ50-B045 1186; EWZ58-H028 0900", "d": "1938–1944", "url": "https://www.odessa3.org/collections/war/ewz/link/ewzmsc40.txt", "imgs": []}, {"id": "A-0097", "t": "Black Sea German Research: Freuer во Freudental (метрики 1833–1913, репрессированные, EWZ)", "ref": "EWZ50-B045 fr.1186 (Lydia Freuer 1920); консистория 1882646-2 с.30 з.20 (Freier=Freuer)", "d": "1836–1942", "url": "https://www.blackseagr.org/pdfs/freudental-repressed.pdf", "imgs": []}, {"id": "A-0098", "t": "Бессмертный барак: Фрейер/Фрайер — трудармейцы из Фриденталя и Одесского у.", "ref": "Бессмертный барак / ОГАЧО", "d": "1942–1947", "url": "https://bessmertnybarak.com/search/#query=Фрейер&section=books", "imgs": []}, {"id": "A-0103", "t": "Список репрессированных немцев Одесской обл. 1930–1950 (6618 чел.) + BSGR метрики Freudental 1902–1913", "ref": "№5176, 5183, 5216, 5217; ф.894 оп.1 д.5,18,29,34,38", "d": "1902–1950", "url": "https://hfdr.de/wp-content/uploads/2023/10/Repressierten_1930-1950_im_Odessa-Gebiet_6618.pdf", "imgs": []}, {"id": "A-0108", "t": "Блинова О.Э. Воспоминания матери, Фишлер (Фрайер) Анны Робертовны, 1920–1997 // Немецкое население на Южном Урале в военные и послевоенные годы. Оренбург, 2013", "ref": "печ. с.116–120 (PDF 117–121)", "d": "1996 (написано); 2013 (публ.)", "url": "https://www.osu.ru/sites/niisu/docs/germans.pdf#page=118", "imgs": []}, {"id": "A-0109", "t": "ДАОО ф.Р-8220 (Беляевский райЗАГС): описи оп.2а (кадр 00003) и оп.1а (кадр 00004)", "ref": "Р-8220 оп.2а д.2 (алфавит рождений 1924–1925, 98 л., Біляївський р-н вкл. Фрейденталь, К.Лібенталь, Нейбург, Петерсталь); Р-8220 оп.1а д.20 (рождения 1925, 377 л.; Фрейденталь 13.01.192[4→5]–31.12.1925)", "d": "1924–1925", "url": "https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_02a/ukrnod01d_fr-8220-op2a-opys_m_00003.jpg", "imgs": []}], "sibs": []}, {"id": "serafim", "g": 4, "x": 1506, "n": "Серафим Иванович", "s": "Бедарев · 1905–1980", "st": "doc", "c": "lidiya", "name": "Бедарев Серафим Иванович", "years": "26.12.1905 ст. ст. – 27.08.1980", "body": "\n        <p>Родился 26 декабря 1905 года по старому стилю (8 января 1906-го по новому) в селе Урско-Бедаревском Бачатской волости Кузнецкого уезда Томской губернии (ныне Ур-Бедари). Отец — крестьянин Иван Никитин Бедарев, мать — Анна. Крестили священник Павел Юрьев и и. д. псаломщика Феофил Ермолаев; восприемники — крестьянин Иван Вонифатьев […] и крестьянская жена Матрена […] Бедарева. На полях пометка: «св-во выдано … 28/XII-49 г.», то есть в 1949 году он получал свидетельство о рождении. Семья называет дату 25.12.1905, расхождение в один день.<\/p>\n        <p>Призван Беловским военкоматом в 1941 году. Младший сержант, старший вычислитель штаба 320-го гаубичного артиллерийского полка; Карельский, 2-й и 3-й Украинские фронты, осколочное ранение 26.06.1943. Два ордена Красной Звезды, медали «За боевые заслуги», «За взятие Будапешта», «За победу над Германией». Последний орден получил за бои на реке Раба и за Фюрстенфельд (Австрия) в апреле 1945 года. Дома оставались трое детей и беременная жена.<\/p>\n        <p class=\"src\"><a href=\"https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/224\">метрика: ГА Кузбасса ф.60 оп.4 д.104 скан 224<\/a> · <a href=\"https://ya.ru/archive/catalog/3347c189-e4b0-4549-baf3-feb31396c927/53\">второй экземпляр: ф.60 оп.5 д.31 скан 53<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/person-hero2921925/\">Память народа, 8 документов<\/a> · <a href=\"https://pamyat-naroda.ru/heroes/podvig-chelovek_nagrazhdenie25953494/\">наградной лист 1945<\/a> · <a href=\"https://www.moypolk.ru/soldier/bedarev-serafim-ivanovich\">страница мамы на moypolk<\/a><\/p>\n      <p>По записи бабушки Лидии: родился 25.12.1905 по старому стилю; умер в 1980 году, похоронен в Белове. Жена — Ольга Васильевна (1909). Дети: Галина, Тамара, Виктор и младшая Лидия (живые — даты не публикуются).<\/p><p class=\"src\">Записи бабушки Лидии Серафимовны, 29.10.2026 (фото листов: inputs/babushka-2026-10-29/)<\/p><p><b>31.10.2026: кандидат в братья.<\/b> Бедарев Василий Иванович, 1908, Ленинск-Кузнецкий (Ур-Бедари в 1930 входили в Ленинский р-н), призван 15.07.1941, номер орудия 759 иптап, убит 27.12.1943 у д. Сахарово Витебского р-на. В донесении указана только жена — Татьяна Ефимовна, г. Ленинск-Кузнецкий, Батрацкая ул., 40; родители не названы. Год рождения совпадает с Василием из метрики (16.03.1908), но тождество не доказано. Бедаревы-Ивановичи из Ур-Бедари в Книге памяти — Егор (1900) и Афанасий (1910) — не дети Ивана Никитича: в те годы у него родились Мария и Анфиса.<\/p><p class=\"src\"><a href=\"https://pamyat-naroda.ru/heroes/memorial-chelovek_donesenie54546535/\">донесение 43 А<\/a> · <a href=\"https://mrech.ru/media/kniga_pamyati/Vsekuzbasskaya_Kniga_pamyati_t_4.pdf\">Всекузбасская КП т. 4<\/a>, <a href=\"https://mrech.ru/media/kniga_pamyati/Vsekuzbasskaya_Kniga_pamyati_t_17.pdf\">т. 17<\/a><\/p>", "docs": [{"id": "A-0018", "t": "Память народа: Бедарев Серафим Иванович 1905, Ур-Бедари — 8 наградных документов", "ref": "ЦАМО", "d": "1944–1945", "url": "https://pamyat-naroda.ru/heroes/person-hero2921925/", "imgs": ["scans/bedarev-nagradnoy-list-1945.png"]}, {"id": "A-0020", "t": "Метрическая книга церкви с. Ур-Бедаревского 1900–1903, 1905–1906 (церковный экз.?) — рождение Серафима", "ref": "ф.60 оп.4 д.104 скан 224", "d": "1905-12-26 (ст. ст.)", "url": "https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/224", "imgs": ["scans/serafim-1905-d104-s224-parents.png"]}, {"id": "A-0021", "t": "Метрическая книга церкви с. Урско-Бедаревского 1905–1910 (второй экз.) — рождение Серафима", "ref": "ф.60 оп.5 д.31 скан 53", "d": "1905-12-26", "url": "https://ya.ru/archive/catalog/3347c189-e4b0-4549-baf3-feb31396c927/53", "imgs": ["scans/serafim-1905-d31-s53-parents-a.png"]}, {"id": "A-0100", "t": "Метрики Урско-Бедаревской ц. 1897–1912 — дети Ивана Никитина и Анны Осиповой (Иосифовой) Бедаревых", "ref": "ф.60 оп.1 д.657 ск.25,76,114; оп.6 д.1 ск.50,111; оп.4 д.104 ск.20,43,89,171; оп.5 д.31 ск.53,163,276; оп.4 д.386 ск.60,173,207,230; оп.6 д.44 ск.92,110", "d": "1897–1913", "url": "https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/114", "imgs": []}], "sibs": [{"n": "Фива · 1897", "d": "Фива Ивановна, род. 1.09.1897 (метрики Урско-Бедаревского; прежнее «Ольга» — ошибка распознавания)", "st": "one"}, {"n": "Александр †1899", "d": "Александр, род. ок. 9.12.1898, умер трёх месяцев", "st": "one"}, {"n": "Мария · 1900†", "d": "Мария, род. 27.07.1900, умерла от оспы в декабре 1900", "st": "one"}, {"n": "две Анны †мл.", "d": "Анна, 24.01–4.11.1902; Анна, 26.11–22.12.1904", "st": "one"}, {"n": "Василий · 1908", "d": "Василий, род. 16.03.1908, крещён 22.03 (метрики Урско-Бедаревского, сверено по скану)", "st": "one"}, {"n": "Анфиса · 1910†", "d": "Анфиса, род. 24.07.1910, умерла 12.08.1910", "st": "one"}, {"n": "Владимир · 1911–12", "d": "Владимир, род. 7.07.1911, умер 11.02.1912 (метрики Урско-Бедаревского, сверено по сканам)", "st": "one"}, {"n": "Николай · 1912", "d": "Николай, род. 6.12.1912, крещён 9.12 (метрики Урско-Бедаревского, сверено по скану)", "st": "one"}]}, {"id": "serafimwife", "g": 4, "x": 1688, "n": "Ольга Васильевна", "s": "Елескина · ≈1913–14 · дочь Василия Д.?", "st": "fam", "c": "lidiya", "name": "Ольга Васильевна Елескина(?)", "years": "1909? (или ≈1913–14) – ?", "body": "<p>Мать Лидии Серафимовны и ещё троих детей. По памяти Михаила, её, кажется, звали Олей, и в её честь назвали Ольгу Николаевну. Девичья фамилия неизвестна, вопрос к маме.<\/p><p>Бабушка Лидия записала: <b>Ольга Васильевна Елескина(?)<\/b>, 1909 года рождения, станция Улус(?) Бачатской волости (Старые Бачаты) Кузнецкого уезда — ныне Кемеровская область. Фамилия читается неуверенно. Значит, догадка «Олей звали маму Лидии Серафимовны» верна, и Ольга Николаевна, вероятно, названа в её честь.<\/p><p>Архивный след: в метрических книгах Бачатской церкви все Елескины записаны как <b>инородцы-телеуты<\/b> Телеутской управы, Больше-Бачатский улус. Слово «Улус» в записи бабушки — это и есть улус, телеутское поселение. По этой линии у Михаила возможны телеутские корни (телеуты — коренной тюркский народ Кузбасса), но запись «инородец» означала сословие, а не происхождение (см. ниже, 03.11). Кандидат в отцы: Василий Димитриев Елескин, инородец, 2-я половина улуса Больше-Бачатского (дети в 1902–1905). Все рождения 1909 года в этой книге (сканы 118–175) просмотрены глазами: Ольги Васильевны Елескиной среди них нет. Возможно, она родилась в 1908 или 1910 году либо крещена в другом приходе.<\/p><p class=\"src\">ГА Кузбасса ф.60 оп.4 д.157 ск.62, 130 (1902–1905); <a href=\"https://ya.ru/archive/catalog/c99a9bbe-5b65-4eb6-b891-4b1162c84fae/1\">ф.60 оп.4 д.394 (1908–1909)<\/a> — «Яндекс Поиск по архивам»<\/p><p class=\"src\">Записи бабушки Лидии Серафимовны, 29.10.2026 (фото листов: inputs/babushka-2026-10-29/)<\/p><p><b>02.11.2026, мама:<\/b> отец Ольги умер, когда ей было около трёх лет, мать — когда около двенадцати; сестра — Августа Васильевна («тётя Гутя»), были и другие сёстры. Поэтому версия ниже (мать Христина Кондратьевна, у которой сын родился в 1923 году) <b>снята<\/b>.<\/p><p><b>Новый кандидат в отцы — Василий Димитриев Елескин<\/b>, «гражданин улуса Больше-Бачатского», умер 4.04.1917 от чахотки, 48 лет (запись сверена по скану). Жена — Александра Егорова (Пушкарева) из д. Артыштинской, венчались около 1890/91 года. Дети по метрикам: Мавра (≈1893; в 1917 вышла за Дионисия Евгеньева Нарышева из д. Заречной), Иоанн (1895), Татьяна (1900), Василиса (1904). Если он отец, Ольга родилась около 1913–1914 годов, а не в 1909-м. Её запись о рождении пока не найдена: в Бачатской церкви её нет за 1908–09, 1912–14 и 1916–18 годы, в Челухоевской — за 1912 и 1916–18. Улус относился к <b>Челухоевской<\/b> церкви, а её книг за 1913–1914 онлайн нет (вторые экземпляры — в Томском архиве). В книгах встречаются и другие девицы Васильевны Елескины — Татьяна, Аполлинария, Елена; это могут быть сёстры.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/bb2430b0-0121-44ef-a042-c1771c0d4b39/142\">смерть 1917: ГА Кузбасса ф.60 оп.6 д.63, скан 142<\/a> · <a href=\"https://ya.ru/archive/catalog/bb2430b0-0121-44ef-a042-c1771c0d4b39/126\">брак Мавры 1917: там же, скан 126<\/a><\/p><p><b>03.11.2026, мама: братья и сёстры Ольги<\/b> — сёстры <b>Августа, Мавра, Антонина<\/b>, братья <b>Михаил, Дмитрий, Иван<\/b>.<\/p><p><b>03.11.2026, метрики: вероятная семья — Василий Павлов Елескин и Анна Захарова.<\/b> Они обвенчались около 1885–86 года, обоим было по 19 лет. Пять из шести названных мамой имён есть среди их детей: <b>Михаил<\/b> (11.01.1887), <b>Августа<\/b> (ноябрь 1889), <b>Димитрий<\/b> (26.10.1893), <b>Иоанн<\/b> (14.08.1899), <b>Антонида<\/b> (28.02.1906). Кроме них — Анна (1902) и Петр (1903). В 1912–1918 годах семья жила в деревне <b>Заречной<\/b> Телеутской волости. <b>Мавры<\/b> у них нет: Мавра Васильевна (≈1894) — дочь другого Василия, Димитриева. Поэтому версия «отец — Василий Димитриев» ослабла. Но есть и противоречие: Василий Павлов в 1917 году был жив (поручитель на свадьбе), а по памяти семьи отец Ольги умер, когда ей было около трёх. Матери в 1909 году было бы около 43 лет. Рождение самой Ольги у этой пары не найдено: книги 1907–1916 годов частично не распознаны. Нужно найти запись о смерти Василия Павлова после 1917 года.<\/p><p class=\"src\">ГА Кузбасса ф.60: <a href=\"https://ya.ru/archive/catalog/4ea8d58c-c9fc-4d1e-81db-0bf11dd9a9d8/213\">оп.1 д.473 ск.213 (Михаил)<\/a>, <a href=\"https://ya.ru/archive/catalog/4ea8d58c-c9fc-4d1e-81db-0bf11dd9a9d8/57\">ск.57 (Августа)<\/a>, <a href=\"https://ya.ru/archive/catalog/ebfbc3f3-276e-4267-98d0-8b46e3273498/230\">оп.1 д.715 ск.230 (Димитрий)<\/a>, <a href=\"https://ya.ru/archive/catalog/271c639f-6411-4e47-9ec0-9d25df1a4c58/130\">оп.4 д.20 ск.130 (Иоанн)<\/a>, <a href=\"https://ya.ru/archive/catalog/a8c34558-db15-4772-b96f-5973e0585d1d/59\">оп.4 д.275 ск.59 (Антонида)<\/a>, <a href=\"https://ya.ru/archive/catalog/bb2430b0-0121-44ef-a042-c1771c0d4b39/125\">оп.6 д.63 ск.125 (В. П. жив в 1917)<\/a>; брак — оп.1 д.423 ск.223. В основном по распознанному тексту.<\/p><p class=\"src\">Ответ мамы 03.11.2026 (inputs/family/mom-answers-2026-11-03.txt)<\/p><p><b>03.11.2026, мама:<\/b> отец Ольги Василий был <b>кузнецом<\/b>, «добрым бессеребреником» — его все угощали, он спился и умер молодым. В детстве у Ольги была подруга-телеутка «монголоидного типа», жившая <b>через реку<\/b>; Лида её стеснялась. В семье Ольги все говорили <b>по-русски<\/b>.Вывод: «инородец Телеутской волости» в метриках — это сословная и податная запись. Скорее всего, семья была крещёной и обрусевшей, а себя телеутами не считала. Деревня Заречная, где жил Василий Павлов, как раз «за рекой» от улуса. Что Ольга этническая телеутка — <b>не доказано<\/b>. «Умер молодым» лучше подходит к Василию Димитриеву (48 лет, 1917), чем к Василию Павлову (жив в 1917 году в 51 год).<\/p><p><b>03.11.2026, поиск продолжен.<\/b> Найдены смерти двух детей Василия Павлова, Анны и Петра, в 1905 году. Просмотрены глазами рождения Челухоевской церкви с декабря 1913 по октябрь 1914 года: у Елескиных девять детей, но Ольги среди них нет. Крёстный Димитрий Данилов Елекин из Ново-Заречной может быть дедом по линии Димитриева, но это гипотеза. Смерти Василия Павлова и Анны Захаровой пока не найдены. Челухоевских книг за 1906–1909, 1913 и 1916 годы онлайн нет, а метрик за 1919–1924 годы нет совсем. <\/p><p><b>03.11.2026, главная находка: вероятно, умерла мать Ольги.<\/b> В книге смертей ЗАГС по Бачатскому району за 1925 год, Зареченский сельсовет, записана <b>Елескина Александра<\/b>: крестьянка, вдова, 53 года (родилась около 1872), умерла <b>22.09.1925<\/b>, похоронена на кладбище Большого Бачата. О смерти заявил <b>сын Дмитрий<\/b>. Отчество не указано. Если это Александра Егоровна, вдова Василия Димитриева, то всё сходится. Отец умер в апреле 1917 года, мать — в сентябре 1925-го. По словам мамы, Ольге тогда было около трёх и около двенадцати лет; значит, она родилась около <b>1913–1914<\/b> годов. В семье есть сын Дмитрий и дочь Мавра, а «умер молодым» подходит к 48 годам. Поэтому версия «Ольга — дочь Василия Димитриева и Александры Егоровны» снова основная. Сходство имён с детьми Василия Павлова, скорее всего, случайное: имена в роду Елескиных повторяются. Записи о рождении Ольги нет, книга Челухоевской церкви за 1913 год онлайн не выложена.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/eaebeb6c-4174-43f0-820a-cb883286cfa5/55\">ГА Кузбасса ф.Р-1239 оп.1 д.827, ск.55–56, акт №32 (1925)<\/a> · <a href=\"https://ya.ru/archive/catalog/fb467892-c43f-4478-b58f-4d358257cf15/49\">алфавитный указатель д.953, ск.49<\/a><\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/07781ef5-6d70-40be-aa09-326d0a439a05/54\">ф.60 оп.6 д.3 ск.54–55 (смерти 1905)<\/a> · <a href=\"https://ya.ru/archive/catalog/07781ef5-6d70-40be-aa09-326d0a439a05/203\">ск.203–250 (рождения 1914)<\/a> · переписка с мамой 03.11 (inputs/family/)<\/p><p><b>31.10.2026 (снято 02.11, перепроверить 03.11): возможная семья.<\/b> Два брата Елескины Васильевичи из с. Каракан Беловского р-на (рядом с Бачатами): <b>Дмитрий<\/b> (1913, до войны жил в Томске, пропал без вести в 1943) и <b>Николай<\/b> (1923, ст. сержант 340 сд, пропал без вести в 1943). Оба разыскивала одна и та же мать — <b>«Елескина Хрест. Конд.»<\/b>, то есть Христина (Хрестина) Кондратьевна, г. Белово, ул. Фрунзе, 73 (анкета розыска от 30.12.1946 и список Беловского военкомата). То, что Дмитрий и Николай — братья, видно из двух независимых документов. Что они братья Ольги, а Христина Кондратьевна — её мать, пока только гипотеза: совпадают фамилия, отчество, район и Белово, где жил Серафим. Других Елескиных-Васильевичей по Кузбассу в базах нет.<\/p><p class=\"src\">Память народа: <a href=\"https://pamyat-naroda.ru/heroes/memorial-chelovek_dopolnitelnoe_donesenie8263375/\">Дмитрий 1913<\/a> (ЦАМО ф.58 оп.977520 д.3289), <a href=\"https://pamyat-naroda.ru/heroes/person-hero104254972/\">Николай 1923<\/a> · Всекузбасская Книга памяти т. 16, с. 200–201 · скрины: inputs/pn/<\/p>", "docs": [{"id": "A-0031", "t": "Метрическая книга Бачатской церкви 1902, 1904–1905 — Василий Димитриев Елескин, инородец Телеутской управы", "ref": "ф.60 оп.4 д.157 ск.62, 130", "d": "1902–1905", "url": "", "imgs": []}, {"id": "A-0032", "t": "Метрическая книга церкви с. Бачатского за 1908–1909 (215 сканов) — сплошной просмотр OCR на «Елеск»", "ref": "ф.60 оп.4 д.394", "d": "1908–1909", "url": "https://ya.ru/archive/catalog/c99a9bbe-5b65-4eb6-b891-4b1162c84fae/1", "imgs": []}, {"id": "A-0043", "t": "Метрики Бачатской церкви — семья инородца Василия Васильева Елескина (улус Больше-Бачатский, Телеутская управа 2 половины)", "ref": "ф.60 оп.1 д.876 ск.199 (1898); оп.1 д.473 ск.58 (1887–89); оп.6 д.46 ск.164, 136 (1912–14)", "d": "1887–1914", "url": "https://ya.ru/archive/catalog/a7054b47-3378-4623-811c-4dd2c6a6b6bc/199", "imgs": []}, {"id": "A-0064", "t": "Метрическая книга церкви с. Челухоевского за 1905, 1910–1911, 1915 гг. — телеуты улуса Больше-Бачатского (Телеутская управа 2 половины), семьи Елескиных", "ref": "ф.60 оп.6 д.3", "d": "1905; 1910–1911; 1915", "url": "https://ya.ru/archive/catalog/07781ef5-6d70-40be-aa09-326d0a439a05/1 (ск.1–293)", "imgs": []}, {"id": "A-0093", "t": "Метрики Бачатской и Челухоевской церквей — семья инородца Василия Димитриева Елескина (Больше-Бачатский улус)", "ref": "ф.60 оп.1 д.550 ск.87 (брак 1890/91); оп.1 д.715 ск.289; оп.1 д.876 ск.192 (1895); оп.4 д.20 ск.165 (1900); оп.4 д.157 ск.62 (1904); оп.6 д.63 ск.142 (смерть 1917)", "d": "1890–1917", "url": "https://ya.ru/archive/catalog/8de75cae-32c6-4666-8981-91dc3c4eb195/87", "imgs": []}, {"id": "A-0094", "t": "Метрики Бачатской/Челухоевской церквей — две Августы Васильевны Елескины", "ref": "ф.60 оп.1 д.473 ск.57; оп.6 д.63 ск.48, 84, 125", "d": "1887–1917", "url": "https://ya.ru/archive/catalog/bb2430b0-0121-44ef-a042-c1771c0d4b39/48", "imgs": []}, {"id": "A-0114", "t": "Метрики Пестеревской/Бачатской/Челухоевской ц. — дети Василия Павлова Елескина и Анны Захаровой", "ref": "ф.60 оп.1 д.423 ск.223 (брак); оп.1 д.473 ск.213, 57; оп.1 д.715 ск.230; оп.4 д.20 ск.130; оп.4 д.157 ск.5, 73; оп.4 д.275 ск.59; оп.6 д.3 ск.48; оп.6 д.63 ск.84, 125, 142; оп.6 д.385 ск.4", "d": "1885–1918", "url": "https://ya.ru/archive/catalog/4ea8d58c-c9fc-4d1e-81db-0bf11dd9a9d8/213", "imgs": []}, {"id": "A-0115", "t": "Челухоевская ц.: смерти детей Василия Павлова Елескина (1905); смерть Анны Захаровой Нарышевой (1915)", "ref": "ф.60 оп.6 д.3 ск.54, 55, 290 (№52)", "d": "1905; 21.11.1915", "url": "https://ya.ru/archive/catalog/07781ef5-6d70-40be-aa09-326d0a439a05/54", "imgs": []}, {"id": "A-0118", "t": "Челухоевская ц., рождения XII.1913–X.1914 (ф.60 оп.6 д.3 ск.203–250) — Елескины, просмотр глазами", "ref": "ф.60 оп.6 д.3 ск.203–250", "d": "1913-12..1914-10", "url": "https://ya.ru/archive/catalog/07781ef5-6d70-40be-aa09-326d0a439a05/203", "imgs": []}, {"id": "A-0119", "t": "ЗАГС: акт о смерти №32 (жен. №15) Елескиной Александры, Зареченский с/с, 22.09.1925", "ref": "ф.Р-1239 оп.1 д.827 ск.55–56 (акт №32); указатель д.953 ск.49", "d": "1925-09-22 (запись 23.09.1925)", "url": "https://ya.ru/archive/catalog/eaebeb6c-4174-43f0-820a-cb883286cfa5/55", "imgs": []}], "sibs": []}, {"id": "sergey1887", "g": 5, "x": 229, "n": "Сергей Сергеевич", "s": "Соколов · 1887–1942", "st": "doc", "c": "sergey1911", "name": "Соколов Сергей Сергеевич", "years": "29.12.1887 – 10.07.1942", "body": "\n        <p>Родился в селе Апальково Кромского уезда Орловской губернии, потомственный дворянин. Окончил Харьковский ветеринарный институт (1910). Ветврач Забайкальского казачьего войска (Акша, 1911–1912), затем в Уральской области; в 1917 году старший ветврач 7-го Уральского казачьего полка, титулярный советник. Сестра — Мария Сергеевна Власова (1887–1915).<\/p>\n        <p><b>02.11.2026.<\/b> Нашлась вторая, независимая копия записи о рождении — справка Орловской консистории от 30.01.1896, выданная по прошению отца, «Кромского землевладельца коллежского асессора Сергея Ивановича Соколова». В ней: «1887 года декабря 29 рождён, а 1888 г. января 11 крещён Сергий»; родители — «села Апалькова артиллерии поручик Сергий Иванов Соколов и законная жена его Екатерина Иванова». Крёстные — священник Григорий Иванов Переверзев и вдова титулярного советника из Орла Анна Николаевна Соколова (кем она приходится семье — неизвестно). Сверено по скану.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/94f03d92-b420-4fcb-b332-daccd1129682/74\">ЦГА Москвы ф.2122 оп.3 д.218, скан 74<\/a><\/p>\n        <p>В 1941 году ветврач ветуправления Мособлзо, жил в Останкине, в посёлке Первого Мая. Арестован 12.11.1941 по ст. 58-10 ч.2 по показаниям сослуживцев о его высказываниях о войне. Умер 10.07.1942 в Казанской тюремной психиатрической больнице НКВД.<\/p>\n        <p>Независимо подтверждено (проверено 30.10.2026): казанский список умерших (по личному делу ИЦ МВД Татарстана № 16458) — арест 12.11.1941, ст. 58-10 ч.2, смерть 10.07.1942; московский список реабилитированных («Московская правда») — ветврач МОЗО, Первомайский посёлок, д. 21, кв. 2. В Книге памяти Татарстана дата смерти — 10.12.1942; вероятно, при перепечатке спутаны месяцы VII и XII.<\/p>\n        <p class=\"flag\">В деле НКВД место рождения искажено («с. Атальское»). Досье Вики относит «пос. 1 Мая» к фабрике на Десне, но в постановлении сказано: Останкино.<\/p>\n        <p class=\"src\">Постановления УНКВД МО от 10–11.11.1941 (сканы от Вики) · <a href=\"https://pomnirod.ru/materialy-k-statyam/repressii/%D0%BA%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%B4%D0%B0%D1%80%D1%81%D0%BA%D0%B8%D0%B9-%D0%BA%D1%80%D0%B0%D0%B93/%D1%80%D1%81%D1%84%D1%81%D1%80/%D1%82%D0%B0%D1%82%D0%B0%D1%80%D1%81%D1%82%D0%B0%D0%BD/umershie-v-kazanskoj-specializirovannoj-psihbolnice-s-1940-po-1970-god.html\">список умерших в Казанской спецпсихбольнице<\/a>, № 1360, дело в МВД 16458 (также <a href=\"https://bessmertnybarak.com/article/itk-5/\">«Бессмертный барак»<\/a>) · «Жертвы политического террора» (Мемориал): <a href=\"https://web.archive.org/web/20250512214341/https://lists.memo.ru/d30/f484.htm\">lists.memo.ru/d30/f484<\/a> (архивная копия; сам сайт не открывается) · РГИА ф.1343 оп.36 д.23529 (метрика, по выписке)<\/p>\n        <p><b>02.11.2026. Наводка:<\/b> в описи Харьковского облархива (ДАХО ф.928 оп.1) значится личное дело «Соколов Сергей Сергеевич, 1906–1913», 17 листов (д.3967). В 1910 году Сергей Сергеевич уже «ветеринарный врач», а в Харькове был ветеринарный институт. По годам (с 18–19 лет) дело подходит, но название фонда и тождество пока не сверены. В таком деле обычно лежат метрика и аттестат.<\/p>\n        <p class=\"src\"><a href=\"https://archives.kh.gov.ua/wp-content/uploads/2018/02/%D1%84.928-%D0%BE%D0%BF.1-%D1%82%D0%BE%D0%BC-2-%D1%87%D0%B0%D1%81%D1%82%D0%B8%D0%BD%D0%B0-2.pdf\">ДАХО ф.928 оп.1 т.2 ч.2, с.56 (PDF стр. 6)<\/a><\/p>\n      ", "docs": [{"id": "A-0012", "t": "Досье Вики: «7 Соколов Сергей Иванович 1861-1917.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0013", "t": "Досье Вики: «8Сергей Сергеевич Соколов.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0056", "t": "«Бессмертный барак»: список «Умершие в Казанской специализированной психбольнице с 1940 по 1970 год», №1360", "ref": "«дело в МВД 16458»", "d": "1942", "url": "https://bessmertnybarak.com/article/itk-5/", "imgs": []}, {"id": "A-0057", "t": "«Жертвы политического террора в СССР» (Мемориал), запись по Книге памяти Республики Татарстан", "ref": "Мемориал / Книга памяти РТ", "d": "1942", "url": "https://lists.memo.ru/d30/f484.htm (домен не резолвится", "imgs": []}, {"id": "A-0058", "t": "«Жертвы политического террора в СССР» (Мемориал), запись по газете «Московская правда» (списки реабилитированных)", "ref": "Мемориал / «Московская правда»", "d": "", "url": "https://lists.memo.ru/d30/f484.htm (копия Wayback)", "imgs": []}, {"id": "A-0077", "t": "Российский медицинский список на 1912, 1913, 1914, 1916 гг. (разделы ветврачей)", "ref": "", "d": "1912–1916", "url": "", "imgs": []}, {"id": "A-0106", "t": "Копия справки Орловской консистории 30.01.1896 о рождении Сергея Сергеевича Соколова (Апальково, 29.12.1887)", "ref": "ф.2122 оп.3 д.218 ск.74 (копия МК Николаевской ц. с. Апальково 1888 ч.1 №3)", "d": "29.12.1887 / 11.01.1888", "url": "https://ya.ru/archive/catalog/94f03d92-b420-4fcb-b332-daccd1129682/74", "imgs": []}, {"id": "A-0107", "t": "Брак С.С. Соколова и Клавдии Алексеевны (Москва, 09.1910) и метрики с. Михалево ~1912", "ref": "ЦГА Москвы ф.203 оп.782 д.179 ск.291 (№122); ЦГАМО ф.43 оп.1 д.145 ск.142,152,209", "d": "09.1910; ~1912", "url": "https://ya.ru/archive/catalog/5ccd31f0-8538-4d53-9359-33a52721dec0/291", "imgs": []}, {"id": "A-0112", "t": "ДАХО ф.928 оп.1 т.2 ч.2, с.56: д.3967 Соколов Сергей Сергеевич 1906–1913, 17 л.", "ref": "ф.928 оп.1 д.3967", "d": "1906–1913", "url": "https://archives.kh.gov.ua/wp-content/uploads/2018/02/ф.928-оп.1-том-2-частина-2.pdf (PDF стр.6)", "imgs": []}], "sibs": [{"n": "Мария · 1887–1915", "d": "Мария Сергеевна Власова (1887–1915), сестра (по досье Вики)", "st": "one"}]}, {"id": "klavdiya", "g": 5, "x": 411, "n": "Клавдия Алексеевна", "s": "Соколова", "st": "one", "c": "sergey1911", "name": "Соколова Клавдия Алексеевна", "years": "? – ?", "body": "<p>Жена С. С. Соколова (1887). В послужном списке 1915 года: «женат на крестьянской девице Клавдии Алексеевой, имеет сына Сергея, родившегося 30 сентября 1911».<\/p><p class=\"src\">РГИА ф.1302 оп.6 д.716 лл.33–36 (по выписке Вики)<\/p><p><b>31.10.2026.<\/b> Адрес 1913 года из телеграммы («Дурной пер., д. Дарбман, кв. 4»), вероятно, — дом <b>Фарбман<\/b>, Дурной (ныне Товарищеский) пер., 16: так в «Вся Москва» 1914. В том же доме жила Ермилова Прасковья Алексеевна — то же отчество, возможная сестра Клавдии (только гипотеза). По «Российскому медицинскому списку» муж в 1912 служил в ветуправлении 2-го военного отдела Забайкальского казачьего войска (Акша), в 1914 — пос. Уильский, в 1916 — Уральск. Девичью фамилию может назвать его формулярный список (РГВИА / ГА Забайкальского края / ГА Западно-Казахстанской обл.). Сын Сергей родился 30.09.1911 по старому стилю = 13.10.1911 по новому — даты совпадают.<\/p><p><b>02.11.2026. Свадьба найдена:<\/b> сентябрь 1910 года, Москва, Трёхсвятительская церковь на Кулишках, запись № 122. Жених — «ветеринарный врач Сергей Сергеев Соколов», 22 года (в паспорте — имение Соколовка Кромского уезда). Невеста — Клавдия Алексеевна, крестьянка села Михалево Бронницкого уезда Московской губернии; фамилия в распознанном тексте неясна («Мохова» или «Мотова»), на скан ещё не смотрели. По метрикам Михалева около 1912 года у дворянина С. С. Соколова родилась дочь Милица и умер годовалый сын Георгий (только распознанный текст).<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/5ccd31f0-8538-4d53-9359-33a52721dec0/291\">ЦГА Москвы ф.203 оп.782 д.179, скан 291<\/a> · ЦГАМО ф.43 оп.1 д.145, сканы 142, 152, 209<\/p>", "docs": [{"id": "A-0013", "t": "Досье Вики: «8Сергей Сергеевич Соколов.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0078", "t": "«Вся Москва» 1914 — Дурной пер., 16", "ref": "", "d": "1914", "url": "", "imgs": []}, {"id": "A-0107", "t": "Брак С.С. Соколова и Клавдии Алексеевны (Москва, 09.1910) и метрики с. Михалево ~1912", "ref": "ЦГА Москвы ф.203 оп.782 д.179 ск.291 (№122); ЦГАМО ф.43 оп.1 д.145 ск.142,152,209", "d": "09.1910; ~1912", "url": "https://ya.ru/archive/catalog/5ccd31f0-8538-4d53-9359-33a52721dec0/291", "imgs": []}], "sibs": []}, {"id": "frayery", "g": 5, "x": 832, "n": "Роберт и Каролина", "s": "Фрайер (Энгель)?", "st": "hyp", "c": "olgade", "name": "Фрайер Роберт Вильгельмович и Каролина Фридриховна (Энгель)", "years": "Выгода 1925 – Норминга 1934", "body": "<p>Вероятные родители Лидии Робертовны, то есть прапрапрадед и прапрапрабабушка Михаила. Всё известное о них взято из воспоминаний их дочери <b>Анны Робертовны Фрайер<\/b> (1920–1997), написанных в 1996 году и опубликованных в 2013-м.<\/p><p>Жили на хуторе в 30 км от Одессы; там же жила мать Роберта. В 1925 году купили дом в Выгоде. В ноябре 1929-го их раскулачили. В феврале 1930-го Роберта арестовали по дороге на мельницу, а семью выслали в Вологду, в Прилуцкий монастырь. Детей до 18 лет в апреле 1930-го отпустили, и «мамин племянник» увёз их домой. В 1932 году, в голод, семью снова привезли в Вологду; родители работали на кирпичном заводе № 5. В августе 1934-го всех перевели в Коношу, в посёлок Норминга. Там Роберт работал на лесозаготовках, Каролина — дояркой. Около 1935 года Роберта по ложному доносу осудили на пять лет; его отправили в Печору, и оттуда он не вернулся.<\/p><p>Дочери: 1918 (старшая, на лесоскладе потеряла два пальца), 1920 (Анна), 1922, 1924, 1926 и младшая около 1929 года. Младшая умерла в 1930-м, ещё одна — около 1932-го. Лидия, по-видимому, одна из них.<\/p><p class=\"flag\">То, что Лидия — их дочь, пока гипотеза: совпадают фамилия, отчество, Выгода и Норменга. Подтвердить её может запись о рождении Николая 1938 года (там указана мать) или учётное дело семьи спецпоселенцев. Возможный брат Роберта — Адольф Вильгельмович Фраер (1904, Одесса; расстрелян в 1938-м).<\/p><p class=\"src\"><a href=\"https://www.osu.ru/sites/niisu/docs/germans.pdf#page=118\">Блинова О. Э. «Немецкое население на Южном Урале в военные и послевоенные годы», Оренбург, 2013, с. 116–120<\/a><\/p>", "docs": [{"id": "A-0108", "t": "Блинова О.Э. Воспоминания матери, Фишлер (Фрайер) Анны Робертовны, 1920–1997 // Немецкое население на Южном Урале в военные и послевоенные годы. Оренбург, 2013", "ref": "печ. с.116–120 (PDF 117–121)", "d": "1996 (написано); 2013 (публ.)", "url": "https://www.osu.ru/sites/niisu/docs/germans.pdf#page=118", "imgs": []}, {"id": "A-0109", "t": "ДАОО ф.Р-8220 (Беляевский райЗАГС): описи оп.2а (кадр 00003) и оп.1а (кадр 00004)", "ref": "Р-8220 оп.2а д.2 (алфавит рождений 1924–1925, 98 л., Біляївський р-н вкл. Фрейденталь, К.Лібенталь, Нейбург, Петерсталь); Р-8220 оп.1а д.20 (рождения 1925, 377 л.; Фрейденталь 13.01.192[4→5]–31.12.1925)", "d": "1924–1925", "url": "https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_02a/ukrnod01d_fr-8220-op2a-opys_m_00003.jpg", "imgs": []}], "sibs": []}, {"id": "vasiliy", "g": 5, "x": 650, "n": "Василий", "s": "Федосов", "st": "hyp", "c": "yakov", "name": "Федосов Василий", "years": "известен по отчеству Якова", "body": "<p>Отец Якова. Мама однажды написала, что её прадед «всю жизнь прожил и умер под чужой фамилией». Если речь о нём, фамилия Федосов могла быть принятой, а не родовой. Это пока вопрос к маме.<\/p><p class=\"src\">Telegram 22.09.2022 (сообщение 917822)<\/p>", "docs": [], "sibs": []}, {"id": "ivanbed", "g": 5, "x": 1400, "n": "Иван Никитин", "s": "Бедарев · 1874", "st": "doc", "c": "serafim", "name": "Бедарев Иван Никитин", "years": "май 1874 – ?", "body": "\n        <p>Родился в мае 1874 года в селе Урско-Бедаревском (год вписан рукой в заголовке страницы). Отец — крестьянин Никита Ананьев Бедарев, мать — Параскевья Петрова. Раньше казалось, что свадьба родителей записана среди записей 1875 года и противоречит этой дате. Но это оказалась ошибка распознавания: свадьба стоит в книге за 1873 год, так что всё сходится.<\/p>\n        <p><b>4 ноября 1896 года<\/b>, в 21 год, первым браком венчался с девицей <b>Анной Иосифовой Пестеревой<\/b> из деревни Пестеревой Касьминской волости. Поручителем со стороны жениха был тот же дядя Алексей Ананьев: по этой детали метрика рождения и свадьба 1896-го уверенно связываются с одним человеком.<\/p>\n        <p>Дети Ивана и Анны по метрикам прихода: <b>Фива (1.09.1897<\/b>; раньше по распознанному тексту читалась как «Ольга», 02.11 оба экземпляра книги сверены по скану — «Ѳива»; крёстная — тётя, девица Фива Никитина), Александр (вероятно 9.12.1898, умер трёх месяцев в 1899-м), Мария (27.07.1900, умерла от оспы в декабре 1900), Анна (24.01.1902 – 4.11.1902), вторая Анна (26.11.1904 – 22.12.1904), <b>Серафим (26.12.1905)<\/b>, Василий (16.03.1908), Анфиса (24.07.1910 – 12.08.1910), Владимир (7.07.1911 – 11.02.1912), Николай (6.12.1912). По распознанному тексту есть ещё смерть Руффины (1903), её рождение не найдено. Даты сверены по сканам 30.10.2026; прежняя «вторая Мария 1907–1911» оказалась ошибкой распознавания (это дочь Т. Логунова). Просмотрены книги 1897, 1900–1914; 1899 год — ещё нет. В 1910-х Иван Никитин ещё живёт в селе и выступает поручителем на свадьбах.<\/p>\n        <p>Братья и сёстры Ивана по тем же книгам: Андрей, Фива, Наталья, Павел (умер полугода), Тихон (1880-е), Яков (умер в 1890-х).<\/p>\n        <p class=\"src\"><a href=\"https://ya.ru/archive/catalog/b6b92d4b-4047-4a45-8078-275c6a317d78/42\">рождение 1874: ГА Кузбасса ф.60 оп.1 д.73, скан 42<\/a> · <a href=\"https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/85\">брак 1896: ф.60 оп.1 д.657, скан 85<\/a> · дети: ф.60 оп.1 д.648 ск.294, д.657 ск.76; оп.4 д.104 ск.43; оп.4 д.386 ск.207, 230; оп.6 д.1 ск.50; оп.6 д.44 ск.92, 110 <span class=\"tag\">inputs/yandex-archive/<\/span><\/p>\n      <p>По записи бабушки Лидии: Бедарев Иван Никитич из д. Ур-Бедари <b>жил под другой фамилией — Бородин(?)<\/b> — в г. (или д.?) Камень-на-Оби (Алтай). Это, видимо, и есть «прадед под чужой фамилией», о котором мама писала в 2022 году. Причина смены фамилии неизвестна — для 1920–30-х годов типично бегство от раскулачивания или ссылки.<\/p><p class=\"src\">Записи бабушки Лидии Серафимовны, 29.10.2026 (фото листов: inputs/babushka-2026-10-29/)<\/p><p><b>03.11.2026:<\/b> вышла замуж за Николая Яковлевича в Белове; дальше с ним — Ленинград(?), Орджоникидзе, Москва.<\/p><p class=\"src\">Рассказ Михаила, 03.11.2026<\/p>", "docs": [{"id": "A-0020", "t": "Метрическая книга церкви с. Ур-Бедаревского 1900–1903, 1905–1906 (церковный экз.?) — рождение Серафима", "ref": "ф.60 оп.4 д.104 скан 224", "d": "1905-12-26 (ст. ст.)", "url": "https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/224", "imgs": ["scans/serafim-1905-d104-s224-parents.png"]}, {"id": "A-0021", "t": "Метрическая книга церкви с. Урско-Бедаревского 1905–1910 (второй экз.) — рождение Серафима", "ref": "ф.60 оп.5 д.31 скан 53", "d": "1905-12-26", "url": "https://ya.ru/archive/catalog/3347c189-e4b0-4549-baf3-feb31396c927/53", "imgs": ["scans/serafim-1905-d31-s53-parents-a.png"]}, {"id": "A-0037", "t": "Метрическая книга Ур-Бедаревской церкви 1891–1898, ч. 2 о бракосочетавшихся, 1896 г., запись №15 от 4 ноября", "ref": "ф.60 оп.1 д.657 скан 85 (л.80 об.–81)", "d": "1896-11-04 (ст. ст.)", "url": "https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/85", "imgs": ["scans/ivan-bedarev-brak-1896-d657-s85.png"]}, {"id": "A-0040", "t": "Метрики Ур-Бедаревской церкви 1891–1914 — дети Ивана Никитина и Анны Осиповой Бедаревых (сводка по OCR)", "ref": "ф.60 оп.1 д.648, 657; оп.4 д.104, 386; оп.6 д.1, 44", "d": "1897–1914", "url": "", "imgs": []}, {"id": "A-0041", "t": "Метрическая книга Урско-Бедаревской церкви 1871–1875, ч.1 о родившихся (1874), №19 муж.", "ref": "ф.60 оп.1 д.73 скан 42 (л.37 об.)", "d": "1875, май (день неуверенно: 19/14 по столбцам)", "url": "https://ya.ru/archive/catalog/b6b92d4b-4047-4a45-8078-275c6a317d78/42", "imgs": ["scans/ivan-bedarev-rozhd-1875-d73-s42.png"]}, {"id": "A-0060", "t": "Метрическая книга церкви с. Урско-Бедаревского 1911–1914 — Владимир (рожд. 1911, смерть 1912) и Николай (рожд. 1912), дети Ивана Никитина Бедарева", "ref": "ф.60 оп.6 д.44 ск.20, 92, 110", "d": "1911-07-07; 1912-02-11; 1912-12-06 (ст. ст.)", "url": "https://ya.ru/archive/catalog/b105f887-6b7f-41bc-8688-eb5d1d206c5a/20", "imgs": ["scans/vladimir-bedarev-rozhd-1911-op6-d44-s20.png", "scans/vladimir-bedarev-smert-1912-op6-d44-s92.png", "scans/nikolay-bedarev-rozhd-1912-op6-d44-s110.png"]}, {"id": "A-0061", "t": "Метрическая книга церкви с. Урско-Бедаревского 1907–1911 (ф.60 оп.4 д.386) — дети Ивана Никитина и Анны Осиповой Бедаревых", "ref": "ф.60 оп.4 д.386 ск.51 (титул «на 1908 годъ»), 60, 157 (титул 1910), 173, 207, 230", "d": "1908-03-16; 1910-07-24; 1910-08-12; 1911-07-07 (ст. ст.)", "url": "https://ya.ru/archive/catalog/8e1f71c4-0f8b-4aa2-b139-e84917563795/60", "imgs": ["scans/vasiliy-bedarev-rozhd-1908-op4-d386-s60.png", "scans/anfisa-bedareva-rozhd-1910-op4-d386-s173.png", "scans/anfisa-bedareva-smert-1910-op4-d386-s207.png", "scans/vladimir-1911-dup-and-maria-logunova-op4-d386-s230.png"]}, {"id": "A-0062", "t": "Метрическая книга церкви с. Ур-Бедаревского 1900–1903, 1905–1906 (ф.60 оп.4 д.104) — дети Ивана Никитина и Анны Осиповой Бедаревых", "ref": "ф.60 оп.4 д.104 ск.3 (1900), 20, 43, 87 (1902), 89, 128", "d": "1900-07-27; 1900-12; 1902-01-24; 1902-11-04 (ст. ст.)", "url": "https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/20", "imgs": ["scans/maria-bedareva-rozhd-1900-op4-d104-s20.png", "scans/anna-bedareva-rozhd-1902-op4-d104-s89.png", "scans/anna-bedareva-smert-1902-op4-d104-s128.png"]}, {"id": "A-0063", "t": "Метрическая книга церкви с. Урско-Бедаревского за 1894, 1897, 1904 гг. — Ольга 1897 (2-й экз.), Анна 1904", "ref": "ф.60 (книга ccd3ca76…; шифр описи/дела не выписан) ск.3 (1894), 34 (1897), 70 (1904), 50, 90, 111", "d": "1897-09-01; 1904-11-26; 1904-12-22 (ст. ст.)", "url": "https://ya.ru/archive/catalog/ccd3ca76-193d-421d-92e7-e93ea0690ce8/50", "imgs": ["scans/anna2-bedareva-rozhd-1904-ccd3-s90.png", "scans/anna2-bedareva-smert-1904-ccd3-s111.png"]}, {"id": "A-0076", "t": "Всекузбасская Книга памяти т.4 (Ленинск-Кузнецкий), т.17 (Гурьевский р-н)", "ref": "", "d": "", "url": "https://mrech.ru/media/kniga_pamyati/Vsekuzbasskaya_Kniga_pamyati_t_4.pdf", "imgs": []}, {"id": "A-0100", "t": "Метрики Урско-Бедаревской ц. 1897–1912 — дети Ивана Никитина и Анны Осиповой (Иосифовой) Бедаревых", "ref": "ф.60 оп.1 д.657 ск.25,76,114; оп.6 д.1 ск.50,111; оп.4 д.104 ск.20,43,89,171; оп.5 д.31 ск.53,163,276; оп.4 д.386 ск.60,173,207,230; оп.6 д.44 ск.92,110", "d": "1897–1913", "url": "https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/114", "imgs": []}], "sibs": [{"n": "Андрей", "d": "Андрей Никитин Бедарев (метрики)", "st": "one"}, {"n": "Фива", "d": "Фива Никитина (метрики)", "st": "one"}, {"n": "Наталья", "d": "Наталья Никитина (метрики)", "
