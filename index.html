st": "one"}, {"n": "Павел †6 мес.", "d": "Павел, умер шести месяцев", "st": "one"}, {"n": "Тихон · 1877–89", "d": "Тихон Никитин, 1877–1889", "st": "one"}, {"n": "Яков †1890-е", "d": "Яков, умер от поноса в 1890-х", "st": "one"}]}, {"id": "annabed", "g": 5, "x": 1582, "n": "Анна Иосифовна", "s": "Пестерева · 1876", "st": "doc", "c": "serafim", "name": "Бедарева (Пестерева) Анна Иосифовна", "years": "11.12.1876 – ?", "body": "<p>Мать Серафима. Родилась 11 декабря 1876 года (крещена 21-го) в деревне Пестеревой Касьминской волости, приход Салаирской церкви. Отец — крестьянин Иосиф Ильин Пестерев, мать — Екатерина Иванова. Крёстный — Захар Иванов Шапошников, по-видимому брат матери.<\/p><p>4 ноября 1896 года вышла за Ивана Никитина Бедарева. В метриках детей она «Анна Осипова» или «Анна Иосифова»: Осип — бытовая форма имени Иосиф. Прежняя догадка, что она урождённая Бедарева, не подтвердилась.<\/p><p>Бабушка Лидия подтверждает: мать Серафима — Анна.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/6faad918-5019-4fd0-bbb0-fadc430fa8ea/41\">рождение 1876: ГА Кузбасса ф.60 оп.1 д.559, скан 41<\/a> · <a href=\"https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/85\">брак 1896: ф.60 оп.1 д.657, скан 85<\/a> (второй экземпляр: д.648, скан 255) <span class=\"tag\">inputs/yandex-archive/<\/span><\/p>", "docs": [{"id": "A-0020", "t": "Метрическая книга церкви с. Ур-Бедаревского 1900–1903, 1905–1906 (церковный экз.?) — рождение Серафима", "ref": "ф.60 оп.4 д.104 скан 224", "d": "1905-12-26 (ст. ст.)", "url": "https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/224", "imgs": ["scans/serafim-1905-d104-s224-parents.png"]}, {"id": "A-0021", "t": "Метрическая книга церкви с. Урско-Бедаревского 1905–1910 (второй экз.) — рождение Серафима", "ref": "ф.60 оп.5 д.31 скан 53", "d": "1905-12-26", "url": "https://ya.ru/archive/catalog/3347c189-e4b0-4549-baf3-feb31396c927/53", "imgs": ["scans/serafim-1905-d31-s53-parents-a.png"]}, {"id": "A-0037", "t": "Метрическая книга Ур-Бедаревской церкви 1891–1898, ч. 2 о бракосочетавшихся, 1896 г., запись №15 от 4 ноября", "ref": "ф.60 оп.1 д.657 скан 85 (л.80 об.–81)", "d": "1896-11-04 (ст. ст.)", "url": "https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/85", "imgs": ["scans/ivan-bedarev-brak-1896-d657-s85.png"]}, {"id": "A-0038", "t": "Метрическая книга Салаирской церкви 1876, ч.1 о родившихся, №45 (жен.)", "ref": "ф.60 оп.1 д.559 скан 41", "d": "1876-12-11 (рожд.), 1876-12-21 (крещ.), ст. ст.", "url": "https://ya.ru/archive/catalog/6faad918-5019-4fd0-bbb0-fadc430fa8ea/41", "imgs": ["scans/anna-pestereva-rozhd-1876-d559-s41.png"]}, {"id": "A-0040", "t": "Метрики Ур-Бедаревской церкви 1891–1914 — дети Ивана Никитина и Анны Осиповой Бедаревых (сводка по OCR)", "ref": "ф.60 оп.1 д.648, 657; оп.4 д.104, 386; оп.6 д.1, 44", "d": "1897–1914", "url": "", "imgs": []}, {"id": "A-0060", "t": "Метрическая книга церкви с. Урско-Бедаревского 1911–1914 — Владимир (рожд. 1911, смерть 1912) и Николай (рожд. 1912), дети Ивана Никитина Бедарева", "ref": "ф.60 оп.6 д.44 ск.20, 92, 110", "d": "1911-07-07; 1912-02-11; 1912-12-06 (ст. ст.)", "url": "https://ya.ru/archive/catalog/b105f887-6b7f-41bc-8688-eb5d1d206c5a/20", "imgs": ["scans/vladimir-bedarev-rozhd-1911-op6-d44-s20.png", "scans/vladimir-bedarev-smert-1912-op6-d44-s92.png", "scans/nikolay-bedarev-rozhd-1912-op6-d44-s110.png"]}, {"id": "A-0061", "t": "Метрическая книга церкви с. Урско-Бедаревского 1907–1911 (ф.60 оп.4 д.386) — дети Ивана Никитина и Анны Осиповой Бедаревых", "ref": "ф.60 оп.4 д.386 ск.51 (титул «на 1908 годъ»), 60, 157 (титул 1910), 173, 207, 230", "d": "1908-03-16; 1910-07-24; 1910-08-12; 1911-07-07 (ст. ст.)", "url": "https://ya.ru/archive/catalog/8e1f71c4-0f8b-4aa2-b139-e84917563795/60", "imgs": ["scans/vasiliy-bedarev-rozhd-1908-op4-d386-s60.png", "scans/anfisa-bedareva-rozhd-1910-op4-d386-s173.png", "scans/anfisa-bedareva-smert-1910-op4-d386-s207.png", "scans/vladimir-1911-dup-and-maria-logunova-op4-d386-s230.png"]}, {"id": "A-0062", "t": "Метрическая книга церкви с. Ур-Бедаревского 1900–1903, 1905–1906 (ф.60 оп.4 д.104) — дети Ивана Никитина и Анны Осиповой Бедаревых", "ref": "ф.60 оп.4 д.104 ск.3 (1900), 20, 43, 87 (1902), 89, 128", "d": "1900-07-27; 1900-12; 1902-01-24; 1902-11-04 (ст. ст.)", "url": "https://ya.ru/archive/catalog/a48bd695-c9a3-404a-bf45-ed30d19c7844/20", "imgs": ["scans/maria-bedareva-rozhd-1900-op4-d104-s20.png", "scans/anna-bedareva-rozhd-1902-op4-d104-s89.png", "scans/anna-bedareva-smert-1902-op4-d104-s128.png"]}, {"id": "A-0063", "t": "Метрическая книга церкви с. Урско-Бедаревского за 1894, 1897, 1904 гг. — Ольга 1897 (2-й экз.), Анна 1904", "ref": "ф.60 (книга ccd3ca76…; шифр описи/дела не выписан) ск.3 (1894), 34 (1897), 70 (1904), 50, 90, 111", "d": "1897-09-01; 1904-11-26; 1904-12-22 (ст. ст.)", "url": "https://ya.ru/archive/catalog/ccd3ca76-193d-421d-92e7-e93ea0690ce8/50", "imgs": ["scans/anna2-bedareva-rozhd-1904-ccd3-s90.png", "scans/anna2-bedareva-smert-1904-ccd3-s111.png"]}, {"id": "A-0100", "t": "Метрики Урско-Бедаревской ц. 1897–1912 — дети Ивана Никитина и Анны Осиповой (Иосифовой) Бедаревых", "ref": "ф.60 оп.1 д.657 ск.25,76,114; оп.6 д.1 ск.50,111; оп.4 д.104 ск.20,43,89,171; оп.5 д.31 ск.53,163,276; оп.4 д.386 ск.60,173,207,230; оп.6 д.44 ск.92,110", "d": "1897–1913", "url": "https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/114", "imgs": []}], "sibs": [{"n": "Александра", "d": "Александра Иосифова Пестерева, вышла замуж ок. 1899", "st": "one"}]}, {"id": "sergey1861", "g": 6, "x": 150, "n": "Сергей Иванович", "s": "Соколов · 1861–1917", "st": "one", "c": "sergey1887", "name": "Соколов Сергей Иванович", "years": "05.06.1861 – 1917", "body": "\n        <p>Родился близ деревни Пырятинки Карачевского уезда (приход Успенской церкви села Старого). Орловская Бахтина военная гимназия, Константиновское училище, офицер-артиллерист. Земский начальник, председатель Кромской уездной земской управы (1900–1906), статский советник, орден Св. Анны 3-й степени; имение 414 десятин при селе Апальково. В 1904 году уполномоченный санитарного отряда на Дальнем Востоке, с 1907-го в землеустройстве, в 1912–1917 годах в переселенческом управлении (Красноярск, Уральск). По семейной версии умер в 1917 году в Уральске от сыпного тифа. Брат — Тихон Иванович, род. 23.11.1863 (РРФ).<\/p>\n        <p class=\"src\">РГИА ф.1349 оп.2 д.343 лл.80–88 · РГИА ф.398 оп.71 д.26731 · ЦГА РК ф.29 оп.2 (всё по выпискам Вики)<\/p>\n        <p><b>Подтверждено независимым источником (30.10.2026).<\/b> В «Памятной книжке и адрес-календаре Орловской губернии на 1910 год» статский советник Сергей Иванович Соколов значится в Кромском уезде сразу в нескольких ролях: гласный уездного земского собрания от дворян, <b>непременный член уездной землеустроительной комиссии<\/b> (то самое «с 1907 года в землеустройстве» из формулярного списка), директор отделения тюремного комитета, член комитета Красного Креста и благотворительного общества. Жил в Кромах, в доме Виницкого. Уездным предводителем дворянства в 1910 году был тайный советник В. А. Шеншин, а в 1912–1917 годах Сергей Иванович уже служил в Сибири и Казахстане. Поэтому «предводитель дворянства» из семейного рассказа — скорее всего, путаница с должностью председателя уездной земской управы (1900–1906). Предводителем дворянства в семье действительно был его прадед Иван Николаевич, в Карачевском уезде в 1818–1827 годах.<\/p>\n        <p class=\"src\"><a href=\"https://istmat.org/files/uploads/57071/1910_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf\">Адрес-календарь Орловской губернии на 1910 год<\/a>, с. 203–212 (Кромской уезд) <span class=\"tag\">inputs/orel-calendars/<\/span><\/p>\n        <p><b>Служба по губернским справочникам (проверено 30.10.2026).<\/b> Сергей Иванович есть во всех просмотренных выпусках «Памятной книжки Орловской губернии»:<\/p>\n        <ul>\n          <li><b>1898<\/b> — надворный советник, <b>земский начальник 2-го участка Кромского уезда<\/b> (волости Колкская, Кировская, Сосковская, Верхне-Боевская, Коровье-Болотовская), квартира в селе Цвиленеве Кировской волости; казначей уездного отделения епархиального училищного совета.<\/li>\n          <li><b>1902 и 1906<\/b> — коллежский советник, <b>председатель Кромской уездной земской управы<\/b>, гласный, почётный мировой судья (1906), член совета благотворительного общества. Так это подтверждено независимо от формулярного списка («председатель управы 1900–1906»).<\/li>\n          <li><b>1910<\/b> — председателем управы уже стал Д. В. Трубицын, Сергей Иванович — статский советник, гласный и член землеустроительной комиссии.<\/li>\n          <li><b>1913 и 1915<\/b> — по-прежнему значится гласным от дворян; в 1913 — ещё и директор отделения тюремного комитета. В 1915 году это, скорее всего, устаревшие сведения: по формулярному списку он с 1912 года служил в Красноярске и Уральске.<\/li>\n        <\/ul>\n        <p>Уездными предводителями дворянства в эти годы были генерал-майор А. А. Лишин (1902, 1906) и В. А. Шеншин (1910, 1913). Так что семейное «был предводителем» — это, вероятнее всего, его должность председателя земской управы, второй по значению в уезде.<\/p>\n        <p class=\"src\">Памятные книжки Орловской губ. на <a href=\"https://istmat.org/files/uploads/57071/1898_pamyatnaya_kniga_orlovskoy_gubernii.pdf\">1898<\/a> (с. 180–181), <a href=\"https://istmat.org/files/uploads/57071/1902_pamyatnaya_kniga_orlovskoy_gubernii.pdf\">1902<\/a> (с. 187–190), <a href=\"https://istmat.org/files/uploads/57071/1906_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf\">1906<\/a> (с. 171–176), <a href=\"https://istmat.org/files/uploads/57071/1913_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf\">1913<\/a>, <a href=\"https://istmat.org/files/uploads/57071/1915_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf\">1915<\/a> (с. 274–275) <span class=\"tag\">inputs/orel-calendars/<\/span><\/p>\n      ", "docs": [{"id": "A-0012", "t": "Досье Вики: «7 Соколов Сергей Иванович 1861-1917.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0050", "t": "Памятная книжка и адрес-календарь Орловской губернии на 1910 год — Кромской уезд (с. 203–213)", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1910", "d": "1910", "url": "https://istmat.org/files/uploads/57071/1910_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf (PDF-с. 283–293)", "imgs": []}, {"id": "A-0051", "t": "Памятная книжка (и адрес-календарь) Орловской губернии на 1898 год — Кромской уезд", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1898", "d": "1898", "url": "https://istmat.org/files/uploads/57071/1898_pamyatnaya_kniga_orlovskoy_gubernii.pdf (PDF-с. 199–200 (с. 180–181))", "imgs": []}, {"id": "A-0052", "t": "Памятная книжка (и адрес-календарь) Орловской губернии на 1902 год — Кромской уезд", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1902", "d": "1902", "url": "https://istmat.org/files/uploads/57071/1902_pamyatnaya_kniga_orlovskoy_gubernii.pdf (PDF-с. 206–209 (с. 187–190))", "imgs": []}, {"id": "A-0053", "t": "Памятная книжка (и адрес-календарь) Орловской губернии на 1906 год — Кромской уезд", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1906", "d": "1906", "url": "https://istmat.org/files/uploads/57071/1906_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf (PDF-с. 179–183 (с. 171–176))", "imgs": []}, {"id": "A-0054", "t": "Памятная книжка (и адрес-календарь) Орловской губернии на 1913 год — Кромской уезд", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1913", "d": "1913", "url": "https://istmat.org/files/uploads/57071/1913_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf (PDF-с. 148–149)", "imgs": []}, {"id": "A-0055", "t": "Памятная книжка (и адрес-календарь) Орловской губернии на 1915 год — Кромской уезд", "ref": "Изд. Орловского губ. стат. комитета, Орёл 1915", "d": "1915", "url": "https://istmat.org/files/uploads/57071/1915_pamyatnaya_kniga_i_adres-kalendar_orlovskoy_gubernii.pdf (PDF-с. 334–335 (с. 274–275))", "imgs": []}, {"id": "A-0059", "t": "РРФ (rgfond.ru), биограф С.В. Черепанов: роспись /rod/340740 и карточка Тихона Ивановича Соколова", "ref": "Русский родословный фонд", "d": "", "url": "https://rgfond.ru/rod/340740", "imgs": []}, {"id": "A-0106", "t": "Копия справки Орловской консистории 30.01.1896 о рождении Сергея Сергеевича Соколова (Апальково, 29.12.1887)", "ref": "ф.2122 оп.3 д.218 ск.74 (копия МК Николаевской ц. с. Апальково 1888 ч.1 №3)", "d": "29.12.1887 / 11.01.1888", "url": "https://ya.ru/archive/catalog/94f03d92-b420-4fcb-b332-daccd1129682/74", "imgs": []}], "sibs": [{"n": "Тихон · 1863", "d": "Тихон Иванович Соколов, род. 23.11.1863 (РРФ)", "st": "one"}]}, {"id": "ekaterina", "g": 6, "x": 332, "n": "Екатерина Ивановна", "s": "Бацова · ок. 1862", "st": "one", "c": "sergey1887", "name": "Соколова (Бацова) Екатерина Ивановна", "years": "ок. 1862 – ?", "body": "<p>Выпускница Женского патриотического института (1879). Венчалась 15.01.1886 в церкви Орловского Бахтина кадетского корпуса как «дочь умершего поручика Ивана Григорьевича Дорогой-Бацево». Сёстры — Лидия Всеволожская и Евгения Краснянская (умерла в 1954 году в Ницце); братья — Владимир (полковник) и Александр.<\/p><p class=\"src\">Метрика Михаилоархангельской церкви при Бахтина корпусе, 1886 (по выписке Вики)<\/p>", "docs": [{"id": "A-0012", "t": "Досье Вики: «7 Соколов Сергей Иванович 1861-1917.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0015", "t": "Досье Вики: «И Д Бацов.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0106", "t": "Копия справки Орловской консистории 30.01.1896 о рождении Сергея Сергеевича Соколова (Апальково, 29.12.1887)", "ref": "ф.2122 оп.3 д.218 ск.74 (копия МК Николаевской ц. с. Апальково 1888 ч.1 №3)", "d": "29.12.1887 / 11.01.1888", "url": "https://ya.ru/archive/catalog/94f03d92-b420-4fcb-b332-daccd1129682/74", "imgs": []}, {"id": "A-0111", "t": "Википедия: Бацов, Владимир Иванович (раздел литературы)", "ref": "РГВИА ф.409 оп.1 «п/с 259 (1912 г.)»; ф.400 оп.9 д.34943 л.4об.; ф.400 оп.12 д.26977 л.57–59 (1914)", "d": "1912–1914", "url": "https://ru.wikipedia.org/wiki/Бацов,_Владимир_Иванович", "imgs": []}], "sibs": [{"n": "Лидия Всеволожская", "d": "Сестра Екатерины Ивановны (по досье Вики)", "st": "one"}, {"n": "Евгения Краснянская", "d": "Сестра; умерла в 1954 году в Ницце (по досье Вики)", "st": "one"}, {"n": "Владимир · полковник", "d": "Брат Владимир Иванович Бацов, полковник (по досье Вики)", "st": "one"}, {"n": "Александр", "d": "Брат Александр (по досье Вики)", "st": "one"}]}, {"id": "nikita", "g": 6, "x": 1110, "n": "Никита Ананьев", "s": "Бедарев · ок. 1852", "st": "doc", "c": "ivanbed", "name": "Бедарев Никита Ананьев", "years": "ок. 1852 – после 1898", "body": "<p>Дед Серафима, прапрапрадед Михаила. Крестьянин села Урско-Бедаревского (в записях 1870-х — «село Бедарево»). <b>22 января 1873 года<\/b>, в 21 год, первым браком венчался с крестьянской дочерью того же села Параскевой Петровой. Старший сын Иван родился в мае 1874-го. Последние известные записи о нём — 1890-е: смерть сына Якова, Никита — восприемник на крестинах.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270\">брак: ГА Кузбасса ф.60 оп.1 д.108, скан 270<\/a> · <a href=\"https://ya.ru/archive/catalog/b6b92d4b-4047-4a45-8078-275c6a317d78/42\">рождение сына Ивана: д.73, скан 42<\/a><\/p>", "docs": [{"id": "A-0041", "t": "Метрическая книга Урско-Бедаревской церкви 1871–1875, ч.1 о родившихся (1874), №19 муж.", "ref": "ф.60 оп.1 д.73 скан 42 (л.37 об.)", "d": "1875, май (день неуверенно: 19/14 по столбцам)", "url": "https://ya.ru/archive/catalog/b6b92d4b-4047-4a45-8078-275c6a317d78/42", "imgs": ["scans/ivan-bedarev-rozhd-1875-d73-s42.png"]}, {"id": "A-0042", "t": "Метрическая книга Ур-Бедаревской и Караканской церквей 1872–1875, ч.2 о бракосочетавшихся, №3 от 22 января (1873)", "ref": "ф.60 оп.1 д.108 скан 270", "d": "22 января, 1873 (по положению в деле после рождений 1874)", "url": "https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270", "imgs": ["scans/nikita-bedarev-brak-1874-d108-s270.png", "scans/paraskeva-mansonova-1874-d108-s270-zoom.png"]}, {"id": "A-0101", "t": "Метрики Урско-Бедаревской ц.: брак Никиты Ананьева 1873 и рождение Наталии 1881/82 (крёстная Надежда Гри[горьева])", "ref": "ф.60 оп.1 д.108 ск.270 (№3, 22.01.1873); оп.5 д.1 ск.247 (№28 ж.), ск.7", "d": "1861–1882", "url": "https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270", "imgs": []}], "sibs": [{"n": "Алексей Ананьев", "d": "Брат Никиты: крёстный Ивана 1874, поручитель на свадьбе Ивана 1896", "st": "one"}, {"n": "Анна Ананьева", "d": "Сестра Никиты: крёстная Ивана 1874, вышла замуж в 1884–85", "st": "one"}]}, {"id": "paraskeva", "g": 6, "x": 1290, "n": "Параскева Петровна", "s": "Максонова · ок. 1853", "st": "one", "c": "ivanbed", "name": "Бедарева (Максонова) Параскева Петровна", "years": "ок. 1853 – ?", "body": "<p>Мать Ивана Никитина, прапрапрабабушка Михаила. В записи о браке: «крестьянская дочь, девица Параскева Петрова», 20 лет, из того же села. Фамилия на скане перенесена со строки на строку; при сверке 02.11 она читается как <b>«Ма[к]сонова»<\/b>, и в той же книге 1860-х живут Максоновы (Матвей Исаков, Алексей Фёдоров). Поручитель со стороны невесты — Фёдор Васильев Максонов, вероятно её родственник. В метрике сына 1874 года — «Парасковья Петрова».<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270\">ГА Кузбасса ф.60 оп.1 д.108, скан 270<\/a><\/p>", "docs": [{"id": "A-0041", "t": "Метрическая книга Урско-Бедаревской церкви 1871–1875, ч.1 о родившихся (1874), №19 муж.", "ref": "ф.60 оп.1 д.73 скан 42 (л.37 об.)", "d": "1875, май (день неуверенно: 19/14 по столбцам)", "url": "https://ya.ru/archive/catalog/b6b92d4b-4047-4a45-8078-275c6a317d78/42", "imgs": ["scans/ivan-bedarev-rozhd-1875-d73-s42.png"]}, {"id": "A-0042", "t": "Метрическая книга Ур-Бедаревской и Караканской церквей 1872–1875, ч.2 о бракосочетавшихся, №3 от 22 января (1873)", "ref": "ф.60 оп.1 д.108 скан 270", "d": "22 января, 1873 (по положению в деле после рождений 1874)", "url": "https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270", "imgs": ["scans/nikita-bedarev-brak-1874-d108-s270.png", "scans/paraskeva-mansonova-1874-d108-s270-zoom.png"]}, {"id": "A-0101", "t": "Метрики Урско-Бедаревской ц.: брак Никиты Ананьева 1873 и рождение Наталии 1881/82 (крёстная Надежда Гри[горьева])", "ref": "ф.60 оп.1 д.108 ск.270 (№3, 22.01.1873); оп.5 д.1 ск.247 (№28 ж.), ск.7", "d": "1861–1882", "url": "https://ya.ru/archive/catalog/e42a102d-489c-4576-895f-ff655205ec3f/270", "imgs": []}], "sibs": []}, {"id": "pesterevy", "g": 6, "x": 1602, "n": "Иосиф и Екатерина", "s": "Пестеревы · 1876", "st": "doc", "c": "annabed", "name": "Пестерев Иосиф Ильич и Екатерина Ивановна (Шапошникова)", "years": "поженились 16.01.1876", "body": "<p>Родители Анны, прапрапрадед и прапрапрабабушка Михаила. 16 января 1876 года в Салаирской церкви венчались крестьянин деревни Пестеревой Касьминской волости Иосиф Ильин Пестерев, 18 лет, первым браком, и девица Екатерина Иванова, 22 лет, дочь крестьянина деревни Сапоговой Ивана Максимова Шапошникова. Поручители со стороны невесты — Никита Максимов Шапошников (вероятно, её дядя) и Прокопий Васильев Сапогов. Анна, по-видимому, их первый ребёнок; по метрикам у неё была и сестра Александра (вышла замуж ок. 1899).<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/6faad918-5019-4fd0-bbb0-fadc430fa8ea/43\">ГА Кузбасса ф.60 оп.1 д.559, скан 43<\/a> <span class=\"tag\">inputs/yandex-archive/<\/span><\/p>", "docs": [{"id": "A-0038", "t": "Метрическая книга Салаирской церкви 1876, ч.1 о родившихся, №45 (жен.)", "ref": "ф.60 оп.1 д.559 скан 41", "d": "1876-12-11 (рожд.), 1876-12-21 (крещ.), ст. ст.", "url": "https://ya.ru/archive/catalog/6faad918-5019-4fd0-bbb0-fadc430fa8ea/41", "imgs": ["scans/anna-pestereva-rozhd-1876-d559-s41.png"]}, {"id": "A-0039", "t": "Метрическая книга Салаирской церкви 1876, ч.2 о бракосочетавшихся, №2 от 16 января", "ref": "ф.60 оп.1 д.559 скан 43", "d": "1876-01-16 (ст. ст.)", "url": "https://ya.ru/archive/catalog/6faad918-5019-4fd0-bbb0-fadc430fa8ea/43", "imgs": ["scans/iosif-pesterev-brak-1876-d559-s43.png"]}, {"id": "A-0048", "t": "Метрическая книга Мало-Салаирской церкви 1858–1867 (ф.60 оп.1 д.555), OCR-перебор", "ref": "ф.60 оп.1 д.555", "d": "1857–1867", "url": "https://ya.ru/archive/catalog/2af33095… (ID в браузере) ск.78", "imgs": []}], "sibs": [{"n": "Захар Шапошников?", "d": "Захар Иванов Шапошников — крёстный Анны 1876, по-видимому брат Екатерины Ивановны", "st": "hyp"}]}, {"id": "ananiy", "g": 7, "x": 1110, "n": "Ананий Иванов", "s": "Бедарев", "st": "one", "c": "nikita", "name": "Бедарев Ананий Иванович", "years": "? – после 1898", "body": "<p>Вероятный отец Никиты Ананьева, то есть прапрапрапрадед Михаила. В книгах 1860–90-х в селе Урско-Бедаревском один Ананий — Ананий Иванов Бедарев: жена Надежда Григорьева (1861), дочь девица Анна Ананьева вышла замуж в 1884–85 годах в 24 года. Та же Анна Ананьева — крёстная Ивана в 1874-м. Метрики 1850-х, где могло быть рождение Никиты, в «Яндекс Архиве» не найдены.<\/p><p><b>02.11.2026.<\/b> Версия усилилась: у Никиты в 1881/82 году родилась дочь Наталия, и её крёстная — крестьянская жена «Надежда Гри[горьева]», то есть, по-видимому, жена Анания (фамилия ушла в переплёт). Других Ананиев Бедаревых в книгах 1861–1890-х нет. Поручитель жениха на свадьбе Никиты в 1873 году — Алексей Иванов Бедарев, вероятно брат Анания. Прямой записи о рождении Никиты нет; ревизская сказка 1858 года может быть только в Томском архиве.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/01bc0367-b9e8-41e9-a143-5f333d189fdb/247\">рождение Наталии: ГА Кузбасса ф.60 оп.5 д.1, скан 247<\/a><\/p><p class=\"src\">ГА Кузбасса ф.60 оп.5 д.1, скан 7; ф.60 оп.1 д.605, скан 62 (распознанный текст)<\/p>", "docs": [], "sibs": []}, {"id": "ivand", "g": 7, "x": 229, "n": "Иван Дмитриевич", "s": "Соколов · 1829/30–1870/71", "st": "one", "c": "sergey1861", "name": "Соколов Иван Дмитриевич", "years": "ок. 1830 – 1871", "body": "<p>Гвардии подпоручик, затем поручик, сын приходского помещика Дмитрия Ивановича Соколова. Венчался 16.01.1853 в Успенской церкви села Старого Карачевского уезда. Этот уезд сейчас в Брянской области, поэтому документы ветви искать в Брянском и Орловском архивах.<\/p><p><b>02.11.2026.<\/b> В «Сенатских объявлениях» 1857 года: «Соколов Иван Дмитриев, капитан… по деревне Пырятинке крестьян сто пятнадцать душ» (свидетельство от 15.11.1856). В 1835 году та же Пырятинка (103 души) записана за поручиком Дмитрием Ивановичем — имение перешло от отца к сыну. Метрики Успенской церкви с. Старого хранятся в Брянском архиве: ГАБО ф.247 оп.1, д.114 — 1826–1836 годы (здесь должно быть рождение Ивана в 1829-м). Смотреть — только в электронном читальном зале ГАБО (нужна регистрация).<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/37ca1e70-f45b-489c-9b93-7c7d4a0c47eb/2\">Сенатские объявления 1857, № 5, с. 2<\/a> (распознанный текст)<\/p><p class=\"src\">Метрики Успенской церкви с. Старого, 1853 и 1861 (по выписке Вики)<\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0059", "t": "РРФ (rgfond.ru), биограф С.В. Черепанов: роспись /rod/340740 и карточка Тихона Ивановича Соколова", "ref": "Русский родословный фонд", "d": "", "url": "https://rgfond.ru/rod/340740", "imgs": []}, {"id": "A-0096", "t": "Окладные ведомости о помещичьих крестьянах 1858, Карачевский у. — Соколовы (НСА ГАОО)", "ref": "ГАОО ф.760 оп.1 д.237 л.52 об., 54 об.", "d": "1858", "url": "https://nsa.gaorel.ru/landowners/pages/gubernia/1/uezd/5/land/1173/index.html", "imgs": []}, {"id": "A-0099", "t": "Каталог ГАОО: дела о помещиках Соколовых Карачевского у. и Дорогой-Бацевой", "ref": "ф.672 оп.1 д.1991 (1845); ф.580 оп.1 д.965 (1854), д.625 (1848); ф.4 оп.1 д.7796 (1904–05, Обельна); ф.6 оп.1 д.1897 (1794–1803); ф.760 оп.1 д.344 л.47об (1858, Дорогая Бацева В.Н.)", "d": "1780–1905", "url": "https://catalog.gaorel.ru/object/1877484254", "imgs": []}, {"id": "A-0104", "t": "Сенатские объявления о запрещениях на имения 1835 и 1857 — Соколовы Карачевского у. (Старое, Обельна, Суханка, Пырятинка)", "ref": "1835 №29 с.9; №33 с.31; №48 с.92; 1857 №5 с.2", "d": "1835; 15.11.1856", "url": "https://ya.ru/archive/catalog/e979bb5b-8b2d-4005-ae1b-3767bb0c11b3/9", "imgs": []}], "sibs": [{"n": "Пелагея †1886", "d": "Пелагея Дмитриевна, умерла 10.11.1886 (РРФ)", "st": "one"}, {"n": "Митрофан · 1841–97", "d": "Митрофан Дмитриевич (1841–1897), дворянин-избиратель Карачевского у. (РРФ, ВГД)", "st": "one"}]}, {"id": "evdokiya", "g": 7, "x": 411, "n": "Евдокия Антоновна", "s": "Степанова · 1835", "st": "one", "c": "sergey1861", "name": "Соколова (Степанова) Евдокия Антоновна", "years": "ок. 1835 – ?", "body": "<p>В 1853 году названа «воспитанницей» губернского секретаря Антона Степанова Степанова из села Щеблыкина. «Воспитанница» обычно означает приёмную, а не родную дочь, так что её происхождение — открытый вопрос. В 1887 году вдова, крёстная внучки Марии.<\/p><p class=\"src\">Метрики 1853 и 1887 (по выписке Вики)<\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0059", "t": "РРФ (rgfond.ru), биограф С.В. Черепанов: роспись /rod/340740 и карточка Тихона Ивановича Соколова", "ref": "Русский родословный фонд", "d": "", "url": "https://rgfond.ru/rod/340740", "imgs": []}], "sibs": []}, {"id": "ivanbatsov", "g": 7, "x": 600, "n": "Иван Бацов", "s": "Дорогой-Бацев · болгарин", "st": "hyp", "c": "ekaterina", "name": "Бацов (Дорогой-Бацев) Иван", "years": "ок. 1830 – 1885?", "body": "\n        <p>По досье Вики — болгарин из Калофера, сподвижник Г. Раковского по «Тайному обществу» 1853 года. В Крымскую войну унтер-офицер болгарской роты Азовского пехотного полка, позже служил при Михайловском Воронежском кадетском корпусе. В 1872–1873 годах в его доме служила учительницей Е. К. Брешко-Брешковская.<\/p>\n        <p class=\"flag\">Отчество в источниках разное: «Драгоевич» в досье, «Григорьевич» в метрике 1886 года. То, что поручик И. Г. Дорогой-Бацев и болгарин Иван Бацов — одно лицо, нужно подтвердить формулярным списком или дворянским делом.<\/p>\n        <p class=\"src\">РГВИА ф.9196 оп.243 св.27 д.120 лл.24–32 «О болгарине Бацове», 1854 (по досье)<\/p>\n        <p><b>02.11.2026.<\/b> У сына, полковника Владимира Ивановича Бацова (род. 01.10.1865), в литературе указаны: послужной список — РГВИА ф.409 оп.1, «п/с 259» (1912); наградные материалы — ф.400 оп.9 д.34943 л.4 об. и оп.12 д.26977 лл.57–59 (1914). В послужном списке могут быть указаны отец и место рождения, и это проверит версию «Иван Бацов из Калофера = поручик И. Г. Дорогой-Бацев». Сами дела не прочитаны. Акт смерти Евгении Краснянской (Ницца, 31.01.1954) хранится в Service État Civil Ниццы; онлайн его нет (архивный каталог доведён до 1925 года).<\/p>\n        <p class=\"src\"><a href=\"https://ru.wikipedia.org/wiki/Бацов,_Владимир_Иванович\">Википедия: Бацов В. И. (литература)<\/a> · <a href=\"https://ru.wikisource.org/wiki/ВЭ/ВТ/Бацов,_Владимир_Иванович\">Военная энциклопедия, т.4, 1911<\/a><\/p>\n      ", "docs": [{"id": "A-0015", "t": "Досье Вики: «И Д Бацов.docx»", "ref": "", "d": "", "url": "", "imgs": []}, {"id": "A-0111", "t": "Википедия: Бацов, Владимир Иванович (раздел литературы)", "ref": "РГВИА ф.409 оп.1 «п/с 259 (1912 г.)»; ф.400 оп.9 д.34943 л.4об.; ф.400 оп.12 д.26977 л.57–59 (1914)", "d": "1912–1914", "url": "https://ru.wikipedia.org/wiki/Бацов,_Владимир_Иванович", "imgs": []}], "sibs": []}, {"id": "dmitriy", "g": 8, "x": 229, "n": "Дмитрий Иванович", "s": "Соколов · ок. 1802–1888", "st": "one", "c": "ivand", "name": "Соколов Дмитрий Иванович", "years": "ок. 1802 – ок. 1888", "body": "<p>«Приходский помещик», отец Ивана Дмитриевича. В Российском родословном фонде (РРФ) записан так: родился около 1802 года, умер около 1888-го. Жена — Анна Федоровна Апухтина. Дети: Иван (1829–1870), Пелагея (умерла 10.11.1886), Митрофан (1841–1897). Митрофан Дмитриевич значится в списке дворян Карачевского уезда, имевших право голоса на выборах.<\/p><p><b>02.11.2026.<\/b> В 1835 году, по «Сенатским объявлениям», за поручиком Дмитрием Ивановым Соколовым числились село Старое (112 душ), деревни Обельна (119) и Суханка (60), а отдельно — Пырятинка (103 души). Прямой документ о сыне: в 1880 году, при венчании Митрофана в Москве, Успенская церковь Карачевского уезда выдала справку, что «Митрофан Дмитриевич Соколов, 39 лет» родился «от отставного поручика Димитрия Ивановича и законной жены его (ныне умершей) Соколовых». Митрофан тогда — член Орловского окружного суда, невеста — Зинаида Дмитриевна Макарова.<\/p><p class=\"src\"><a href=\"https://ya.ru/archive/catalog/e979bb5b-8b2d-4005-ae1b-3767bb0c11b3/9\">Сенатские объявления 1835, № 29, с. 9<\/a> · <a href=\"https://ya.ru/archive/catalog/8187ec96-e940-417d-9cab-eddbe2e692ca/31\">№ 33, с. 31<\/a> · <a href=\"https://ya.ru/archive/catalog/0a0ea694-0843-4b3b-95ba-2e707f68793d/34\">ЦГА Москвы ф.2125 оп.3 д.224, скан 34<\/a><\/p><p class=\"src\">Метрика о браке, 1853 (по выписке Вики); <a href=\"https://www.rgfond.ru/person/340740\">РРФ — Дмитрий Иванович<\/a>; <a href=\"https://baza.vgd.ru/1/30975/all.htm\">ВГД — список дворян Карачевского у.<\/a><\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0059", "t": "РРФ (rgfond.ru), биограф С.В. Черепанов: роспись /rod/340740 и карточка Тихона Ивановича Соколова", "ref": "Русский родословный фонд", "d": "", "url": "https://rgfond.ru/rod/340740", "imgs": []}, {"id": "A-0096", "t": "Окладные ведомости о помещичьих крестьянах 1858, Карачевский у. — Соколовы (НСА ГАОО)", "ref": "ГАОО ф.760 оп.1 д.237 л.52 об., 54 об.", "d": "1858", "url": "https://nsa.gaorel.ru/landowners/pages/gubernia/1/uezd/5/land/1173/index.html", "imgs": []}, {"id": "A-0099", "t": "Каталог ГАОО: дела о помещиках Соколовых Карачевского у. и Дорогой-Бацевой", "ref": "ф.672 оп.1 д.1991 (1845); ф.580 оп.1 д.965 (1854), д.625 (1848); ф.4 оп.1 д.7796 (1904–05, Обельна); ф.6 оп.1 д.1897 (1794–1803); ф.760 оп.1 д.344 л.47об (1858, Дорогая Бацева В.Н.)", "d": "1780–1905", "url": "https://catalog.gaorel.ru/object/1877484254", "imgs": []}, {"id": "A-0104", "t": "Сенатские объявления о запрещениях на имения 1835 и 1857 — Соколовы Карачевского у. (Старое, Обельна, Суханка, Пырятинка)", "ref": "1835 №29 с.9; №33 с.31; №48 с.92; 1857 №5 с.2", "d": "1835; 15.11.1856", "url": "https://ya.ru/archive/catalog/e979bb5b-8b2d-4005-ae1b-3767bb0c11b3/9", "imgs": []}, {"id": "A-0105", "t": "Брачные документы Митрофана Дмитриевича Соколова, Москва 1880 (справка Успенской ц. Карачевского у.)", "ref": "ф.2125 оп.3 д.224 ск.34; д.225 ск.18; ф.203 оп.776 д.959 ск.194", "d": "24.09.1880", "url": "https://ya.ru/archive/catalog/0a0ea694-0843-4b3b-95ba-2e707f68793d/34", "imgs": []}], "sibs": [{"n": "Иван · 1795", "d": "Иван Иванович Соколов, род. 1795 (РРФ)", "st": "one"}, {"n": "ещё 6 детей", "d": "Всего у Ивана Николаевича восемь детей; имена остальных не установлены", "st": "one"}]}, {"id": "apukhtina", "g": 8, "x": 411, "n": "Анна Федоровна", "s": "Апухтина", "st": "one", "c": "ivand", "name": "Соколова (Апухтина) Анна Федоровна", "years": "1800-е", "body": "<p>Жена Дмитрия Ивановича, мать Ивана Дмитриевича. Известна только по РРФ.<\/p><p class=\"src\"><a href=\"https://www.rgfond.ru/person/340740\">РРФ<\/a><\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}], "sibs": []}, {"id": "ivann", "g": 9, "x": 229, "n": "Иван Николаевич", "s": "Соколов · поручик", "st": "one", "c": "dmitriy", "name": "Соколов Иван Николаевич", "years": "2-я пол. XVIII в. – ?", "body": "<p>Отец Дмитрия Ивановича. В 1789 году окончил Артиллерийский и инженерный шляхетский кадетский корпус, выпущен штык-юнкером во 2-й канонирский полк, позже поручик артиллерии. В 1818–1827 годах — <b>карачевский уездный предводитель дворянства<\/b>. С 1823 года член, затем директор Орловского попечительного о тюрьмах комитета. Жена — Александра Андреевна Глазунова. Восемь детей, среди них Иван Иванович (1795) и Дмитрий (ок. 1802). Род внесён в 3-ю часть дворянской родословной книги Орловской губернии в 1811 и 1834 годах «по заслугам отца». Владения — в Карачевском уезде и в деревне Вышней Костеевке Кромской округи, приход села Рождественского (Дурневка).<\/p><p class=\"flag\">Источник — одна генеалогическая база (биограф С. В. Черепанов). Она ссылается на дело РГИА ф.1343 оп.29 д.5125 (1854) и адрес-календарь 1818 года. Сами документы мы ещё не видели.<\/p><p class=\"src\"><a href=\"https://www.rgfond.ru/person/19818\">РРФ — Иван Николаевич Соколов<\/a><\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}, {"id": "A-0059", "t": "РРФ (rgfond.ru), биограф С.В. Черепанов: роспись /rod/340740 и карточка Тихона Ивановича Соколова", "ref": "Русский родословный фонд", "d": "", "url": "https://rgfond.ru/rod/340740", "imgs": []}], "sibs": [{"n": "Василий Николаевич", "d": "Брат Ивана Николаевича (РРФ)", "st": "one"}]}, {"id": "glazunova", "g": 9, "x": 411, "n": "Александра Андреевна", "s": "Глазунова", "st": "one", "c": "dmitriy", "name": "Соколова (Глазунова) Александра Андреевна", "years": "2-я пол. XVIII в.", "body": "<p>Жена Ивана Николаевича Соколова, мать Дмитрия Ивановича.<\/p><p class=\"src\"><a href=\"https://www.rgfond.ru/person/19818\">РРФ<\/a><\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}], "sibs": []}, {"id": "nikolayo", "g": 10, "x": 229, "n": "Николай Осипович", "s": "Соколов · XVIII в.", "st": "one", "c": "ivann", "name": "Соколов Николай Осипович", "years": "2-я четверть XVIII в.", "body": "<p>Отец Ивана Николаевича и Василия Николаевича. Самый ранний известный предок по линии Соколовых: десятое поколение, если считать тебя первым. Цепочка до тебя проходит через Сергея Сергеевича 1911 года рождения, а его связь с Викой пока гипотеза. Дворянство роду дали заслуги Николая Осиповича: его сын Иван внесён в родословную книгу «по заслугам отца». Отчество показывает, что отца Николая звали Осип (Иосиф); он жил примерно в начале XVIII века.<\/p><p class=\"src\"><a href=\"https://www.rgfond.ru/person/19818\">РРФ<\/a><\/p>", "docs": [{"id": "A-0044", "t": "Российский родословный фонд (РРФ): Соколовы — Иван Николаевич, Дмитрий Иванович, Иван Дмитриевич, Сергей Иванович, Сергей Сергеевич", "ref": "ссылки: РГИА ф.1343 оп.29 д.5125 (1854); АК 1818 ч.2 с.182; Азбука формулярных списков Орловской губ. 1848", "d": "XVIII–XX вв.", "url": "https://www.rgfond.ru/person/19818", "imgs": []}], "sibs": []}, {"id": "dragoya", "g": 8, "x": 600, "n": "Драгоя и Екатерина", "s": "Бацовы · Калофер", "st": "hyp", "c": "ivanbatsov", "name": "Бацов Драгоя Иванович · Стоянова Екатерина Петрова", "years": "1802–1878 · 1805–1878", "body": "<p>Родители Ивана Бацова по досье Вики. Оба родились в Калофере, умерли в Карлове (Болгария); Драгоя упомянут как чорбаджия Карлова в 1869 году. Первоисточник в досье не указан.<\/p>", "docs": [], "sibs": []}], "gaps": "\n    \n    <ul>\n      <li>Дед Сергей Николаевич Выдрин (жив): его родители и откуда род Выдриных — спросить у него или у папы. Главное — древо тёти Светы («Выдрины с XVI века»): что за документы (писцовые книги, ревизии, архив)?<\/li>\n      <li>Связь Вики с С. С. Соколовым 1911 года: её свидетельство о рождении.<\/li>\n      <li>Баба Ася (Розина А. М.): Розина — девичья фамилия? Её родители (отец Маркел), когда умерла.<\/li>\n      <li>Дед Николай Яковлевич: даты рождения и смерти, где похоронен, где работал до 1995 года.<\/li>\n      <li>4-й полк ВНОС: где стоял в 1943–1944 (фронт или армия ПВО) — «Перечень № 11» или запрос в ЦАМО.<\/li>\n      <li>Немецкая прабабушка Лидия Робертовна, жена Якова: год рождения, имя матери, когда выслали из Выгоды. Ключ — свидетельство о рождении Николая Яковлевича.<\/li>\n      <li>Ольга Васильевна (жена Серафима): точное написание фамилии (Елескина?), её родители, год рождения. Нет её в рождениях Бачатской церкви за 1909 год (просмотрены сканы) и в книге за 1910–1911 годы (распознанный текст). Нет её и в книге за 1912–1914 годы (тоже распознанный текст). Наводка: в Больше-Бачатском улусе («Улус» в записи бабушки) жила семья инородца Василия Васильевича Елескина и Анны Ивановны. Их дочь Аполлинария родилась в 1898 году, а в 1912–1914-м она крёстная, «девица Больше-Улусская». Это может быть сестра Ольги, но Василиев Елескиных в улусе несколько. Нужно у бабушки: точная дата рождения Ольги, имя её матери, имена сестёр. <b>02.11:<\/b> вероятный отец — Василий Димитриев Елескин (†1917), тогда Ольга ≈1913–14; её рождение может быть только в книгах Челухоевской церкви 1913–1914, а их онлайн нет (Томский архив).<\/li>\n      <li>Иван Никитич Бедарев под фамилией Бородин(?) в Камне-на-Оби: когда и почему; искать в базах репрессированных и в архиве Алтайского края.<\/li>\n      <li>Лидия Робертовна Фраер(?): <b>02.11, вероятная семья<\/b> — Роберт Вильгельмович Фрайер и Каролина Фридриховна (Энгель), из Выгоды в Норменгу (воспоминания сестры Анны, 1920 г. р.). Подтвердить: запись о браке Якова (около 1936–37) или о рождении Николая 14.04.1938 в архангельском ЗАГСе (возраст и место рождения матери); учётное дело семьи спецпоселенцев Фрайер (ИЦ УМВД Архангельской обл.). Вопрос маме и бабушке: называли ли тётю Анну (Бугуруслан) и год рождения Лидии.<\/li>\n      <li>Бедаревы и Пестеревы глубже: рождение Никиты Ананьева (ок. 1852) и Иосифа Пестерева (ок. 1857) — метрик 1850-х годов в «Яндекс Архиве» нет; родители Параскевы Петровны Максоновой (не Мансоновой).<\/li>\n      <li>Дворянские дела Соколовых и Дорогой-Бацевых: Орловский и Брянский архивы. Рождение Ивана Дмитриевича (1829) — ГАБО ф.247 оп.1 д.114 (1826–1836), электронный читальный зал ГАБО.<\/li>\n      <li>Выдрины: книги Песчанской церкви (Качиры) онлайн есть только за 1869–1889 годы — все записи Выдриных выписаны (02.11), семьи восстановлены. Николаев 1885–1917 года рождения там нет. Чтобы выбрать ветку, нужно отчество и год рождения Николая Выдрина.<\/li>\n    <\/ul>\n  ", "sources": "\n    \n    <p class=\"lede\">Всё, из чего взяты сведения, включая пустые и закрытые маршруты, чтобы поиск можно было повторить. Рабочие файлы лежат в папке <code>~/kinship-cases/sokolov/<\/code>: реестры людей, документов, утверждений и связей, журнал поиска, сканы.<\/p>\n\n    <section>\n      <h3>Найдено 02.11.2026<\/h3>\n      <ul>\n        <li>Соколовы: <a href=\"https://ya.ru/archive/catalog/e979bb5b-8b2d-4005-ae1b-3767bb0c11b3/9\">Сенатские объявления 1835 (Д. И.)<\/a>, <a href=\"https://ya.ru/archive/catalog/37ca1e70-f45b-489c-9b93-7c7d4a0c47eb/2\">1857 (И. Д., Пырятинка)<\/a>; <a href=\"https://ya.ru/archive/catalog/0a0ea694-0843-4b3b-95ba-2e707f68793d/34\">ЦГА Москвы ф.2125 оп.3 д.224 ск.34 — справка о Митрофане 1880<\/a>; <a href=\"https://ya.ru/archive/catalog/94f03d92-b420-4fcb-b332-daccd1129682/74\">ф.2122 оп.3 д.218 ск.74 — копия рождения С. С. 1887<\/a>; <a href=\"https://ya.ru/archive/catalog/5ccd31f0-8538-4d53-9359-33a52721dec0/291\">ф.203 оп.782 д.179 ск.291 — брак С. С. 1910<\/a>; <a href=\"https://el.archive-bryansk.ru/archives/gabo/inventories/417835164\">ГАБО ф.247 оп.1 — опись метрик церквей Карачевского у.<\/a><\/li>\n        <li>Бедаревы: <a href=\"https://ya.ru/archive/catalog/85ebaabe-6fd7-41ce-ad20-7843617e0702/114\">Фива 1897 (ф.60 оп.1 д.657 ск.114)<\/a>; <a href=\"https://ya.ru/archive/catalog/3347c189-e4b0-4549-baf3-feb31396c927/53\">Серафим 1905, 2-й экземпляр (оп.5 д.31 ск.53)<\/a>; <a href=\"https://ya.ru/archive/catalog/01bc0367-b9e8-41e9-a143-5f333d189fdb/247\">Наталия 1881/82, крёстная Надежда Гри[горьева] (оп.5 д.1 ск.247)<\/a><\/li>\n        <li>Елескины: <a href=\"https://ya.ru/archive/catalog/bb2430b0-0121-44ef-a042-c1771c0d4b39/142\">смерть В. Д. Елескина 1917 (оп.6 д.63 ск.142)<\/a>; проверено без Ольги: оп.6 д.70 (1913), д.259 (1916–18), д.385 (Челухоево 1918), д.46 (1912 и 1914), оп.4 д.394 (1908–09)<\/li>\n        <li>Выдрины: ИАОО ф.16 оп.5 и оп.6 — Песчанская и Павлодарская церкви 1869–1889, все записи Выдриных (однофамильцы, связь не установлена)<\/li>\n        <li>Федосовы: <a href=\"https://gwar.mil.ru/heroes/chelovek_donesenie13463176/\">GWAR — Федосеев Иван, Рождественская вол.<\/a> (связь слабая); склейка «Пролейки» на Памяти народа — запись Федорова Я. В., не наш; наградные листы А. Ф. Федосова — домашний адрес пуст или скрыт<\/li>\n        <li>Фрайеры (сверка внешнего отчёта): <a href=\"https://www.osu.ru/sites/niisu/docs/germans.pdf#page=118\">воспоминания Анны Робертовны Фрайер — Выгода → Вологда → Норминга<\/a>; <a href=\"https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_02a/\">ДАОО Р-8220 оп.2а<\/a> и <a href=\"https://archive.od.gov.ua/wp-content/uploads/metrics/%D0%A4%D0%BE%D0%BD%D0%B4%D0%B8%20%D0%BD%D0%BE%D0%B2%D0%B8%D1%85%20%D0%B0%D0%BA%D1%82%D1%96%D0%B2/r_08001_08300/r_08201_08300/r_08220_01a/\">оп.1а<\/a> (описи рождений Беляевского р-на); <a href=\"https://bessmertnybarak.com/books/person/294838/\">Адольф Вильгельмович Фраер 1904<\/a><\/li>\n        <li>Бацовы: <a href=\"https://ru.wikipedia.org/wiki/Бацов,_Владимир_Иванович\">РГВИА ф.409 оп.1 п/с 259 (1912) — послужной список В. И. Бацова<\/a> (по ссылке в литературе). Соколовы: <a href=\"https://archives.kh.gov.ua/wp-content/uploads/2018/02/%D1%84.928-%D0%BE%D0%BF.1-%D1%82%D0%BE%D0%BC-2-%D1%87%D0%B0%D1%81%D1%82%D0%B8%D0%BD%D0%B0-2.pdf\">ДАХО ф.928 оп.1 д.3967 — С. С. Соколов 1906–1913<\/a>. Мотовы: <a href=\"https://familio.org/catalogs/mkgvozdnyabronnicy/persons/7b812254-aeec-440e-ba83-8b3152e2f76e\">Алексей Ильин Мотов, с. Михалёво — восприемник 1899<\/a> (кандидат в отцы Клавдии)<\/li>\n        <li>Фраер: <a href=\"https://www.blackseagr.org/research_church_odessa.html\">BSGR — метрики Фрейденталя 1902–1913<\/a>, <a href=\"https://hfdr.de/wp-content/uploads/2023/10/Repressierten_1930-1950_im_Odessa-Gebiet_6618.pdf\">репрессированные немцы Одесской обл.<\/a>; без результата — reabit.org.ua, «Поморский мемориал», DAI Wygoda<\/li>\n      <\/ul>\n    <\/section>\n\n    <section>\n      <h3>Найдено 31.10.2026<\/h3>\n      <ul>\n        <li><a href=\"https://www.moypolk.ru/soldier/rozina-aleksandra-markelovna\">Бессмертный полк — Розина А. М. (1923–2005)<\/a>; <a href=\"https://www.pobediteli.ru/russia/center/moskva/r/rix-roz/index.html\">pobediteli.ru — ветераны Москвы<\/a>; <a href=\"https://archive.org/details/turkestanskijfront19181923prikazpo16\">приказы Туркестанского фронта 1921<\/a>; <a href=\"https://archive.org/details/vsjamoskvaadresnajaispravochnajakniga74\">«Вся Москва» 1924<\/a><\/li>\n        <li>Память народа: <a href=\"https://pamyat-naroda.ru/heroes/memorial-chelovek_dopolnitelnoe_donesenie8263375/\">Елескин Дмитрий В. 1913 (анкета розыска, мать Христина Кондратьевна)<\/a>, <a href=\"https://pamyat-naroda.ru/heroes/memorial-chelovek_dopolnitelnoe_donesenie60939906/\">Елескин Николай В. 1923<\/a>, <a href=\"https://pamyat-naroda.ru/heroes/memorial-chelovek_donesenie54546535/\">Бедарев Василий И. 1908<\/a>, <a href=\"https://pamyat-naroda.ru/heroes/person-hero93204425/\">Федосов Александр Ф. 1920<\/a>, <a href=\"https://pamyat-naroda.ru/heroes/person-hero6318613/\">Выдрин Николай Д. 1897<\/a>, <a href=\"https://pamyat-naroda.ru/heroes/person-hero1489582/\">Федотов Семён В. 1916 (Вихляевка; вероятно, не наш)<\/a><\/li>\n        <li>Всекузбасская Книга памяти: <a href=\"https://mrech.ru/media/kniga_pamyati/Vsekuzbasskaya_Kniga_pamyati_t_4.pdf\">т. 4<\/a>, т. 16, <a href=\"https://mrech.ru/media/kniga_pamyati/Vsekuzbasskaya_Kniga_pamyati_t_17.pdf\">т. 17<\/a>; <a href=\"http://arhiv.pavlodar.gov.kz/images/files/kniga2017.pdf\">Книга памяти Павлодарской обл. т. 5<\/a><\/li>\n const X = n => n.x * SX - W / 2, Y = n => (MAXG - n.g) * GH;
const NS = "http://www.w3.org/2000/svg", world = document.getElementById("world");
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const female = n => /(вна|чна)$/.test(n.n.split(" ").slice(-1)[0]) || /^(Анна|Лидия|Ольга|Клавдия|Евдокия|Параскева|Екатерина|Александра)\b/.test(n.n);
const couple = n => / и /.test(n.n);
const parents = id => NODES.filter(p => p.c === id);
function side(n) { let cur = n; while (cur && cur.g > 2) cur = byId[cur.c]; return cur && cur.g === 2 ? (cur.id === "andrey" ? "по отцу" : "по матери") : ""; }
function kin(n) {
  if (n.g === 1) return "это ты";
  if (n.g === 2) return female(n) ? "мама" : "папа";
  const pra = "пра".repeat(Math.max(0, n.g - 3));
  const base = couple(n) ? pra + (n.g === 3 ? "бабушка и дедушка" : "деды") : pra + (female(n) ? "бабушка" : "дедушка");
  return base + (side(n) ? " " + side(n) : "");
}
const GEN = g => g === 1 ? "ты" : g === 2 ? "родители" : g === 3 ? "бабушки и дедушки" : g <= 6 ? "пра".repeat(g - 3) + "деды" : "пра×" + (g - 3) + " деды";

function draw() {
  const bg = el("g", {}, world), eg = el("g", {}, world), ng = el("g", {}, world);
  const minX = Math.min(...NODES.map(X)) - 210, maxX = Math.max(...NODES.map(X)) + W + 40;
  for (let g = 1; g <= MAXG; g++) {
    const y = (MAXG - g) * GH;
    el("rect", { class: "band", x: minX, y: y - 22, width: maxX - minX, height: H + 44, rx: 10 }, bg);
    el("text", { class: "band-n", x: minX + 16, y: y + 22 }, bg).textContent = g + "-е колено";
    el("text", { class: "band-r", x: minX + 16, y: y + 42 }, bg).textContent = GEN(g);
  }
  NODES.filter(n => n.c && byId[n.c]).forEach(p => {
    const c = byId[p.c], x1 = X(p) + W / 2, y1 = Y(p) + H, x2 = X(c) + W / 2, y2 = Y(c), my = y2 - 26;
    el("path", { d: `M${x1},${y1} V${my} H${x2} V${y2}`, class: "edge" + (p.st === "hyp" ? " hyp" : "") }, eg);
  });
  NODES.forEach(n => {
    const g = el("g", { class: `node ${n.st}`, transform: `translate(${X(n)},${Y(n)})`, tabindex: 0, role: "button", "aria-label": n.n, "data-id": n.id }, ng);
    el("rect", { class: "card", width: W, height: H, rx: 7 }, g);
    el("circle", { class: "gen", cx: W - 15, cy: 15, r: 10 }, g);
    el("text", { class: "gent", x: W - 15, y: 19, "text-anchor": "middle" }, g).textContent = n.g;
    el("text", { class: "nm", x: 12, y: 23 }, g).textContent = n.n.length > 24 ? n.n.slice(0, 23) + "…" : n.n;
    const sub = n.s.length > 32 ? n.s.slice(0, 31) + "…" : n.s;
    el("text", { class: "sb", x: 12, y: 42 }, g).textContent = sub;
    const meta = [];
    if (n.docs.length) meta.push("▤ " + n.docs.length);
    if (n.sibs.length) meta.push("⚭ " + n.sibs.length);
    el("text", { class: "meta", x: 12, y: 64 }, g).textContent = n.st === "living" ? "жив(а)" : meta.join("   ");
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id, true); } });
  });
}

const svg = document.getElementById("svg"), stage = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
const clampK = k => Math.min(3, Math.max(0.12, k));
function zoomAt(f, cx, cy) { const k = clampK(view.k * f); f = k / view.k; view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply(); }
function fit() { const b = world.getBBox(), r = svg.getBoundingClientRect(), pad = 24;
  const k = clampK(Math.min((r.width - pad * 2) / b.width, (r.height - pad * 2) / b.height));
  view.k = k; view.x = (r.width - b.width * k) / 2 - b.x * k; view.y = (r.height - b.height * k) / 2 - b.y * k; apply(); }
function centerOn(id, k) { const n = byId[id], r = svg.getBoundingClientRect(); if (k) view.k = k;
  view.x = r.width / 2 - (X(n) + W / 2) * view.k; view.y = r.height / 2 - (Y(n) + H / 2) * view.k; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const ptrs = new Map(); let moved = 0, pinch = null, downNode = null;
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  downNode = e.target.closest(".node"); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; } stage.classList.add("dragging"); });
svg.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; moved += 10; return; }
  const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy); view.x += dx; view.y += dy; apply(); });
const up = e => { if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { stage.classList.remove("dragging"); if (moved < 6 && downNode) select(downNode.dataset.id, false); } };
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
const mid = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById("zin").onclick = () => zoomAt(1.25, ...mid());
document.getElementById("zout").onclick = () => zoomAt(0.8, ...mid());
document.getElementById("zfit").onclick = fit;
document.getElementById("zme").onclick = () => { centerOn("mikhail", 1); select("mikhail", false); };

const panel = document.getElementById("panel");
function intro() {
  const n = NODES.length, docs = NODES.reduce((s, x) => s + x.docs.length, 0);
  panel.innerHTML = `<div class="eyebrow">Как читать</div><h2>Древо по документам</h2>
    <p class="note">${n} карточек, ${docs} привязанных документов. Колено считается от Михаила: ты — 1-е, родители — 2-е, бабушки и дедушки — 3-е.</p>
    <p class="note">Рамка карточки показывает, насколько доказан человек: сплошная — документами, синяя — одним документом, штрихи — со слов семьи, точки — гипотеза. Живые показаны только именем.</p>
    <p class="note">Колесо или щипок — масштаб, перетаскивание — сдвиг, клик — карточка человека. Кнопка «я» возвращает к началу древа.</p>`;
}
function relHtml(n) {
  const par = parents(n.id), kid = n.c && byId[n.c] ? [byId[n.c]] : [];
  const grp = (label, arr) => arr.length ? `<div class="sec"><h3>${label}</h3><div class="rel">${arr.map(a => `<button type="button" data-go="${a.id}">${esc(a.n)}</button>`).join("")}</div></div>` : "";
  return grp("Родители", par) + grp("Ребёнок по прямой линии", kid);
}
function select(id, center) {
  document.querySelectorAll(".node.sel").forEach(x => x.classList.remove("sel"));
  document.querySelector(`.node[data-id="${id}"]`)?.classList.add("sel");
  const n = byId[id]; if (center) centerOn(id);
  const sibs = n.sibs.length ? `<div class="sec"><h3>Братья и сёстры</h3><div class="sibs">${n.sibs.map(s => `<span title="${esc(s.d)}">${esc(s.n)}</span>`).join("")}</div>
    ${n.sibs.some(s => s.d) ? `<ul class="note">${n.sibs.filter(s => s.d).map(s => `<li>${esc(s.d)}</li>`).join("")}</ul>` : ""}</div>` : "";
  const docs = n.docs.length ? `<div class="sec"><h3>Документы · ${n.docs.length}</h3><div class="docs">${n.docs.map(d => `<div class="doc"><span class="t">${esc(d.t)}</span>
      <span class="r">${esc([d.d, d.ref].filter(Boolean).join(" · "))}</span>
      ${d.imgs.length ? `<div class="th">${d.imgs.map((im, i) => `<button type="button" data-doc="${d.id}" data-i="${i}" aria-label="Открыть скан"><img src="${im}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть источник ↗</a>` : ""}</div>`).join("")}</div></div>` : "";
  panel.innerHTML = `<div class="eyebrow">Карточка · ${n.g}-е колено</div><h2>${esc(n.name)}</h2>${n.years ? `<div class="years">${esc(n.years)}</div>` : ""}
    <div class="kin"><b>${n.g}-е колено</b> · ${esc(kin(n))}</div><span class="chip st-${n.st}">${ST[n.st] || n.st}</span>
    ${n.st === "living" ? `<p class="note sec">Живые родственники показаны только именем: даты, места и документы о них не публикуются.</p>` : `<div class="sec body">${n.body}</div>`}
    ${relHtml(n)}${sibs}${docs}`;
  panel.scrollTop = 0;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go, true));
  panel.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(n, b.dataset.doc, +b.dataset.i));
  panel.querySelectorAll(".body a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}

const lb = document.getElementById("lb");
function openDoc(n, id, i) {
  const d = n.docs.find(x => x.id === id);
  document.getElementById("lb-t").textContent = d.t;
  document.getElementById("lb-pic").innerHTML = `<img src="${d.imgs[i]}" alt="Скан: ${esc(d.t)}">`;
  document.getElementById("lb-f").innerHTML = `<code>${esc(d.ref)}</code>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть в источнике ↗</a>` : ""}`;
  lb.hidden = false; document.getElementById("lb-x").focus();
}
document.getElementById("lb-x").onclick = () => lb.hidden = true;
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });

const rd = document.getElementById("reading");
const openReading = (h, b) => { document.getElementById("rd-h").textContent = h; document.getElementById("rd-b").innerHTML = b;
  rd.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; }); rd.hidden = false; rd.scrollTop = 0; };
document.getElementById("open-gaps").onclick = () => openReading("Пробелы", DATA.gaps);
document.getElementById("open-src").onclick = () => openReading("Все источники", DATA.sources);
document.getElementById("rd-x").onclick = () => rd.hidden = true;
document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.hidden = true; rd.hidden = true; } });

const root = document.documentElement;
function setTheme(t) { if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  try { localStorage.setItem("genealogy-theme", t); } catch (e) {} }
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => setTheme(b.dataset.t));
let saved = null; try { saved = localStorage.getItem("genealogy-theme"); } catch (e) {}
setTheme(saved || "system");

draw(); intro();
requestAnimationFrame(() => { if (svg.getBoundingClientRect().width < 640) centerOn("mikhail", 0.9); else fit(); });
</script>
</body>
</html>
