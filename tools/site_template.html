<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Род Соколовых, Федосовых и Бедаревых</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=cyrillic">
<style>
/* Layout: full-height archive table — zoomable pedigree on the left, person dossier on the right (bottom half on phones). */
:root {
  --bg: #eef0ee; --canvas: #e6e9e6; --grid: #d6dbd7; --band: rgba(31,92,107,.055); --surface: #fbfcfa; --ink: #1d2422; --muted: #5d6763;
  --line: #9aa5a0; --accent: #1f5c6b; --accent-soft: #d5e6e9;
  --doc: #2f6b3f; --one: #3f6a8a; --fam: #8a5a12; --hyp: #8b3b56;
  --chip-doc: #dcebdf; --chip-one: #dbe6ef; --chip-fam: #f2e5cf; --chip-hyp: #f1dbe3;
  --f-display: "PT Serif", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131817; --canvas: #171d1c; --grid: #222a28; --band: rgba(124,192,207,.06); --surface: #1d2422; --ink: #e5ebe8; --muted: #9aa6a1;
    --line: #56625d; --accent: #7cc0cf; --accent-soft: #1f3a40; --doc: #8fd19e; --one: #8ab8de; --fam: #e2b668; --hyp: #e597b1;
    --chip-doc: #203a27; --chip-one: #1f3142; --chip-fam: #3d3020; --chip-hyp: #3e2430; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131817; --canvas: #171d1c; --grid: #222a28; --band: rgba(124,192,207,.06); --surface: #1d2422; --ink: #e5ebe8; --muted: #9aa6a1;
  --line: #56625d; --accent: #7cc0cf; --accent-soft: #1f3a40; --doc: #8fd19e; --one: #8ab8de; --fam: #e2b668; --hyp: #e597b1;
  --chip-doc: #203a27; --chip-one: #1f3142; --chip-fam: #3d3020; --chip-hyp: #3e2430; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
a { color: var(--accent); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--grid); }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-wrap: balance; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 20px; height: 11px; border-radius: 3px; border: 2px solid var(--line); }
.lg.doc { border-color: var(--doc); } .lg.one { border-color: var(--one); }
.lg.fam { border-color: var(--fam); border-style: dashed; } .lg.hyp { border-color: var(--hyp); border-style: dotted; }
.lg.living { border-style: dotted; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 8px; overflow: hidden; }
.seg button, .tab { font: inherit; font-size: .8rem; padding: 5px 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.main { display: grid; grid-template-columns: 1fr minmax(320px, 420px); min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; background-color: var(--canvas); overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
.stage.dragging { cursor: grabbing; }
svg { width: 100%; height: 100%; display: block; user-select: none; }
.band { fill: var(--band); }
.band-n { font-family: var(--f-display); font-weight: 700; font-size: 18px; fill: var(--ink); }
.band-r { font-family: var(--f-body); font-size: 12.5px; fill: var(--muted); }
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.edge.hyp { stroke: var(--hyp); stroke-dasharray: 2 5; stroke-linecap: round; }
.node { cursor: pointer; }
.node rect.card { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.node.doc rect.card { stroke: var(--doc); } .node.one rect.card { stroke: var(--one); }
.node.fam rect.card { stroke: var(--fam); stroke-dasharray: 6 4; }
.node.hyp rect.card { stroke: var(--hyp); stroke-dasharray: 2 4; stroke-linecap: round; }
.node.living rect.card { stroke-dasharray: 1 3; fill: var(--canvas); }
.node.sel rect.card { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
.node:hover rect.card { stroke-width: 2.6; }
.node .nm { font-family: var(--f-display); font-weight: 700; font-size: 14px; fill: var(--ink); }
.node .sb { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.node .meta { font-family: var(--f-mono); font-size: 10.5px; fill: var(--accent); }
.node .gen { fill: var(--accent-soft); }
.node .gent { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; fill: var(--accent); }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--grid); background: var(--surface); color: var(--ink); font: 600 18px/1 var(--f-body); cursor: pointer; }
.zoom button.fit { font-size: 11px; }
aside { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--grid);
  padding-block: 18px 32px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
aside h2 { font-family: var(--f-display); font-size: 1.4rem; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
.years { font-family: var(--f-mono); color: var(--muted); font-size: .85rem; }
.kin { margin-top: 6px; font-size: .86rem; } .kin b { color: var(--accent); }
.chip { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 8px; }
.st-doc { background: var(--chip-doc); color: var(--doc); } .st-one { background: var(--chip-one); color: var(--one); }
.st-fam { background: var(--chip-fam); color: var(--fam); } .st-hyp { background: var(--chip-hyp); color: var(--hyp); }
.st-living { background: var(--canvas); color: var(--muted); }
.sec { margin-top: 20px; }
.sec h3 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.body { font-size: .92rem; } .body p { margin: 0 0 .7em; } .body ul { padding-left: 1.2em; }
.body .src, .reading .src { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); }
.body .flag { border-left: 3px solid var(--hyp); padding-left: 10px; }
.sibs { display: flex; flex-wrap: wrap; gap: 6px; }
.sibs span { font-size: .8rem; border: 1px solid var(--grid); border-radius: 6px; padding: 2px 8px; }
.rel { display: flex; flex-wrap: wrap; gap: 6px; }
.rel button { font: inherit; font-size: .82rem; border: 1px solid var(--grid); background: transparent; color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.docs { display: grid; gap: 8px; }
.doc { display: grid; gap: 4px; border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.doc .t { font-weight: 600; font-size: .84rem; }
.doc .r { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.doc .th { display: flex; gap: 6px; flex-wrap: wrap; }
.doc .th button { padding: 0; border: 1px solid var(--grid); border-radius: 5px; overflow: hidden; cursor: zoom-in; background: var(--canvas); width: 120px; height: 56px; }
.doc .th img { width: 100%; height: 100%; object-fit: cover; object-position: left center; display: block; }
.note { color: var(--muted); font-size: .84rem; }
.reading { position: fixed; inset: 0; z-index: 15; background: var(--bg); overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.reading .inner { max-width: 760px; margin: 0 auto; }
.reading h2 { font-family: var(--f-display); }
.reading li { margin-bottom: .5em; }
.reading .close { position: sticky; top: 0; float: right; font: inherit; border: 1px solid var(--grid); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(8,12,11,.86); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lightbox .bar { display: flex; gap: 12px; align-items: center; color: #eef2f0; }
.lightbox .bar .t { font-weight: 600; flex: 1; min-width: 0; }
.lightbox .bar button { font: inherit; border: 1px solid #5d6a65; background: #1d2422; color: #eef2f0; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.lightbox .pic { min-height: 0; overflow: auto; display: grid; place-items: center; background: #0e1312; border-radius: 8px; }
.lightbox .pic img { max-width: none; width: min(1500px, 100%); height: auto; }
.lightbox .foot { color: #c9d2ce; font-size: .82rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.lightbox .foot code { font-family: var(--f-mono); } .lightbox a { color: #9fd6e2; }
@media (max-width: 760px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 1fr 48%; }
  aside { border-left: 0; border-top: 1px solid var(--grid); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend { display: none; } .tools { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Род Соколовых, Федосовых и Бедаревых</h1>
    <div class="legend" aria-label="Обозначения">
      <span><i class="lg doc"></i>подтверждено</span><span><i class="lg one"></i>один документ</span>
      <span><i class="lg fam"></i>со слов семьи</span><span><i class="lg hyp"></i>гипотеза</span><span><i class="lg living"></i>живые</span>
    </div>
    <div class="tools">
      <div class="seg"><button type="button" class="tab" id="open-gaps">Пробелы</button><button type="button" class="tab" id="open-src">Источники</button></div>
      <div class="seg" role="group" aria-label="Тема">
        <button type="button" data-t="light">Светлая</button><button type="button" data-t="dark">Тёмная</button><button type="button" data-t="system">Авто</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <svg id="svg" aria-label="Родословное древо"><g id="world"></g></svg>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Приблизить">+</button>
        <button type="button" id="zout" aria-label="Отдалить">−</button>
        <button type="button" id="zme" class="fit" aria-label="К Михаилу">я</button>
        <button type="button" id="zfit" class="fit" aria-label="Показать всё дерево">всё</button>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>
<div class="reading" id="reading" hidden><div class="inner"><button type="button" class="close" id="rd-x">Закрыть</button><h2 id="rd-h"></h2><div id="rd-b"></div></div></div>
<div class="lightbox" id="lb" hidden>
  <div class="bar"><div class="t" id="lb-t"></div><button type="button" id="lb-x">Закрыть</button></div>
  <div class="pic" id="lb-pic"></div>
  <div class="foot" id="lb-f"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const NODES = DATA.nodes, byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const ST = { doc: "подтверждено документами", one: "один документ", fam: "со слов семьи", hyp: "гипотеза", living: "живой человек — данные не публикуются" };
const W = 224, H = 78, SX = 1.4, GH = 150, MAXG = Math.max(...NODES.map(n => n.g));
const X = n => n.x * SX - W / 2, Y = n => (MAXG - n.g) * GH;
const NS = "http://www.w3.org/2000/svg", world = document.getElementById("world");
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const female = n => /(вна|чна)$/.test(n.n.split(" ").slice(-1)[0]) || /^(Анна|Лидия|Ольга|Клавдия|Евдокия|Параскева|Екатерина|Александра)\b/.test(n.n);
const couple = n => / и /.test(n.n);
const parents = id => NODES.filter(p => p.c === id);
function side(n) { let cur = n; while (cur && cur.g > 2) cur = byId[cur.c]; return cur && cur.g === 2 ? (cur.id === "andrey" ? "по отцу" : "по матери") : ""; }
function kin(n) {
  if (n.g === 1) return "это ты";
  if (n.g === 2) return female(n) ? "мама" : "папа";
  const pra = "пра".repeat(Math.max(0, n.g - 3));
  const base = couple(n) ? pra + (n.g === 3 ? "бабушка и дедушка" : "деды") : pra + (female(n) ? "бабушка" : "дедушка");
  return base + (side(n) ? " " + side(n) : "");
}
const GEN = g => g === 1 ? "ты" : g === 2 ? "родители" : g === 3 ? "бабушки и дедушки" : g <= 6 ? "пра".repeat(g - 3) + "деды" : "пра×" + (g - 3) + " деды";

function draw() {
  const bg = el("g", {}, world), eg = el("g", {}, world), ng = el("g", {}, world);
  const minX = Math.min(...NODES.map(X)) - 210, maxX = Math.max(...NODES.map(X)) + W + 40;
  for (let g = 1; g <= MAXG; g++) {
    const y = (MAXG - g) * GH;
    el("rect", { class: "band", x: minX, y: y - 22, width: maxX - minX, height: H + 44, rx: 10 }, bg);
    el("text", { class: "band-n", x: minX + 16, y: y + 22 }, bg).textContent = g + "-е колено";
    el("text", { class: "band-r", x: minX + 16, y: y + 42 }, bg).textContent = GEN(g);
  }
  NODES.filter(n => n.c && byId[n.c]).forEach(p => {
    const c = byId[p.c], x1 = X(p) + W / 2, y1 = Y(p) + H, x2 = X(c) + W / 2, y2 = Y(c), my = y2 - 26;
    el("path", { d: `M${x1},${y1} V${my} H${x2} V${y2}`, class: "edge" + (p.st === "hyp" ? " hyp" : "") }, eg);
  });
  NODES.forEach(n => {
    const g = el("g", { class: `node ${n.st}`, transform: `translate(${X(n)},${Y(n)})`, tabindex: 0, role: "button", "aria-label": n.n, "data-id": n.id }, ng);
    el("rect", { class: "card", width: W, height: H, rx: 7 }, g);
    el("circle", { class: "gen", cx: W - 15, cy: 15, r: 10 }, g);
    el("text", { class: "gent", x: W - 15, y: 19, "text-anchor": "middle" }, g).textContent = n.g;
    el("text", { class: "nm", x: 12, y: 23 }, g).textContent = n.n.length > 24 ? n.n.slice(0, 23) + "…" : n.n;
    const sub = n.s.length > 32 ? n.s.slice(0, 31) + "…" : n.s;
    el("text", { class: "sb", x: 12, y: 42 }, g).textContent = sub;
    const meta = [];
    if (n.docs.length) meta.push("▤ " + n.docs.length);
    if (n.sibs.length) meta.push("⚭ " + n.sibs.length);
    el("text", { class: "meta", x: 12, y: 64 }, g).textContent = n.st === "living" ? "жив(а)" : meta.join("   ");
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id, true); } });
  });
}

const svg = document.getElementById("svg"), stage = document.getElementById("stage");
let view = { x: 0, y: 0, k: 1 };
const apply = () => world.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
const clampK = k => Math.min(3, Math.max(0.12, k));
function zoomAt(f, cx, cy) { const k = clampK(view.k * f); f = k / view.k; view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply(); }
function fit() { const b = world.getBBox(), r = svg.getBoundingClientRect(), pad = 24;
  const k = clampK(Math.min((r.width - pad * 2) / b.width, (r.height - pad * 2) / b.height));
  view.k = k; view.x = (r.width - b.width * k) / 2 - b.x * k; view.y = (r.height - b.height * k) / 2 - b.y * k; apply(); }
function centerOn(id, k) { const n = byId[id], r = svg.getBoundingClientRect(); if (k) view.k = k;
  view.x = r.width / 2 - (X(n) + W / 2) * view.k; view.y = r.height / 2 - (Y(n) + H / 2) * view.k; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const ptrs = new Map(); let moved = 0, pinch = null, downNode = null;
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
  downNode = e.target.closest(".node"); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; } stage.classList.add("dragging"); });
svg.addEventListener("pointermove", e => { if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY }; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    zoomAt(d / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch.d = d; moved += 10; return; }
  const dx = cur.x - prev.x, dy = cur.y - prev.y; moved += Math.abs(dx) + Math.abs(dy); view.x += dx; view.y += dy; apply(); });
const up = e => { if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { stage.classList.remove("dragging"); if (moved < 6 && downNode) select(downNode.dataset.id, false); } };
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
const mid = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById("zin").onclick = () => zoomAt(1.25, ...mid());
document.getElementById("zout").onclick = () => zoomAt(0.8, ...mid());
document.getElementById("zfit").onclick = fit;
document.getElementById("zme").onclick = () => { centerOn("mikhail", 1); select("mikhail", false); };

const panel = document.getElementById("panel");
function intro() {
  const n = NODES.length, docs = NODES.reduce((s, x) => s + x.docs.length, 0);
  panel.innerHTML = `<div class="eyebrow">Как читать</div><h2>Древо по документам</h2>
    <p class="note">${n} карточек, ${docs} привязанных документов. Колено считается от Михаила: ты — 1-е, родители — 2-е, бабушки и дедушки — 3-е.</p>
    <p class="note">Рамка карточки показывает, насколько доказан человек: сплошная — документами, синяя — одним документом, штрихи — со слов семьи, точки — гипотеза. Живые показаны только именем.</p>
    <p class="note">Колесо или щипок — масштаб, перетаскивание — сдвиг, клик — карточка человека. Кнопка «я» возвращает к началу древа.</p>`;
}
function relHtml(n) {
  const par = parents(n.id), kid = n.c && byId[n.c] ? [byId[n.c]] : [];
  const grp = (label, arr) => arr.length ? `<div class="sec"><h3>${label}</h3><div class="rel">${arr.map(a => `<button type="button" data-go="${a.id}">${esc(a.n)}</button>`).join("")}</div></div>` : "";
  return grp("Родители", par) + grp("Ребёнок по прямой линии", kid);
}
function select(id, center) {
  document.querySelectorAll(".node.sel").forEach(x => x.classList.remove("sel"));
  document.querySelector(`.node[data-id="${id}"]`)?.classList.add("sel");
  const n = byId[id]; if (center) centerOn(id);
  const sibs = n.sibs.length ? `<div class="sec"><h3>Братья и сёстры</h3><div class="sibs">${n.sibs.map(s => `<span title="${esc(s.d)}">${esc(s.n)}</span>`).join("")}</div>
    ${n.sibs.some(s => s.d) ? `<ul class="note">${n.sibs.filter(s => s.d).map(s => `<li>${esc(s.d)}</li>`).join("")}</ul>` : ""}</div>` : "";
  const docs = n.docs.length ? `<div class="sec"><h3>Документы · ${n.docs.length}</h3><div class="docs">${n.docs.map(d => `<div class="doc"><span class="t">${esc(d.t)}</span>
      <span class="r">${esc([d.d, d.ref].filter(Boolean).join(" · "))}</span>
      ${d.imgs.length ? `<div class="th">${d.imgs.map((im, i) => `<button type="button" data-doc="${d.id}" data-i="${i}" aria-label="Открыть скан"><img src="${im}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
      ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть источник ↗</a>` : ""}</div>`).join("")}</div></div>` : "";
  panel.innerHTML = `<div class="eyebrow">Карточка · ${n.g}-е колено</div><h2>${esc(n.name)}</h2>${n.years ? `<div class="years">${esc(n.years)}</div>` : ""}
    <div class="kin"><b>${n.g}-е колено</b> · ${esc(kin(n))}</div><span class="chip st-${n.st}">${ST[n.st] || n.st}</span>
    ${n.st === "living" ? `<p class="note sec">Живые родственники показаны только именем: даты, места и документы о них не публикуются.</p>` : `<div class="sec body">${n.body}</div>`}
    ${relHtml(n)}${sibs}${docs}`;
  panel.scrollTop = 0;
  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go, true));
  panel.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(n, b.dataset.doc, +b.dataset.i));
  panel.querySelectorAll(".body a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}

const lb = document.getElementById("lb");
function openDoc(n, id, i) {
  const d = n.docs.find(x => x.id === id);
  document.getElementById("lb-t").textContent = d.t;
  document.getElementById("lb-pic").innerHTML = `<img src="${d.imgs[i]}" alt="Скан: ${esc(d.t)}">`;
  document.getElementById("lb-f").innerHTML = `<code>${esc(d.ref)}</code>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Открыть в источнике ↗</a>` : ""}`;
  lb.hidden = false; document.getElementById("lb-x").focus();
}
document.getElementById("lb-x").onclick = () => lb.hidden = true;
lb.addEventListener("click", e => { if (e.target === lb) lb.hidden = true; });

const rd = document.getElementById("reading");
const openReading = (h, b) => { document.getElementById("rd-h").textContent = h; document.getElementById("rd-b").innerHTML = b;
  rd.querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; }); rd.hidden = false; rd.scrollTop = 0; };
document.getElementById("open-gaps").onclick = () => openReading("Пробелы", DATA.gaps);
document.getElementById("open-src").onclick = () => openReading("Все источники", DATA.sources);
document.getElementById("rd-x").onclick = () => rd.hidden = true;
document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.hidden = true; rd.hidden = true; } });

const root = document.documentElement;
function setTheme(t) { if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  document.querySelectorAll("[data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
  try { localStorage.setItem("genealogy-theme", t); } catch (e) {} }
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => setTheme(b.dataset.t));
let saved = null; try { saved = localStorage.getItem("genealogy-theme"); } catch (e) {}
setTheme(saved || "system");

draw(); intro();
requestAnimationFrame(() => { if (svg.getBoundingClientRect().width < 640) centerOn("mikhail", 0.9); else fit(); });
</script>
</body>
</html>
